services:
  - type: web
    runtime: node
    name: keelson-api
    plan: 0.5c-512mb
    region: oregon
    buildCommand: npm install -g pnpm@12.16.1 && pnpm install --frozen-lockfile && pnpm turbo run build --filter=@keelson/api...
    preDeployCommand: pnpm migrate
    startCommand: pnpm --filter @keelson/api start
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - services/api/**
        - services/agent/**
        - services/redteam/**
        - services/mcp/**
        - packages/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - turbo.json
        - tsconfig.base.json
        - .node-version
        - render.yaml
        - engine/tee/measurements.json
        - apps/landing/public/llms.txt
        - apps/landing/public/skill.md
    domains:
      - api.keelson.finance
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: keelson-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: keelson-kv
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_MERCHANT_ID
        value: A4WCRYD5EYDF2
      - key: BETTER_AUTH_URL
        value: https://api.keelson.finance
      - key: APP_ORIGIN
        value: https://app.keelson.finance
      # sync: false is ignored inside environment groups, so these secrets are prompted for here.
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TEE_A_URL
        sync: false
      - key: TEE_B_URL
        sync: false
      - key: KEELSON_TEE_TOKEN
        sync: false
      - key: KEELSON_ISSUER_THUMBPRINT
        sync: false
      - key: LOG_URL
        value: http://keelson-log:8081
      - key: PROVER_URL
        value: http://keelson-prover:10000
      - key: LOG_WRITE_TOKEN
        sync: false
      - key: KEELSON_EVIDENCE_AGE_IDENTITY
        sync: false
      - key: KEELSON_EVIDENCE_AGE_RECIPIENT
        sync: false
      - key: CHANNEL3_API_KEY
        sync: false
      - key: CHANNEL3_WEBHOOK_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      # The relayer signs with KMS keys only this IAM user may use; reads go through the provider RPC.
      - key: ARBITRUM_SEPOLIA_RPC_URL
        sync: false
      - key: ARBITRUM_SEPOLIA_WSS_URL
        sync: false
      - key: RELAYER_KMS_KEY_SANDBOX
        value: alias/keelson-relayer-arbitrum-sepolia
      - key: RELAYER_AWS_ACCESS_KEY_ID
        sync: false
      - key: RELAYER_AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: us-west-2
      # Pays from Keelson's treasury the verdicts the chain refuses although they hold.
      - key: KEELSON_TREASURY_KEY
        sync: false
      - key: DISPUTE_WORKFLOW
        value: keelson-workflows
      - key: RENDER_API_KEY
        sync: false
      # The shopping agent's browsers, for its one-off runs against this service.
      - key: KERNEL_API_KEY
        sync: false
      # The private JWK of the shopping agent's cnf key, the one the demo operator links.
      - key: KEELSON_AGENT_KEY
        sync: false
      # The private Ed25519 JWK the shopping agent signs its RFC 9421 requests with (Visa TAP, Web Bot Auth).
      - key: KEELSON_AGENT_HTTP_KEY
        sync: false
      # The invite in the hackathon's testing instructions: it lets judges past the daily cap.
      - key: JUDGE_INVITE_CODE
        sync: false
      # Phone alerts: the VAPID key pair (RFC 8292) and its contact, a mailto: URI.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      # Alert emails, sent from notify@keelson.finance.
      - key: RESEND_API_KEY
        sync: false
      - fromGroup: keelson-secrets

  # Dispute evaluation runs as Render Workflows tasks, started by the API with the task slug.
  - type: workflow
    runtime: node
    name: keelson-workflows
    region: oregon
    # Red-team attacks drive a headless Chromium installed into node_modules (PLAYWRIGHT_BROWSERS_PATH=0).
    buildCommand: npm install -g pnpm@12.16.1 && pnpm install --frozen-lockfile && pnpm turbo run build --filter=@keelson/api... && pnpm --filter @keelson/api exec playwright install chromium-headless-shell
    startCommand: pnpm --filter @keelson/api workflows
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - services/api/**
        - services/agent/**
        - services/redteam/**
        - services/mcp/**
        - packages/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - turbo.json
        - tsconfig.base.json
        - .node-version
        - render.yaml
        - engine/tee/measurements.json
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: keelson-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: keelson-kv
          property: connectionString
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_MERCHANT_ID
        value: A4WCRYD5EYDF2
      - key: LOG_URL
        value: http://keelson-log:8081
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: TEE_A_URL
        sync: false
      - key: TEE_B_URL
        sync: false
      - key: KEELSON_TEE_TOKEN
        sync: false
      - key: ARBITRUM_SEPOLIA_RPC_URL
        sync: false
      - key: LOG_WRITE_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # Settles verdicts on chain through the relayer's KMS key.
      - key: RELAYER_KMS_KEY_SANDBOX
        value: alias/keelson-relayer-arbitrum-sepolia
      - key: AWS_REGION
        value: us-west-2
      - key: RELAYER_AWS_ACCESS_KEY_ID
        sync: false
      - key: RELAYER_AWS_SECRET_ACCESS_KEY
        sync: false
      - key: KEELSON_TREASURY_KEY
        sync: false
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: "0"
      # The red team plants its attacks through the store's listing API.
      - key: STORE_ATTACK_TOKEN
        fromService:
          type: web
          name: keelson-store
          envVarKey: STORE_ATTACK_TOKEN

  # Proves public product endpoints to the notary on leg A; reachable on the private network only.
  - type: pserv
    runtime: docker
    name: keelson-prover
    plan: 0.5c-512mb
    region: oregon
    dockerfilePath: ./engine/tlsn/Dockerfile
    dockerContext: .
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - engine/**
        - Cargo.toml
        - Cargo.lock
    envVars:
      - key: PORT
        value: "10000"
      # TEE_A_URL and KEELSON_TEE_TOKEN.
      - fromGroup: keelson-secrets

  - type: web
    runtime: docker
    name: keelson-log
    plan: 0.5c-512mb
    region: oregon
    dockerfilePath: ./services/log/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - services/log/**
        - internal/**
        - go.mod
        - go.sum
        - render.yaml
    # Tessera's POSIX storage; a disk keeps the service on one instance.
    disk:
      name: keelson-log
      mountPath: /var/lib/keelson-log
      sizeGB: 10
    domains:
      - log.keelson.finance
    envVars:
      - key: PORT
        value: "10000"
      - key: LOG_DATA_DIR
        value: /var/lib/keelson-log
      - key: LOG_PRIVATE_ADDR
        value: ":8081"
      - key: DATABASE_URL
        fromDatabase:
          name: keelson-db
          property: connectionString
      - key: KEELSON_VERIFYING_CONTRACT
        value: "0xe16E8767EC1DA59Ef0D9Bc7851637E4D22352d96"
      - key: LOG_SIGNER_KEY_SANDBOX
        sync: false
      - key: LOG_MLDSA_SEED_SANDBOX
        sync: false
      - key: LOG_SIGNER_KEY_LIVE
        sync: false
      - key: LOG_MLDSA_SEED_LIVE
        sync: false
      - key: LOG_WRITE_TOKEN_SHA256
        sync: false
      - key: SIGSUM_SUBMIT_KEY
        sync: false
      # On-chain anchoring of the sandbox origin; the live origin anchors once ARBITRUM_ONE_RPC_URL is set.
      - key: CHECKPOINT_ANCHOR_ADDRESS
        value: "0x049621749722D0660d5026456F25192fBD9A57ab"
      - key: ARBITRUM_SEPOLIA_RPC_URL
        sync: false
      - key: ANCHOR_SUBMITTER_KEY
        sync: false
      - key: TEE_A_URL
        sync: false
      - key: TEE_B_URL
        sync: false
      - key: KEELSON_TEE_TOKEN
        sync: false

  - type: web
    runtime: image
    name: keelson-witness-1
    plan: 0.5c-512mb
    region: oregon
    image:
      url: ghcr.io/davidzapataoh/keelson-witness@sha256:bb2569fe652c17ab91a7216336d4b7c5e1d8670ddee3bc59069df7efeb7bb28c
    healthCheckPath: /
    # The witness's SQLite state; a witness that lost it would cosign a rolled-back tree.
    disk:
      name: keelson-witness-1
      mountPath: /data
      sizeGB: 1
    domains:
      - witness-1.keelson.finance
    envVars:
      - key: PORT
        value: "7380"
      - key: DB
        value: /data/litewitness.db
      - key: WITNESS_NAME
        value: witness-1.keelson.finance
      - key: WITNESS_KEY
        sync: false

  # The demo merchant's store, on its own origin; RunFast is a PayPal sandbox business account.
  - type: web
    runtime: node
    name: keelson-store
    plan: 0.5c-512mb
    region: oregon
    buildCommand: npm install -g pnpm@12.16.1 && pnpm install --frozen-lockfile && pnpm turbo run build --filter=@keelson/store...
    startCommand: pnpm --filter @keelson/store start
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - apps/store/**
        - packages/core/**
        - packages/paypal/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - turbo.json
        - tsconfig.base.json
        - .node-version
        - render.yaml
    domains:
      - store.keelson.finance
    envVars:
      - key: NODE_ENV
        value: production
      - key: STORE_ORIGIN
        value: https://store.keelson.finance
      - key: PAYPAL_ENV
        value: sandbox
      # The store sells as RunFast with the same sandbox REST app the API holds and captures with.
      - key: PAYPAL_CLIENT_ID
        fromService:
          type: web
          name: keelson-api
          envVarKey: PAYPAL_CLIENT_ID
      - key: PAYPAL_CLIENT_SECRET
        fromService:
          type: web
          name: keelson-api
          envVarKey: PAYPAL_CLIENT_SECRET
      # Ephemeral attack listings live in Key Value with a TTL.
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: keelson-kv
          property: connectionString
      # Bearer token of the red team's listing calls.
      - key: STORE_ATTACK_TOKEN
        generateValue: true
      # The demo agent platform at /platform asks Keelson for mandates as the demo agent's client,
      # and embeds the approval on the store's onrender.com origin, a site other than Keelson's.
      - key: PLATFORM_ORIGIN
        value: https://keelson-store.onrender.com
      - key: KEELSON_CLIENT_ID
        fromService:
          type: web
          name: keelson-api
          envVarKey: KEELSON_CLIENT_ID
      - key: KEELSON_CLIENT_SECRET
        fromService:
          type: web
          name: keelson-api
          envVarKey: KEELSON_CLIENT_SECRET

  - type: web
    runtime: static
    name: keelson-landing
    buildCommand: npm install -g pnpm@12.16.1 && pnpm install --frozen-lockfile && pnpm turbo run build --filter=@keelson/landing
    staticPublishPath: ./apps/landing/dist
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - apps/landing/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - turbo.json
        - .node-version
        - render.yaml
    # Render adds www.keelson.finance and redirects it to the apex when the apex is added.
    domains:
      - keelson.finance
    headers:
      - path: /_astro/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY

  - type: web
    runtime: static
    name: keelson-verify
    buildCommand: npm install -g pnpm@12.16.1 && pnpm install --frozen-lockfile && pnpm turbo run build --filter=@keelson/verify
    staticPublishPath: ./apps/verify/dist
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - apps/verify/**
        - packages/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - turbo.json
        - tsconfig.base.json
        - .node-version
        - render.yaml
    domains:
      - verify.keelson.finance
    routes:
      - type: rewrite
        source: /a/*
        destination: /index.html
      - type: rewrite
        source: /v/*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self' data: https://api.keelson.finance https://log.keelson.finance https:; img-src 'self' blob: data:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors https://keelson.finance https://app.keelson.finance"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer

  - type: web
    runtime: static
    name: keelson-web
    buildCommand: npm install -g pnpm@12.16.1 && pnpm install --frozen-lockfile && pnpm turbo run build --filter=@keelson/web
    staticPublishPath: ./apps/web/out
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - apps/web/**
        - packages/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - turbo.json
        - tsconfig.base.json
        - .node-version
        - render.yaml
    domains:
      - app.keelson.finance
    envVars:
      # The embedded approval's markup is served by the API, so its assets are absolute.
      - key: NEXT_PUBLIC_ASSET_ORIGIN
        value: https://app.keelson.finance
    headers:
      - path: /_next/static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # Fonts load cross-origin into the embedded approval, which the API serves.
      - path: /_next/static/*
        name: Access-Control-Allow-Origin
        value: https://api.keelson.finance
      - path: /embed/v1.js
        name: Cache-Control
        value: public, max-age=300
      # The service worker is checked for updates on every navigation.
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /embed/v1.js
        name: Cross-Origin-Resource-Policy
        value: cross-origin
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://*.paypal.com https://*.paypalobjects.com; style-src 'self' 'unsafe-inline'; connect-src 'self' data: https://api.keelson.finance https://*.paypal.com https://*.paypalobjects.com; img-src 'self' data: blob: https://*.paypal.com https://*.paypalobjects.com; frame-src https://*.paypal.com https://*.kernel.sh https://verify.keelson.finance; worker-src 'self' blob:; font-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

  - type: keyvalue
    name: keelson-kv
    plan: 256mb
    region: oregon
    ipAllowList: []
    maxmemoryPolicy: noeviction

databases:
  - name: keelson-db
    plan: 0.5c-1g
    region: oregon
    postgresMajorVersion: "18"
    ipAllowList: []

envVarGroups:
  - name: keelson-secrets
    envVars:
      - key: BETTER_AUTH_SECRET
        generateValue: true
