services:
  - type: web
    runtime: node
    name: keelson-api
    plan: 0.5c-512mb
    region: oregon
    buildCommand: npm install -g pnpm@12.16.1 && pnpm install --frozen-lockfile && pnpm turbo run build --filter=@keelson/api...
    preDeployCommand: pnpm migrate
    startCommand: pnpm --filter @keelson/api start
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - services/api/**
        - packages/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - turbo.json
        - tsconfig.base.json
        - .node-version
        - render.yaml
        - engine/tee/measurements.json
    domains:
      - api.keelson.finance
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: keelson-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: keelson-kv
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: PAYPAL_ENV
        value: sandbox
      - key: BETTER_AUTH_URL
        value: https://api.keelson.finance
      - key: APP_ORIGIN
        value: https://app.keelson.finance
      # sync: false is ignored inside environment groups, so these secrets are prompted for here.
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TEE_A_URL
        sync: false
      - key: TEE_B_URL
        sync: false
      - key: KEELSON_TEE_TOKEN
        sync: false
      - key: KEELSON_ISSUER_THUMBPRINT
        sync: false
      - key: LOG_URL
        value: http://keelson-log:8081
      - key: LOG_WRITE_TOKEN
        sync: false
      - fromGroup: keelson-secrets

  - type: web
    runtime: docker
    name: keelson-log
    plan: 0.5c-512mb
    region: oregon
    dockerfilePath: ./services/log/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - services/log/**
        - internal/**
        - go.mod
        - go.sum
        - render.yaml
    # Tessera's POSIX storage; a disk keeps the service on one instance.
    disk:
      name: keelson-log
      mountPath: /var/lib/keelson-log
      sizeGB: 10
    domains:
      - log.keelson.finance
    envVars:
      - key: LOG_DATA_DIR
        value: /var/lib/keelson-log
      - key: LOG_PRIVATE_ADDR
        value: ":8081"
      - key: DATABASE_URL
        fromDatabase:
          name: keelson-db
          property: connectionString
      - key: KEELSON_VERIFYING_CONTRACT
        value: "0x0000000000000000000000000000000000000000"
      - key: LOG_SIGNER_KEY_SANDBOX
        sync: false
      - key: LOG_MLDSA_SEED_SANDBOX
        sync: false
      - key: LOG_SIGNER_KEY_LIVE
        sync: false
      - key: LOG_MLDSA_SEED_LIVE
        sync: false
      - key: LOG_WRITE_TOKEN_SHA256
        sync: false

  - type: web
    runtime: static
    name: keelson-landing
    buildCommand: npm install -g pnpm@12.16.1 && pnpm install --frozen-lockfile && pnpm turbo run build --filter=@keelson/landing
    staticPublishPath: ./apps/landing/dist
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - apps/landing/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - turbo.json
        - .node-version
        - render.yaml
    # Render adds www.keelson.finance and redirects it to the apex when the apex is added.
    domains:
      - keelson.finance
    headers:
      - path: /_astro/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY

  - type: keyvalue
    name: keelson-kv
    plan: 256mb
    region: oregon
    ipAllowList: []
    maxmemoryPolicy: noeviction

databases:
  - name: keelson-db
    plan: 0.5c-1g
    region: oregon
    postgresMajorVersion: "18"
    ipAllowList: []

envVarGroups:
  - name: keelson-secrets
    envVars:
      - key: BETTER_AUTH_SECRET
        generateValue: true
