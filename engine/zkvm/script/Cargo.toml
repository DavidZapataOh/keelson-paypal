[package]
name = "keelson-engine-proof"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
alloy-primitives = "1.7.3"
keelson-policy = { path = "../../policy", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sp1-sdk = { version = "=6.10.0", features = ["blocking", "native-gnark", "network", "profiling"] }

[build-dependencies]
sp1-build = "=6.10.0"
