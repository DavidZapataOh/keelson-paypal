[package]
name = "keelson-tlsn"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "keelson-prover"
path = "src/main.rs"
required-features = ["prover"]

[features]
# The prover service: an HTTP API that proves product endpoints to the notary on leg A.
prover = [
    "dep:axum",
    "dep:rustls",
    "dep:serde_json",
    "dep:tokio-rustls",
    "dep:webpki-roots",
    "tokio/rt-multi-thread",
]

[dependencies]
axum = { version = "0.8.9", optional = true, default-features = false, features = ["http1", "json", "tokio"] }
futures = "0.3.31"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
rustls = { version = "0.23.46", optional = true, default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }
thiserror = "2"
tlsn = { git = "https://github.com/tlsnotary/tlsn", tag = "v0.1.0-alpha.15", features = ["mozilla-certs"] }
tokio = { version = "1.54.1", features = ["macros", "net", "time"] }
tokio-rustls = { version = "0.26.6", optional = true, default-features = false, features = ["ring", "tls12"] }
tokio-util = { version = "0.7.18", features = ["compat", "rt"] }
webpki-roots = { version = "1", optional = true }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }
sha2 = "0.11.1"
