[package]
name = "keelson-core"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ciborium = { version = "0.2.2", optional = true }
coset = { version = "0.4.2", optional = true }
ed25519-dalek = { version = "3.0.0", default-features = false, optional = true }
acir = "1.0.0"
alloy-primitives = "1.7.3"
alloy-sol-types = "1.7.3"
bn254_blackbox_solver = "1.0.0"
serde_json = "1"
serde_jcs = "0.2.0"
sha2 = "0.11.1"

[features]
# SCITT statements and receipts; off in the zkVM program, whose verifying key it would change.
statement = ["dep:ciborium", "dep:coset", "dep:ed25519-dalek"]

[dev-dependencies]
keelson-core = { path = ".", features = ["statement"] }
serde = { version = "1", features = ["derive"] }
