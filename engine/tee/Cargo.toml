[package]
name = "keelson-tee"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
aes-gcm = { version = "0.11.1", features = ["zeroize"] }
alloy-primitives = "1.7.3"
alloy-sol-types = "1.7.3"
hkdf = "0.13.0"
k256 = { version = "0.14.0", default-features = false, features = ["ecdsa", "getrandom", "std"] }
keelson-core = { path = "../core" }
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa", "std"] }
# `zeroize` wipes the HKDF and HMAC hash states on drop.
sha2 = { version = "0.11.1", features = ["zeroize"] }
zeroize = "1.9.1"

[dev-dependencies]
alloy-primitives = { version = "1.7.3", features = ["k256"] }
keelson-mandate = { path = "../mandate" }
keelson-policy = { path = "../policy" }
serde_json = "1"
