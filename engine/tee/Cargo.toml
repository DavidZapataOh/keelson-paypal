[package]
name = "keelson-tee"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "keelson-engine"
path = "src/main.rs"

[features]
# Leg A on Intel TDX: the dstack guest agent and the Arbitrum Sepolia RPC.
tdx = [
    "dep:http-body-util",
    "dep:hyper",
    "dep:hyper-util",
    "dep:reqwest",
    "dep:rmpv",
    "dep:rustls",
    "tokio/time",
]

# Leg B in an AWS Nitro Enclave: NSM attestation and vsock serving.
nitro = [
    "dep:aws-nitro-enclaves-nsm-api",
    "dep:serde_bytes",
    "dep:serde_cbor",
    "dep:tokio-vsock",
    "dep:tower",
    "tokio/sync",
    "tokio/time",
]

[dependencies]
aes-gcm = { version = "0.11.1", features = ["zeroize"] }
alloy-primitives = { version = "1.7.3", features = ["serde"] }
alloy-sol-types = "1.7.3"
aws-nitro-enclaves-nsm-api = { version = "=0.5.2", optional = true }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
base64 = "0.23.1"
getrandom = "0.4.3"
hkdf = "0.13.0"
http-body-util = { version = "0.1.5", optional = true }
hyper = { version = "1.12.0", optional = true, features = ["client", "http1"] }
hyper-util = { version = "0.1.21", optional = true, features = ["tokio"] }
k256 = { version = "0.14.0", default-features = false, features = ["ecdsa", "getrandom", "std"] }
keelson-canon = { path = "../canon" }
keelson-core = { path = "../core" }
keelson-mandate = { path = "../mandate" }
keelson-policy = { path = "../policy", default-features = false }
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa", "std"] }
# TLS on rustls with the ring provider: no aws-lc-sys and no cmake in the image build.
reqwest = { version = "0.13.5", optional = true, default-features = false, features = ["form", "json", "rustls-no-provider"] }
rmpv = { version = "1.3.1", optional = true }
rustls = { version = "0.23.46", optional = true, default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_bytes = { version = "0.11.19", optional = true }
serde_cbor = { version = "0.11.2", optional = true }
serde_json = "1"
# `zeroize` wipes the HKDF and HMAC hash states on drop.
sha2 = { version = "0.11.1", features = ["zeroize"] }
subtle = "2.6.1"
time = { version = "0.3.55", features = ["formatting", "macros", "parsing"] }
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread"] }
tokio-vsock = { version = "=0.7.3", optional = true, features = ["axum08"] }
tower = { version = "0.5.3", optional = true, features = ["util"] }
ulid = { version = "3.0.0", features = ["serde"] }
zeroize = "1.9.1"

[dev-dependencies]
alloy-primitives = { version = "1.7.3", features = ["k256", "serde"] }
criterion = { version = "0.8.2", default-features = false }
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }

[[test]]
name = "tdx"
required-features = ["tdx"]

[[test]]
name = "tdx_simulator"
required-features = ["tdx"]

[[test]]
name = "paypal_sandbox"
required-features = ["tdx"]

[[test]]
name = "tdx_live"
required-features = ["tdx"]

[[test]]
name = "nitro_live"
required-features = ["tdx", "nitro"]

[[bench]]
name = "countersign"
harness = false
