services:
  engine:
    image: ghcr.io/davidzapataoh/keelson-engine@sha256:fb81b34c3c24894cd5f8d3f7fbd571c1339193bcc6a7213346edd96034ebb0ef
    command: ["--platform", "tdx", "--listen", "tcp:0.0.0.0:8080"]
    ports:
      - "8080:8080"
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
      - data:/data
    environment:
      - KEELSON_OCI_DIGEST=sha256:fb81b34c3c24894cd5f8d3f7fbd571c1339193bcc6a7213346edd96034ebb0ef
      - KEELSON_CANONICALIZER=keelson-canon/0.0.0
      - KEELSON_ORIGIN=https://app.keelson.finance
      - KEELSON_TEE_TOKEN_SHA256=${KEELSON_TEE_TOKEN_SHA256}
      - PAYPAL_CLIENT_ID=${PAYPAL_CLIENT_ID}
      - PAYPAL_CLIENT_SECRET=${PAYPAL_CLIENT_SECRET}
    restart: unless-stopped

volumes:
  data:
