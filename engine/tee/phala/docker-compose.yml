services:
  engine:
    image: ghcr.io/davidzapataoh/keelson-engine@sha256:facc94131bfed1342a3154157c485aec8dd3d6a3a103aad365ab7ac469c66bda
    command: ["--platform", "tdx", "--listen", "tcp:0.0.0.0:8080"]
    ports:
      - "8080:8080"
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
      - data:/data
    environment:
      - KEELSON_OCI_DIGEST=sha256:facc94131bfed1342a3154157c485aec8dd3d6a3a103aad365ab7ac469c66bda
      - KEELSON_CANONICALIZER=keelson-canon/0.0.0
      - KEELSON_ORIGIN=https://app.keelson.finance
      - KEELSON_TEE_TOKEN_SHA256=${KEELSON_TEE_TOKEN_SHA256}
      - PAYPAL_CLIENT_ID=${PAYPAL_CLIENT_ID}
      - PAYPAL_CLIENT_SECRET=${PAYPAL_CLIENT_SECRET}
    restart: unless-stopped

volumes:
  data:
