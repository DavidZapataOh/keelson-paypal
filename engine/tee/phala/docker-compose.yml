services:
  engine:
    image: ghcr.io/davidzapataoh/keelson-engine@sha256:f93e4fde0ac9d6811e3d63c22e1eb3da324fdae5b91f41787566b0986975b640
    command: ["--platform", "tdx", "--listen", "tcp:0.0.0.0:8080"]
    ports:
      - "8080:8080"
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
      - data:/data
    environment:
      - KEELSON_OCI_DIGEST=sha256:f93e4fde0ac9d6811e3d63c22e1eb3da324fdae5b91f41787566b0986975b640
      - KEELSON_CANONICALIZER=keelson-canon/0.0.0
      - KEELSON_ORIGIN=https://app.keelson.finance
      - KEELSON_BOND_VAULT=0xb39898Ef4333f3CB32d1B420E744f5a1Aa2ae2Bf
      - KEELSON_VERIFYING_CONTRACT=0xe16E8767EC1DA59Ef0D9Bc7851637E4D22352d96
      - KEELSON_TEE_TOKEN_SHA256=${KEELSON_TEE_TOKEN_SHA256}
      - PAYPAL_CLIENT_ID=${PAYPAL_CLIENT_ID}
      - PAYPAL_CLIENT_SECRET=${PAYPAL_CLIENT_SECRET}
    restart: unless-stopped

volumes:
  data:
