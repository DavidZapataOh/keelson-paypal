[package]
name = "keelson-policy"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["prove"]
# The symcc proofs of the policy set: they need cvc5 and tokio, so the enclave engine leaves them out.
prove = ["dep:cedar-policy-symcc", "dep:tokio"]

[dependencies]
cedar-policy = "=4.14.1"
cedar-policy-symcc = { version = "=0.8.1", optional = true }
keelson-canon = { path = "../canon" }
keelson-core = { path = "../core" }
keelson-mandate = { path = "../mandate" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
time = { version = "0.3.55", features = ["formatting", "macros", "parsing"] }
tokio = { version = "1.54.1", features = ["process", "rt"], optional = true }

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false }

[build-dependencies]
keelson-core = { path = "../core" }
serde_json = "1"
sha2 = "0.11.1"

[[bench]]
name = "evaluate"
harness = false

[[bin]]
name = "prove"
required-features = ["prove"]

[[test]]
name = "prove"
required-features = ["prove"]

[[test]]
name = "proof_bundle"
required-features = ["prove"]

[[test]]
name = "seeded_bugs"
required-features = ["prove"]
