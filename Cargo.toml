[workspace]
members = ["engine/*"]
# The SP1 program builds on its own toolchain, in its own workspace.
exclude = ["engine/zkvm"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
publish = false

# The mandate tests check thousands of P-256 signatures, which take ~10x longer unoptimized.
[profile.dev.package.p256]
opt-level = 3

[profile.dev.package.primeorder]
opt-level = 3

[profile.dev.package.primefield]
opt-level = 3

[profile.dev.package.crypto-bigint]
opt-level = 3

# The signer tests produce and recover thousands of secp256k1 signatures.
[profile.dev.package.k256]
opt-level = 3

# A panic ends the process: a leg that panicked is never trusted with a key again.
[profile.release]
panic = "abort"

# The C1 witness is solved by the ACVM and its BN254 black-box solver, which the proving budget
# test times; unoptimized, they take longer than the proof.
[profile.dev.package.acvm]
opt-level = 3

[profile.dev.package.brillig_vm]
opt-level = 3

[profile.dev.package.acir]
opt-level = 3

[profile.dev.package.acir_field]
opt-level = 3

[profile.dev.package.bn254_blackbox_solver]
opt-level = 3

[profile.dev.package.ark-ff]
opt-level = 3

[profile.dev.package.ark-bn254]
opt-level = 3
