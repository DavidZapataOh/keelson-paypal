[profile.default]
src = "src"
test = "test"
script = "script"
libs = ["lib"]
solc = "0.8.38"
evm_version = "prague"
via_ir = true
optimizer = true
optimizer_runs = 200
# Bytecode independent of metadata, so remappings or comments never move a deterministic address.
bytecode_hash = "none"
cbor_metadata = false
deny = "warnings"
fs_permissions = [
  { access = "read-write", path = "./deployments" },
  { access = "read", path = "./test/vectors" },
  { access = "read", path = "../packages/core/test/vectors" },
  { access = "read", path = "../engine/tee/measurements.json" },
  { access = "read", path = "./lib/nitro-validator/out" },
]

[profile.ci]
fuzz = { runs = 1024 }
invariant = { runs = 256, depth = 100 }

[rpc_endpoints]
arbitrum_sepolia = "${ARBITRUM_SEPOLIA_RPC_URL}"
arbitrum = "${ARBITRUM_ONE_RPC_URL}"
sepolia = "${ETHEREUM_SEPOLIA_RPC_URL}"

[etherscan]
arbitrum_sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 421614 }
arbitrum = { key = "${ETHERSCAN_API_KEY}", chain = 42161 }
sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 11155111 }

[fmt]
sort_imports = true

[lint]
# Signer validity, attestation freshness and every protocol window are measured in block time by design.
exclude_lints = ["block-timestamp"]
