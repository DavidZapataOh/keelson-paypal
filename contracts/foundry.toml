[profile.default]
src = "src"
test = "test"
script = "script"
libs = ["lib"]
solc = "0.8.38"
evm_version = "prague"
via_ir = true
optimizer = true
optimizer_runs = 200
# Bytecode independent of metadata, so remappings or comments never move a deterministic address.
bytecode_hash = "none"
cbor_metadata = false
deny = "warnings"
# OpenZeppelin's `Checkpoints` names a function `at`, which solc 0.8.38 warns will become a keyword.
ignored_warnings_from = ["lib"]
# bb's generated Honk verifiers are written for the legacy pipeline: via-IR runs out of stack.
additional_compiler_profiles = [{ name = "legacy", via_ir = false }]
compilation_restrictions = [
  { paths = "src/verifiers/*.sol", via_ir = false },
  { paths = "lib/crypto-lib/src/**/*.sol", via_ir = false },
]
fs_permissions = [
  { access = "read-write", path = "./deployments" },
  { access = "read", path = "./budgets.json" },
  { access = "read", path = "./test/vectors" },
  { access = "read", path = "./lib/crypto-lib/test/utils/ed25519tv.json" },
  { access = "read", path = "../packages/core/test/vectors" },
  { access = "read", path = "../packages/mandate/test/vectors" },
  { access = "read", path = "../engine/tee/measurements.json" },
  { access = "read", path = "./lib/nitro-validator/out" },
  { access = "read", path = "./out/Ed25519Verifier.sol" },
  { access = "read", path = "./out/MandatePredicateReferenceVerifier.sol" },
  { access = "read", path = "./out/MandateViolationReferenceVerifier.sol" },
  { access = "read", path = "./out/AnonymousMandateReferenceVerifier.sol" },
  { access = "read", path = "./out/AnonymousPurchaseReferenceVerifier.sol" },
  { access = "read", path = "./out/AmberContradictionReferenceVerifier.sol" },
]

[profile.ci]
fuzz = { runs = 1024 }
invariant = { runs = 256, depth = 100 }

[profile.smt]
# The model checker reports its results as warnings.
deny = "never"
out = "out/smt"
cache_path = "cache/smt"
[profile.smt.model_checker]
contracts = { "src/CheckpointAnchor.sol" = ["CheckpointAnchor"], "src/KeelsonBondVault.sol" = ["KeelsonBondVault"], "src/KeelsonReputationReporter.sol" = ["KeelsonReputationReporter"], "src/KeelsonReserve.sol" = ["KeelsonReserve"], "src/KeelsonValidationRegistry.sol" = ["KeelsonValidationRegistry"], "src/VerdictVerifier.sol" = ["VerdictVerifier"], "src/deploy/KeelsonDeployer.sol" = ["KeelsonDeployer"] }
engine = "chc"
targets = ["assert", "overflow", "underflow", "divByZero", "outOfBounds"]
timeout = 30000
show_unproved = true

[profile.halmos]
dynamic_test_linking = false
ast = true

[mutation]
timeout = 120

[rpc_endpoints]
# Fuzzed fork tests read uncached storage on every run and share the RPC key with other jobs: a rate-limited read is
# retried, with a longer backoff than forge's default, instead of failing the run.
arbitrum_sepolia = { endpoint = "${ARBITRUM_SEPOLIA_RPC_URL}", retries = 10, retry_backoff = 2000 }
arbitrum = "${ARBITRUM_ONE_RPC_URL}"
sepolia = "${ETHEREUM_SEPOLIA_RPC_URL}"
base = "${BASE_RPC_URL}"

[etherscan]
arbitrum_sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 421614 }
arbitrum = { key = "${ETHERSCAN_API_KEY}", chain = 42161 }
sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 11155111 }
base = { key = "${ETHERSCAN_API_KEY}", chain = 8453 }

[fmt]
sort_imports = true
# Generated by `bb write_solidity_verifier`.
ignore = ["src/verifiers/*.sol"]

[lint]
# Signer validity, attestation freshness and every protocol window are measured in block time by design.
exclude_lints = ["block-timestamp"]
# Generated by `bb write_solidity_verifier`.
ignore = ["src/verifiers/*.sol"]
