name: Select RPC
description: >-
  Exports ARBITRUM_SEPOLIA_RPC_URL, ARBITRUM_ONE_RPC_URL and ETHEREUM_SEPOLIA_RPC_URL: the Alchemy endpoint when it
  answers eth_blockNumber; otherwise Tenderly's public gateway for the chain, which keeps the archive state that
  forks at pinned blocks read (the chains' own public RPCs prune it). For Arbitrum Sepolia the gateway must return
  a known value at a pinned block, and CI's dRPC endpoint is the last resort: its free plan answers some archive
  reads and drops others under fork load, which surfaces as missing trie nodes and empty balances.

inputs:
  alchemy-api-key:
    description: Alchemy API key; empty selects the public gateways.
    required: false
    default: ""
  drpc-arbitrum-sepolia-url:
    description: CI's dRPC endpoint for Arbitrum Sepolia; empty skips it.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - shell: bash
      env:
        KEY: ${{ inputs.alchemy-api-key }}
        DRPC: ${{ inputs.drpc-arbitrum-sepolia-url }}
      run: | # zizmor: ignore[github-env] composite action: writes runner paths and values it derived itself
        [ -n "$KEY" ] && echo "::add-mask::$KEY"
        if [ -n "$DRPC" ]; then
          echo "::add-mask::$DRPC"
          key=${DRPC##*/}; key=${key##*dkey=}; [ -n "$key" ] && echo "::add-mask::$key"
        fi
        answers() {
          curl -fsS --max-time 10 -H 'content-type: application/json' \
            --data '{"jsonrpc":"2.0","id":1,"method":"eth_blockNumber","params":[]}' "$1" 2>/dev/null | grep -q '"result"'
        }
        # PYUSD's balance of the vault at the relayer's fork block: only a node with that archive state returns it.
        archive() {
          curl -fsS --max-time 10 -H 'content-type: application/json' \
            --data '{"jsonrpc":"2.0","id":1,"method":"eth_call","params":[{"to":"0x637A1259C6afd7E3AdF63993cA7E58BB438aB1B1","data":"0x70a08231000000000000000000000000b39898ef4333f3cb32d1b420e744f5a1aa2ae2bf"},"0x138221a8"]}' \
            "$1" 2>/dev/null | grep -q '"result":"0x00000000000000000000000000000000000000000000000000000000054e0840"'
        }
        pick() {
          local name=$1 alchemy=$2 public=$3
          if [ -n "$KEY" ] && answers "https://$alchemy.g.alchemy.com/v2/$KEY"; then
            echo "$name=https://$alchemy.g.alchemy.com/v2/$KEY" >> "$GITHUB_ENV"
          elif [ "$name" != ARBITRUM_SEPOLIA_RPC_URL ] || archive "$public"; then
            echo "::warning::$name: Alchemy does not answer; using $public"
            echo "$name=$public" >> "$GITHUB_ENV"
          elif [ -n "$DRPC" ] && archive "$DRPC"; then
            echo "::warning::$name: neither Alchemy nor $public serves archive state; using dRPC"
            echo "$name=$DRPC" >> "$GITHUB_ENV"
          else
            echo "::error::$name: no RPC serves the archive state the fork tests read"
            exit 1
          fi
        }
        pick ARBITRUM_SEPOLIA_RPC_URL arb-sepolia https://arbitrum-sepolia.gateway.tenderly.co
        pick ARBITRUM_ONE_RPC_URL arb-mainnet https://arbitrum.gateway.tenderly.co
        pick ETHEREUM_SEPOLIA_RPC_URL eth-sepolia https://sepolia.gateway.tenderly.co
