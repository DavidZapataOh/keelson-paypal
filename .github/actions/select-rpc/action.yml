name: Select RPC
description: >-
  Exports ARBITRUM_SEPOLIA_RPC_URL, ARBITRUM_ONE_RPC_URL and ETHEREUM_SEPOLIA_RPC_URL. Arbitrum Sepolia goes to CI's
  own dRPC endpoint when it serves archive state, so CI does not spend production's quota. Otherwise each chain
  goes to the Alchemy endpoint when it answers eth_blockNumber, or to Tenderly's public gateway for the chain, which
  keeps the archive state that forks at pinned blocks read (the chains' own public RPCs prune it).

inputs:
  alchemy-api-key:
    description: Alchemy API key; empty selects the public gateways.
    required: false
    default: ""
  drpc-arbitrum-sepolia-url:
    description: CI's dRPC endpoint for Arbitrum Sepolia; empty skips it.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - shell: bash
      env:
        KEY: ${{ inputs.alchemy-api-key }}
        DRPC: ${{ inputs.drpc-arbitrum-sepolia-url }}
      run: |
        [ -n "$KEY" ] && echo "::add-mask::$KEY"
        if [ -n "$DRPC" ]; then
          echo "::add-mask::$DRPC"
          key=${DRPC##*/}; key=${key##*dkey=}; [ -n "$key" ] && echo "::add-mask::$key"
        fi
        answers() {
          curl -fsS --max-time 10 -H 'content-type: application/json' \
            --data '{"jsonrpc":"2.0","id":1,"method":"eth_blockNumber","params":[]}' "$1" 2>/dev/null | grep -q '"result"'
        }
        # A balance at the oldest pinned fork block (the contracts' fork tests): only an archive node has it.
        archive() {
          curl -fsS --max-time 10 -H 'content-type: application/json' \
            --data '{"jsonrpc":"2.0","id":1,"method":"eth_getBalance","params":["0xb39898Ef4333f3CB32d1B420E744f5a1Aa2ae2Bf","0x138126e0"]}' \
            "$1" 2>/dev/null | grep -q '"result"'
        }
        pick() {
          local name=$1 alchemy=$2 public=$3
          if [ "$name" = ARBITRUM_SEPOLIA_RPC_URL ] && [ -n "$DRPC" ]; then
            if archive "$DRPC"; then
              echo "$name=$DRPC" >> "$GITHUB_ENV"
              return
            fi
            echo "::warning::$name: dRPC does not serve archive state; falling back"
          fi
          if [ -n "$KEY" ] && answers "https://$alchemy.g.alchemy.com/v2/$KEY"; then
            echo "$name=https://$alchemy.g.alchemy.com/v2/$KEY" >> "$GITHUB_ENV"
          else
            echo "::warning::$name: Alchemy does not answer; using $public"
            echo "$name=$public" >> "$GITHUB_ENV"
          fi
        }
        pick ARBITRUM_SEPOLIA_RPC_URL arb-sepolia https://arbitrum-sepolia.gateway.tenderly.co
        pick ARBITRUM_ONE_RPC_URL arb-mainnet https://arbitrum.gateway.tenderly.co
        pick ETHEREUM_SEPOLIA_RPC_URL eth-sepolia https://sepolia.gateway.tenderly.co
