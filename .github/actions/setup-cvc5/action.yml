name: Set up cvc5
description: Installs the cvc5 1.3.1 Linux x86_64 static release after checking its SHA-256, cached across runs.

runs:
  using: composite
  steps:
    - id: cache
      uses: actions/cache@v6
      with:
        path: ${{ runner.temp }}/cvc5.zip
        key: cvc5-1.3.1-linux-x86_64-static
    - if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        URL: https://github.com/cvc5/cvc5/releases/download/cvc5-1.3.1/cvc5-Linux-x86_64-static.zip
      run: curl -fsSL --retry 12 --retry-all-errors --retry-delay 30 --retry-max-time 900 -o "$RUNNER_TEMP/cvc5.zip" "$URL"
    - shell: bash
      env:
        SHA256: 1a1cda20d2df4938fa4944a69f33ddc9172e319ece0eed0aa09c4d7abede3ed1
      run: |
        echo "$SHA256  $RUNNER_TEMP/cvc5.zip" | sha256sum --check --strict
        unzip -q "$RUNNER_TEMP/cvc5.zip" -d "$RUNNER_TEMP"
        echo "$RUNNER_TEMP/cvc5-Linux-x86_64-static/bin" >> "$GITHUB_PATH"
    - shell: bash
      run: cvc5 --version | head -1
