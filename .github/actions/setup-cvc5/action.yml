name: Set up cvc5
description: Installs the cvc5 1.3.1 Linux x86_64 static release after checking its SHA-256.

runs:
  using: composite
  steps:
    - shell: bash
      env:
        URL: https://github.com/cvc5/cvc5/releases/download/cvc5-1.3.1/cvc5-Linux-x86_64-static.zip
        SHA256: 1a1cda20d2df4938fa4944a69f33ddc9172e319ece0eed0aa09c4d7abede3ed1
      run: |
        curl -fsSL -o "$RUNNER_TEMP/cvc5.zip" "$URL"
        echo "$SHA256  $RUNNER_TEMP/cvc5.zip" | sha256sum --check --strict
        unzip -q "$RUNNER_TEMP/cvc5.zip" -d "$RUNNER_TEMP"
        echo "$RUNNER_TEMP/cvc5-Linux-x86_64-static/bin" >> "$GITHUB_PATH"
    - shell: bash
      run: cvc5 --version | head -1
