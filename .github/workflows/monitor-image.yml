name: monitor-image

on:
  push:
    paths:
      - services/monitor/**
      - internal/**
      - go.mod
      - go.sum
      - .github/workflows/monitor-image.yml
  workflow_dispatch:

concurrency:
  group: monitor-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/davidzapataoh/keelson-monitor

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        run: |
          docker buildx build -f services/monitor/Dockerfile . \
            --platform linux/amd64 \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --provenance=false --sbom=false \
            --load -t keelson-monitor:test
      - name: The image follows both origins of the public log
        run: |
          docker run -d --name monitor -p 127.0.0.1:8080:8080 keelson-monitor:test
          for _ in $(seq 60); do
            curl -fsS -o "$RUNNER_TEMP/report.json" http://127.0.0.1:8080/report &&
              jq -e '[.origins[] | select(.size > 0)] | length >= 1' "$RUNNER_TEMP/report.json" > /dev/null && break
            sleep 2
          done
          docker logs monitor
          jq -e '(.origins | length) == 2 and ([.origins[] | select(.size > 0)] | length) >= 1' "$RUNNER_TEMP/report.json"
          docker image inspect keelson-monitor:test --format 'size: {{.Size}} B' >> "$GITHUB_STEP_SUMMARY"
      - name: Push
        id: push
        if: github.ref == 'refs/heads/main'
        run: |
          docker buildx build -f services/monitor/Dockerfile . \
            --platform linux/amd64 \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --provenance=mode=max --sbom=true \
            --push -t "$IMAGE:$GITHUB_SHA" --metadata-file "$RUNNER_TEMP/metadata.json"
          digest="$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/metadata.json")"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "\`$IMAGE@$digest\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: github.ref == 'refs/heads/main'
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
