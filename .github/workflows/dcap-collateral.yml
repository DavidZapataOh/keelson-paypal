name: dcap-collateral

# Intel's TCB info and identities expire monthly. Fails when Automata's on-chain PCCS no longer holds
# current collateral for leg A's live quote, before registrations start failing with Automata's reason.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/select-rpc
        with:
          alchemy-api-key: ${{ secrets.ALCHEMY_API_KEY }}
          drpc-arbitrum-sepolia-url: ${{ secrets.DRPC_ARBITRUM_SEPOLIA_URL }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/tools/dcap-collateral/target
          key: dcap-collateral-${{ hashFiles('contracts/tools/dcap-collateral/Cargo.lock') }}
      - run: cargo build --release --locked
        working-directory: contracts/tools/dcap-collateral
      - name: Leg A's live quote on Arbitrum Sepolia
        run: |
          quote="$(curl -fsS https://api.keelson.finance/v1/tee/attestations | jq -r '.legs[] | select(.tee == "tdx") | .attestation.quote')"
          contracts/tools/dcap-collateral/target/release/dcap-collateral "$ARBITRUM_SEPOLIA_RPC_URL" "$quote" | tee -a "$GITHUB_STEP_SUMMARY"
