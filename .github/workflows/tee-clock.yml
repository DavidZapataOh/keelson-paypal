name: tee-clock

# Fails when leg B's clock is more than a second from the runner's, which GitHub keeps synced.
# Leg B refuses an observation more than 2 s ahead of its clock, so this fires first.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: node engine/tee/scripts/clock-drift.ts --b https://tee-b.keelson.finance --check 1000
