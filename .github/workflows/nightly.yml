name: nightly

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  kani:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: actions/cache@v6
        with:
          path: ~/.kani
          key: ${{ runner.os }}-kani-0.68.0
      - run: cargo install --locked kani-verifier --version 0.68.0 && cargo kani setup
      - run: cargo kani -p keelson-canon

  policy-parity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate 10,000 cases with a random seed
        run: |
          seed=$(od -An -N8 -tu8 /dev/urandom | tr -d ' ')
          echo "Parity seed: $seed (replay with \`parity --seed $seed --n 10000\`)" | tee -a "$GITHUB_STEP_SUMMARY"
          cargo run -p keelson-policy --bin parity -- --seed "$seed" --n 10000 > "$RUNNER_TEMP/parity.jsonl"
      - run: pnpm turbo run build --filter=@keelson/policy^...
      - run: pnpm --filter @keelson/policy test
        env:
          PARITY_FILE: ${{ runner.temp }}/parity.jsonl

  log-public:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Cache headers, and every public leaf in the closed schema
        run: go test -tags live -run '^TestLive(CheckpointIsNotCached|TilesAreImmutable|WritePath|PublicLeaves)' -v ./services/log/

  channel3:
    runs-on: ubuntu-24.04
    env:
      DATABASE_URL: postgres://postgres:keelson@localhost:5432/keelson
      REDIS_URL: redis://localhost:6379
      CHANNEL3_API_KEY: ${{ secrets.CHANNEL3_API_KEY }}
      KEELSON_LIVE: "1"
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: keelson
          POSTGRES_DB: keelson
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d keelson"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      valkey:
        image: valkey/valkey:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@keelson/api^...
      - name: One live Channel3 lookup, stored, sealed and stamped (one credit)
        run: pnpm --filter @keelson/api exec vitest run test/observations.live.test.ts

  money-path:
    # Real sandbox purchases: only on the schedule or by hand, not on every push.
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Ten purchases from a one-off job of keelson-api in Oregon, against the deployed system
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE: srv-dbmao3u1egvs73bro2rg
          OWNER: tea-dbmah4e417fc73bqvdk0
        run: |
          set -euo pipefail
          render() { curl -fsS --retry 5 --retry-all-errors -H "Authorization: Bearer $RENDER_API_KEY" "$@"; }
          cmd='cd services/api && pnpm exec playwright install chromium >/dev/null && PURCHASES=10 CONCURRENCY=2 node bench/money-path.bench.ts'
          job=$(render -X POST -H "content-type: application/json" \
            -d "$(jq -n --arg c "$cmd" '{startCommand: $c}')" \
            "https://api.render.com/v1/services/$SERVICE/jobs" | jq -r .id)
          [ -n "$job" ] && [ "$job" != null ]
          echo "job $job"
          trap 'render -X POST "https://api.render.com/v1/services/$SERVICE/jobs/$job/cancel" >/dev/null || true' EXIT
          deadline=$((SECONDS + 50 * 60))
          until status=$(render "https://api.render.com/v1/services/$SERVICE/jobs/$job" | jq -r .status); \
            [[ "$status" =~ ^(succeeded|failed|canceled)$ ]]; do
            [ "$SECONDS" -lt "$deadline" ] || { echo "job still $status after 50 minutes"; exit 1; }
            sleep 20
          done
          trap - EXIT
          sleep 30
          render -G "https://api.render.com/v1/logs" --data-urlencode "ownerId=$OWNER" \
            --data-urlencode "resource=$job" --data-urlencode "direction=backward" \
            --data-urlencode "limit=100" | jq -r '.logs[].message' | grep -m1 '^{"run"' > summary.json || true
          { echo "### Money path ($status)"; echo '```json'; jq '{run, endToEnd, endToEnd2of2, endToEndDegraded, sse, steps, outbound, db, purchases, captured, failures}' summary.json || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          test "$status" = succeeded

  trust-grades:
    # Recalibrates the risk model on the deployed workflows: on the schedule or by hand.
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Run refreshTrustGrades on keelson-workflows and wait for it
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail
          render() { curl -fsS --retry 5 --retry-all-errors -H "Authorization: Bearer $RENDER_API_KEY" "$@"; }
          run=$(render -X POST -H "content-type: application/json" \
            -d '{"task": "keelson-workflows/refreshTrustGrades", "input": []}' \
            https://api.render.com/v1/task-runs | jq -r .id)
          [ -n "$run" ] && [ "$run" != null ]
          echo "task run $run"
          deadline=$((SECONDS + 12 * 60))
          until body=$(render "https://api.render.com/v1/task-runs/$run"); \
            status=$(jq -r .status <<<"$body"); [[ "$status" =~ ^(completed|succeeded|failed|canceled)$ ]]; do
            [ "$SECONDS" -lt "$deadline" ] || { echo "task run still $status after 12 minutes"; exit 1; }
            sleep 10
          done
          { echo "### Trust grades ($status)"; echo '```json'; jq '.results // .' <<<"$body"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          [[ "$status" =~ ^(completed|succeeded)$ ]]

  judge-reset:
    # Closes stale Judge Mode tenants on the deployed workflows: on the schedule or by hand.
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Run resetJudgeMode on keelson-workflows and wait for it
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail
          render() { curl -fsS --retry 5 --retry-all-errors -H "Authorization: Bearer $RENDER_API_KEY" "$@"; }
          run=$(render -X POST -H "content-type: application/json" \
            -d '{"task": "keelson-workflows/resetJudgeMode", "input": []}' \
            https://api.render.com/v1/task-runs | jq -r .id)
          [ -n "$run" ] && [ "$run" != null ]
          echo "task run $run"
          deadline=$((SECONDS + 8 * 60))
          until body=$(render "https://api.render.com/v1/task-runs/$run"); \
            status=$(jq -r .status <<<"$body"); [[ "$status" =~ ^(completed|succeeded|failed|canceled)$ ]]; do
            [ "$SECONDS" -lt "$deadline" ] || { echo "task run still $status after 8 minutes"; exit 1; }
            sleep 10
          done
          { echo "### Judge Mode reset ($status)"; echo '```json'; jq '.results // .' <<<"$body"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          [[ "$status" =~ ^(completed|succeeded)$ ]]

  red-team:
    # The checkout-attack corpus against the gate, the same attacks on a PayPal sandbox order the
    # deployed store creates, and a small campaign of adaptive injections against the agent on the
    # deployed store, verified from its ledger: on the schedule or by hand.
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ATTACK_RESULTS: /tmp/attacks.jsonl
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @keelson/agent exec playwright install --with-deps chromium
      - run: pnpm turbo run build --filter=@keelson/agent^... --filter=@keelson/redteam^...
      - name: Corpus against the gate, and the same attacks on the PayPal sandbox
        env:
          PAYPAL_SANDBOX_BUYER_EMAIL: ${{ secrets.PAYPAL_SANDBOX_BUYER_EMAIL }}
          PAYPAL_SANDBOX_BUYER_PASSWORD: ${{ secrets.PAYPAL_SANDBOX_BUYER_PASSWORD }}
        run: pnpm --filter @keelson/agent exec vitest run test/attacks.test.ts test/attacks.sandbox.test.ts
      - name: Scoreboard
        if: always()
        run: |
          node services/redteam/scripts/checkout-scoreboard.ts "$ATTACK_RESULTS" > "$RUNNER_TEMP/checkout-attacks.json"
          { echo "### Checkout attacks, corpus and sandbox"; echo '```json'; jq '{attacks, asr, through, controls, false_blocks, blocked_controls, classes: [.classes[] | {class, attacks, through}]}' "$RUNNER_TEMP/checkout-attacks.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          jq -e '.asr.k == 0 and .false_blocks.k == 0' "$RUNNER_TEMP/checkout-attacks.json" > /dev/null
      - name: Campaign of adaptive injections against the agent, then its ledger verified
        if: always()
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail
          render() { curl -fsS --retry 5 --retry-all-errors -H "Authorization: Bearer $RENDER_API_KEY" "$@"; }
          wait_for() {
            local run=$1 deadline=$((SECONDS + $2)) body status
            until body=$(render "https://api.render.com/v1/task-runs/$run"); \
              status=$(jq -r .status <<<"$body"); [[ "$status" =~ ^(completed|succeeded|failed|canceled)$ ]]; do
              [ "$SECONDS" -lt "$deadline" ] || { echo "task run $run still $status" >&2; return 1; }
              sleep 15
            done
            [[ "$status" =~ ^(completed|succeeded)$ ]] || { jq . <<<"$body" >&2; return 1; }
            jq '.results[0] // .results // .' <<<"$body"
          }
          input=$(jq -nc --arg seed "nightly-$(date -u +%F)" '[{rounds: 1, perTemplate: 3, guardedEvery: 7, maxUsd: 2, seed: $seed}]')
          run=$(render -X POST -H "content-type: application/json" \
            -d "$(jq -nc --argjson input "$input" '{task: "keelson-workflows/redTeamCampaign", input: $input}')" \
            https://api.render.com/v1/task-runs | jq -r .id)
          [ -n "$run" ] && [ "$run" != null ]
          summary=$(wait_for "$run" 1800)
          campaign=$(jq -r .campaign <<<"$summary")
          check=$(render -X POST -H "content-type: application/json" \
            -d "$(jq -nc --arg c "$campaign" '{task: "keelson-workflows/redTeamVerify", input: [$c]}')" \
            https://api.render.com/v1/task-runs | jq -r .id)
          verified=$(wait_for "$check" 600)
          { echo "### Agent campaign $campaign"; echo '```json'; jq -s '{summary: .[0], verify: (.[1] | {ok, matchesStoredHead, ms})}' <<<"$summary$verified"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          jq -e '.ok and .matchesStoredHead' <<<"$verified" > /dev/null
          # No cart that breaks the mandate may get past Keelson, on any backbone or split.
          jq -e '[.tallies[][] | .escaped] | add == 0' <<<"$summary" > /dev/null

  docs-live:
    # The documentation's commands against production, every night; a failure opens an issue.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: ./.github/actions/setup-foundry
        with:
          version: v1.9.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @keelson/docs exec playwright install --with-deps chromium
      - run: pnpm turbo run build --filter=@keelson/docs...
      - run: pnpm --filter @keelson/docs test:live
      - run: pnpm --filter @keelson/docs test:site
      - if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Documented checks failing on production"
          open=$(gh issue list --state open --search "$title in:title" --json number --jq 'length')
          [ "$open" -gt 0 ] || gh issue create --title "$title" \
            --body "The nightly run of the documentation's commands failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
