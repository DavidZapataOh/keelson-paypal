name: judge-journey

# The judge's journey on production, from a clean browser, every hour. A failure opens an issue
# (or comments on the open one), which notifies the repository's watchers.
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

concurrency:
  group: judge-journey
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  journey:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: $/.github/actions/apt-update
      - run: pnpm --filter @keelson/web exec playwright install --with-deps chromium
      - name: Walk the tour on app.keelson.finance
        env:
          JUDGE_LIVE_ORIGIN: https://app.keelson.finance
        run: pnpm --filter @keelson/web exec vitest run test/e2e/judge.live.test.ts
      - name: Alert
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          open=$(gh issue list --state open --label judge-journey --json number --jq '.[0].number')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "Failed again: $RUN_URL"
          else
            gh label create judge-journey --color B60205 --description "Hourly judge journey" 2>/dev/null || true
            gh issue create --label judge-journey --title "Judge journey failing on production" \
              --body "The hourly judge journey failed: $RUN_URL"
          fi
