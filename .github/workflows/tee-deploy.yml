name: tee-deploy

on:
  workflow_dispatch:
    inputs:
      digest:
        description: Engine image digest published by tee-image, sha256:<hex>
        required: true

concurrency:
  group: tee-deploy

permissions:
  contents: read

env:
  PHALA_CLI: phala@1.2.1

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      app_id: ${{ steps.deploy.outputs.app_id }}
    env:
      DIGEST: ${{ inputs.digest }}
      PHALA_CLOUD_API_KEY: ${{ secrets.PHALA_CLOUD_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Pin the image digest in the compose file
        run: |
          grep -Eq '^sha256:[0-9a-f]{64}$' <<< "$DIGEST"
          sed -E -i "s/sha256:[0-9a-f]{64}/$DIGEST/g" engine/tee/phala/docker-compose.yml
          git diff --stat
      - name: Deploy, or update the CVM named in app.json
        id: deploy
        env:
          PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
          PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
          KEELSON_TEE_TOKEN_SHA256: ${{ secrets.KEELSON_TEE_TOKEN_SHA256 }}
        working-directory: engine/tee/phala
        run: |
          umask 077
          printf 'PAYPAL_CLIENT_ID=%s\nPAYPAL_CLIENT_SECRET=%s\nKEELSON_TEE_TOKEN_SHA256=%s\n' \
            "$PAYPAL_CLIENT_ID" "$PAYPAL_CLIENT_SECRET" "$KEELSON_TEE_TOKEN_SHA256" > "$RUNNER_TEMP/engine.env"
          phala() { npx --yes "$PHALA_CLI" "$@"; }
          app_id="$(jq -r '.app_id // empty' app.json 2>/dev/null || true)"
          if [ -n "$app_id" ]; then
            phala deploy --cvm-id "$app_id" -c docker-compose.yml -e "$RUNNER_TEMP/engine.env" --no-public-logs --wait
          else
            app_id="$(phala deploy -n keelson-engine -c docker-compose.yml -t tdx.small --kms phala \
              --image dstack-0.6.1 --no-public-logs -e "$RUNNER_TEMP/engine.env" -j | jq -r .app_id)"
          fi
          phala cvms get "$app_id" -j > "$RUNNER_TEMP/cvm.json"
          url="$(jq -r .endpoints[0].app "$RUNNER_TEMP/cvm.json")"
          for _ in $(seq 60); do
            curl -fsS --max-time 5 "$url/v1/attestation" > "$RUNNER_TEMP/attestation.json" && break
            sleep 5
          done
          jq -e .dstack_version "$RUNNER_TEMP/attestation.json"
          jq -n --slurpfile cvm "$RUNNER_TEMP/cvm.json" --slurpfile attestation "$RUNNER_TEMP/attestation.json" '{
            app_id: $cvm[0].app_id,
            instance_type: $cvm[0].resource.instance_type,
            os_image: $cvm[0].os.name,
            dstack_version: $attestation[0].dstack_version,
            node: $cvm[0].node_info.name,
            compose_hash: $attestation[0].compose_hash
          }' | tee app.json
          echo "app_id=$app_id" >> "$GITHUB_OUTPUT"
      - name: Fetch the compose file the CVM booted with
        working-directory: engine/tee/phala
        env:
          APP_ID: ${{ steps.deploy.outputs.app_id }}
        run: npx --yes "$PHALA_CLI" api "/cvms/$APP_ID/compose_file" > app-compose.json
      - name: Files to commit so that make measure keeps matching the CVM
        run: |
          {
            echo "Commit these files from the \`deployment\` artifact:"
            echo
            echo '- `engine/tee/phala/app.json`'
            echo '- `engine/tee/phala/app-compose.json`'
            echo '- `engine/tee/phala/docker-compose.yml`'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deployment
          path: |
            engine/tee/phala/app.json
            engine/tee/phala/app-compose.json
            engine/tee/phala/docker-compose.yml

  verify:
    needs: deploy
    uses: $/.github/workflows/tee-verify.yml
    with:
      app_id: ${{ needs.deploy.outputs.app_id }}
    secrets:
      PHALA_CLOUD_API_KEY: ${{ secrets.PHALA_CLOUD_API_KEY }}
      KEELSON_TEE_TOKEN: ${{ secrets.KEELSON_TEE_TOKEN }}
