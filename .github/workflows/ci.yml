name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: |
          status=0
          grep -rEn "paypalMockResponse|PayPal-Mock-Response" packages services apps --exclude-dir=node_modules --exclude-dir=dist || status=$?
          test "$status" -eq 1
      - run: pnpm turbo run typecheck test build --filter='!./packages/db' --filter='!./services/api' --cache-dir=.turbo
      - run: |
          pnpm --filter @keelson/core vectors
          pnpm --filter @keelson/mandate vectors
          test -z "$(git status --porcelain)"

  services:
    runs-on: ubuntu-24.04
    env:
      DATABASE_URL: postgres://postgres:keelson@localhost:5432/keelson
      REDIS_URL: redis://localhost:6379
      PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
      PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: keelson
          POSTGRES_DB: keelson
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d keelson"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      valkey:
        image: valkey/valkey:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @keelson/api exec playwright install --with-deps chromium
      - run: pnpm turbo run typecheck test build --filter=./packages/db --filter=./services/api
      - run: pnpm migrate
      - run: pnpm --filter @keelson/api openapi && git diff --exit-code openapi/

  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  policy-parity:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        seed: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Embedded policies and the parity sample are fresh
        run: |
          pnpm --filter @keelson/policy embed
          cargo run -p keelson-policy --bin parity -- --seed 1 --n 105 > packages/policy/test/vectors/parity.jsonl
          git diff --exit-code packages/policy
      - name: Generate 10,000 cases with seed ${{ matrix.seed }}
        run: cargo run -p keelson-policy --bin parity -- --seed ${{ matrix.seed }} --n 10000 > "$RUNNER_TEMP/parity.jsonl"
      - run: pnpm turbo run build --filter=@keelson/policy^...
      - run: pnpm --filter @keelson/policy test
        env:
          PARITY_FILE: ${{ runner.temp }}/parity.jsonl

  kani:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: actions/cache@v6
        with:
          path: ~/.kani
          key: ${{ runner.os }}-kani-0.68.0
      - run: cargo install --locked kani-verifier --version 0.68.0 && cargo kani setup
      - run: cargo kani -p keelson-canon

  noir:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: noir-lang/noirup@v0.1.5
        with:
          toolchain: 1.0.0
      - run: nargo test
        working-directory: circuits/vectors
