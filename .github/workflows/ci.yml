name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Alchemy allows 500 compute units per second across the whole account, shared with production; each forking
# process (forge, anvil) is held to this rate so parallel jobs stay well under it.
env:
  FOUNDRY_COMPUTE_UNITS_PER_SECOND: 60

jobs:
  # A pull request runs only the jobs for what it touches; main runs everything. Workflow and toolchain files,
  # and the test vectors several languages read, count as every area.
  changes:
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    outputs:
      ts: ${{ github.event_name != 'pull_request' || steps.filter.outputs.ts == 'true' }}
      go: ${{ github.event_name != 'pull_request' || steps.filter.outputs.go == 'true' }}
      rust: ${{ github.event_name != 'pull_request' || steps.filter.outputs.rust == 'true' }}
      contracts: ${{ github.event_name != 'pull_request' || steps.filter.outputs.contracts == 'true' }}
      noir: ${{ github.event_name != 'pull_request' || steps.filter.outputs.noir == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            shared: &shared
              - .github/**
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - turbo.json
              - tsconfig.base.json
              - biome.json
              - knip.json
              - vitest.config.ts
              - packages/*/test/vectors/**
              - packages/*/test/fixtures/**
              - contracts/test/vectors/**
              - contracts/deployments/**
              - engine/tee/measurements*.json
            ts:
              - *shared
              - packages/**
              - services/api/**
              - services/agent/**
              - services/mcp/**
              - services/monitor/**
              - apps/**
              - openapi/**
            go:
              - *shared
              - "**/*.go"
              - go.mod
              - go.sum
              - internal/**
              - services/log/**
              - services/witness/**
              - services/monitor/**
            rust:
              - *shared
              - engine/**
              - dstack/**
              - Cargo.toml
              - Cargo.lock
              - rust-toolchain.toml
              - packages/policy/**
              - internal/conformance/**
            contracts:
              - *shared
              - contracts/**
              - packages/chain/**
            noir:
              - *shared
              - circuits/**
              - engine/tee/zk/**
              - contracts/src/verifiers/**
              - packages/alibi/src/verify/c1-vk.ts
              - packages/alibi/src/verify/c3-vk.ts
              - services/api/zk/**

  node:
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm dlx knip@6.44.1 --production
      - run: |
          status=0
          grep -rEn "paypalMockResponse|PayPal-Mock-Response" packages services apps --exclude-dir=node_modules --exclude-dir=dist || status=$?
          test "$status" -eq 1
      - run: pnpm --filter @keelson/timestamp exec playwright install chromium
      - run: pnpm turbo run typecheck test build --filter='!./packages/db' --filter='!./packages/attest' --filter='!./packages/evidence' --filter='!./services/api' --filter='!./apps/store' --filter='!./services/monitor' --filter='!./packages/relayer' --cache-dir=.turbo
      - name: The captured timestamp tokens verify with OpenSSL
        working-directory: packages/timestamp
        run: node scripts/openssl-verify.ts
      - name: Timestamp verification time and bundle size
        working-directory: packages/timestamp
        run: pnpm bench | tee -a "$GITHUB_STEP_SUMMARY"
      - run: |
          pnpm --filter @keelson/core vectors
          pnpm --filter @keelson/mandate vectors
          pnpm --filter @keelson/policy vectors
          pnpm --filter @keelson/log vectors
          test -z "$(git status --porcelain)"

  alibi-pdf:
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils zbar-tools
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@keelson/alibi...
      - name: The Alibi PDFs embed their bundle, render the same twice and their QR decodes
        working-directory: packages/alibi
        env:
          ALIBI_PDF_OUT: ${{ runner.temp }}/alibi-pdf
        run: pnpm exec vitest run test/pdf.test.ts
      - name: veraPDF validates every PDF as PDF/A-3b
        shell: bash
        run: packages/alibi/scripts/verapdf.sh "$RUNNER_TEMP"/alibi-pdf/*.pdf | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Render and extract time, size and QR
        working-directory: packages/alibi
        shell: bash
        run: node bench/pdf.bench.ts | tee -a "$GITHUB_STEP_SUMMARY"

  # Every tampering class and every field of the real Alibis, verified against Arbitrum Sepolia.
  alibi-live:
    needs: changes
    if: github.event_name != 'pull_request' && needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-24.04
    env:
      KEELSON_LIVE: "1"
      ARBITRUM_SEPOLIA_RPC_URL: https://arb-sepolia.g.alchemy.com/v2/${{ secrets.ALCHEMY_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@keelson/alibi...
      - name: Tampering, field coverage and chain reads
        working-directory: packages/alibi
        run: pnpm exec vitest run --reporter=verbose test/tamper.live.test.ts test/coverage.live.test.ts test/verify-chain.live.test.ts | tee -a "$GITHUB_STEP_SUMMARY"

  attest:
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-24.04
    services:
      # dstack-verifier 0.6.3; it downloads the OS image the quote names.
      verifier:
        image: ghcr.io/dstack-tee/dstack-verifier:0.6.3@sha256:22aeb6808e38a56115f843d4d66f4852407e72f6080d5f8781fd82d9f819db41
        ports:
          - 8080:8080
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @keelson/attest exec playwright install chromium
      - run: pnpm turbo run typecheck test build --filter=@keelson/attest
      - name: The captured evidence verifies the same way with dstack-verifier
        working-directory: packages/attest
        run: >
          node scripts/dstack-verify.ts http://localhost:8080
          test/evidence/tdx-leg-a.json test/evidence/nitro-leg-b.json
      - name: Verification time and bundle size
        working-directory: packages/attest
        run: pnpm bench | tee -a "$GITHUB_STEP_SUMMARY"

  evidence:
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-24.04
    env:
      PAYPAL_SANDBOX_BUYER_EMAIL: ${{ secrets.PAYPAL_SANDBOX_BUYER_EMAIL }}
      PAYPAL_SANDBOX_BUYER_NAME: ${{ secrets.PAYPAL_SANDBOX_BUYER_NAME }}
      PAYPAL_SANDBOX_BUYER_ADDRESS: ${{ secrets.PAYPAL_SANDBOX_BUYER_ADDRESS }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @keelson/evidence exec playwright install chromium
      - run: pnpm turbo run typecheck test build --filter=@keelson/evidence
      - name: Capture time and bundle size
        working-directory: packages/evidence
        run: pnpm bench | tee -a "$GITHUB_STEP_SUMMARY"

  services:
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-24.04
    env:
      DATABASE_URL: postgres://postgres:keelson@localhost:5432/keelson
      REDIS_URL: redis://localhost:6379
      ARBITRUM_SEPOLIA_RPC_URL: https://arb-sepolia.g.alchemy.com/v2/${{ secrets.ALCHEMY_API_KEY }}
      KEELSON_FUNDER_KEYS: ${{ secrets.KEELSON_FUNDER_KEYS }}
      PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
      PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
      PAYPAL_SANDBOX_BUYER_EMAIL: ${{ secrets.PAYPAL_SANDBOX_BUYER_EMAIL }}
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: keelson
          POSTGRES_DB: keelson
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d keelson"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      valkey:
        image: valkey/valkey:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @keelson/api exec playwright install chromium
      - uses: ./.github/actions/setup-foundry
        with:
          version: v1.9.0
          cache-key: relayer-${{ hashFiles('packages/relayer/test/fork.ts') }}
          cache-restore-keys: relayer-
      - run: pnpm turbo run typecheck test build --filter=./packages/db --filter=./services/api --filter=./apps/store
      - run: pnpm migrate
      - run: pnpm --filter @keelson/api openapi && git diff --exit-code openapi/

  relayer:
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-24.04
    env:
      DATABASE_URL: postgres://postgres:keelson@localhost:5432/keelson
      ARBITRUM_SEPOLIA_RPC_URL: https://arb-sepolia.g.alchemy.com/v2/${{ secrets.ALCHEMY_API_KEY }}
      KEELSON_FUNDER_KEYS: ${{ secrets.KEELSON_FUNDER_KEYS }}
      # The relayer's own least-privilege key: the KMS tests sign with the real sandbox key.
      RELAYER_AWS_ACCESS_KEY_ID: ${{ secrets.RELAYER_AWS_ACCESS_KEY_ID }}
      RELAYER_AWS_SECRET_ACCESS_KEY: ${{ secrets.RELAYER_AWS_SECRET_ACCESS_KEY }}
      RELAYER_KMS_KEY_SANDBOX: alias/keelson-relayer-arbitrum-sepolia
      AWS_REGION: us-west-2
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: keelson
          POSTGRES_DB: keelson
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d keelson"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: ./.github/actions/setup-foundry
        with:
          version: v1.9.0
          cache-key: relayer-${{ hashFiles('packages/relayer/test/fork.ts') }}
          cache-restore-keys: relayer-
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run typecheck test build --filter=@keelson/relayer

  go:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    env:
      DATABASE_URL: postgres://postgres:keelson@localhost:5432/keelson
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: keelson
          POSTGRES_DB: keelson
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d keelson"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l $(go list -f '{{.Dir}}' ./...))"
      - run: go vet ./...
      - run: go mod tidy -diff
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - run: go test -race ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  monitor-page:
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - id: tinygo
        uses: actions/cache@v6
        with:
          path: ~/.local/tinygo
          key: tinygo-0.44.0-binaryen-133-${{ runner.os }}
      - if: steps.tinygo.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/tinygo
          curl -fsSL --retry 12 --retry-all-errors --retry-delay 30 --retry-max-time 900 \
            https://github.com/tinygo-org/tinygo/releases/download/v0.44.0/tinygo0.44.0.linux-amd64.tar.gz \
            | tar -xz -C ~/.local/tinygo
          curl -fsSL --retry 12 --retry-all-errors --retry-delay 30 --retry-max-time 900 \
            https://github.com/WebAssembly/binaryen/releases/download/version_133/binaryen-version_133-x86_64-linux.tar.gz \
            | tar -xz -C ~/.local/tinygo
      - run: |
          echo "$HOME/.local/tinygo/tinygo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/tinygo/binaryen-version_133/bin" >> "$GITHUB_PATH"
      - run: tinygo version && wasm-opt --version
      - run: pnpm install --frozen-lockfile --filter @keelson/monitor
      - run: pnpm --filter @keelson/monitor exec playwright install chromium
      - run: pnpm --filter @keelson/monitor test
      - name: Verifier size
        working-directory: services/monitor/web
        run: |
          {
            echo "| verifier.wasm | bytes |"
            echo "|---|---|"
            echo "| raw | $(wc -c < verifier.wasm) |"
            echo "| gzip -9 | $(gzip -9 -c verifier.wasm | wc -c) |"
          } >> "$GITHUB_STEP_SUMMARY"
          test "$(gzip -9 -c verifier.wasm | wc -c)" -lt 1000000

  monitor-selfhost:
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build and run the monitor as its README says
        run: |
          docker build -f services/monitor/Dockerfile -t keelson-monitor .
          start=$(date +%s)
          docker run -d --name monitor -p 8080:8080 -v keelson-monitor:/data keelson-monitor
          for _ in $(seq 60); do
            if curl -fsS http://localhost:8080/report |
              jq -e '[.origins[] | select((.cosigners | length) >= 2 and .error == null and .leavesAudited == .size)] | length == 2'; then
              echo "Both origins verified $(( $(date +%s) - start )) s after docker run" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 1
          done
          docker logs monitor
          exit 1

  contracts:
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-24.04
    env:
      ARBITRUM_SEPOLIA_RPC_URL: https://arb-sepolia.g.alchemy.com/v2/${{ secrets.ALCHEMY_API_KEY }}
      ARBITRUM_ONE_RPC_URL: https://arb-mainnet.g.alchemy.com/v2/${{ secrets.ALCHEMY_API_KEY }}
      ETHEREUM_SEPOLIA_RPC_URL: https://eth-sepolia.g.alchemy.com/v2/${{ secrets.ALCHEMY_API_KEY }}
      KEELSON_FUNDER_KEYS: ${{ secrets.KEELSON_FUNDER_KEYS }}
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-foundry
        with:
          version: v1.9.0
          # Fork tests pin their blocks in the registry, so the RPC cache stays valid until a block moves.
          cache-key: contracts-${{ hashFiles('contracts/deployments/*.json', 'contracts/test/**/*.fork.t.sol') }}
          cache-restore-keys: contracts-
      - run: forge fmt --check
      # Base's nitro-validator is deployed with its own audited settings, so its bytecode comes from its own build.
      - run: forge build --root lib/nitro-validator
      # EIP-170 applies to what is deployed: test handlers and harnesses are exempt.
      - run: forge build --sizes --skip './test/**' --skip './script/**'
      # -vv: traces of failing tests would print the funder keys parsed from the secret.
      - run: forge test --no-match-path 'test/**/*.live.t.sol' -vv --compute-units-per-second "$FOUNDRY_COMPUTE_UNITS_PER_SECOND"
      # Each budgeted path asserts its budget from budgets.json; the values it records must match the commit.
      - run: git diff --exit-code snapshots/
      - run: forge snapshot --check --no-match-path 'test/**/*.{fork,live}.t.sol'
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - name: The typed addresses and abis match the registry and the build
        working-directory: .
        run: |
          pnpm --filter @keelson/chain generate
          git diff --exit-code packages/chain/src

  contracts-live:
    needs: [changes, contracts]
    if: (needs.changes.outputs.contracts == 'true') && (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    env:
      ARBITRUM_SEPOLIA_RPC_URL: https://arb-sepolia.g.alchemy.com/v2/${{ secrets.ALCHEMY_API_KEY }}
      ARBITRUM_ONE_RPC_URL: https://arb-mainnet.g.alchemy.com/v2/${{ secrets.ALCHEMY_API_KEY }}
      ETHEREUM_SEPOLIA_RPC_URL: https://eth-sepolia.g.alchemy.com/v2/${{ secrets.ALCHEMY_API_KEY }}
      ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-foundry
        with:
          version: v1.9.0
      - run: forge build --root lib/nitro-validator
      - run: forge test --match-path 'test/**/*.live.t.sol' -vv --compute-units-per-second "$FOUNDRY_COMPUTE_UNITS_PER_SECOND"
      - run: script/verify.sh --check-only 421614 11155111 42161

  log-live:
    needs: [changes, go]
    if: (needs.changes.outputs.go == 'true') && (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    env:
      DATABASE_URL: postgres://postgres:keelson@localhost:5432/keelson
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: keelson
          POSTGRES_DB: keelson
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d keelson"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -tags live -run Live -v ./services/log/
        env:
          LOG_URL: https://log.keelson.finance
          LOG_SIGNER_KEY_CONFORMANCE: ${{ secrets.LOG_SIGNER_KEY_CONFORMANCE }}
          SIGSUM_SUBMIT_KEY: ${{ secrets.SIGSUM_SUBMIT_KEY }}

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # A pull request is scanned on its own commits, so another branch's findings fail only that
      # branch's pull request; pushes to main scan every ref.
      - name: Scan for secrets
        env:
          LOG_OPTS: ${{ github.event_name == 'pull_request' && format('origin/{0}..HEAD', github.base_ref) || '--all' }}
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f detect --source /repo --log-opts="$LOG_OPTS" --redact --no-banner

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/setup-cvc5
      - uses: ./.github/actions/setup-bb
      - run: cargo fmt --check
      - run: cargo install cargo-audit --locked --version 0.22.2
      - run: cargo audit
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy -p keelson-tee --all-targets --features tdx,nitro -- -D warnings
      - run: cargo test
      - name: The enclave engine carries no proof tooling
        run: "! cargo tree -p keelson-tee --features tdx,nitro -e normal | grep -E 'cedar-policy-symcc|cvc5'"
      - name: Resident memory after 10,000 countersigns on each leg
        run: cargo test -p keelson-tee --release --test rss -- --ignored --nocapture
      - run: cargo test -p keelson-tee --features tdx,nitro
        env:
          PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
          PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
          PAYPAL_AUTHORIZATION_CREATED: ${{ vars.PAYPAL_AUTHORIZATION_CREATED }}
          PAYPAL_AUTHORIZATION_PARTIALLY_CAPTURED: ${{ vars.PAYPAL_AUTHORIZATION_PARTIALLY_CAPTURED }}
          PAYPAL_AUTHORIZATION_VOIDED: ${{ vars.PAYPAL_AUTHORIZATION_VOIDED }}

  tee-simulator:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: Dstack-TEE/dstack
          ref: 7f143148cc49f4a09799958835d310e050137cb3 # v0.6.1
          path: dstack
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            dstack/dstack
      - name: Start the dstack guest agent simulator
        working-directory: dstack/sdk/simulator
        run: |
          ./build.sh
          ./dstack-simulator > dstack-simulator.log 2>&1 &
          for _ in $(seq 100); do [ -S dstack.sock ] && exit 0; sleep 0.2; done
          cat dstack-simulator.log
          exit 1
      - run: cargo test -p keelson-tee --features tdx --test tdx_simulator -- --include-ignored
        env:
          DSTACK_SIMULATOR_ENDPOINT: ${{ github.workspace }}/dstack/sdk/simulator/dstack.sock

  proofs:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/setup-cvc5
      - name: The committed proof bundle is fresh
        run: |
          cargo run -p keelson-policy --bin prove -- --out engine/policy/proofs/proof-bundle.json
          git diff --exit-code engine/policy/proofs
      - name: Seeded bugs produce replayable counterexamples
        run: |
          for bug in overflow extra-permit; do
            status=0
            cargo run -q -p keelson-policy --bin prove -- --seed-bug "$bug" > "$RUNNER_TEMP/$bug.json" || status=$?
            test "$status" -eq 1
            jq -e '[.counterexamples[] | select(.check == "equivalent")] | length > 0 and all(.replay.seeded == "allow" and .replay.spec == "deny")' "$RUNNER_TEMP/$bug.json"
          done
      - name: The committed attribution bundle is fresh
        run: |
          cargo run -p keelson-policy --bin prove -- --attribution --out engine/policy/proofs/attribution-bundle.json
          git diff --exit-code engine/policy/proofs
      - name: Seeded attribution holes produce replayable counterexamples
        run: |
          status=0
          cargo run -q -p keelson-policy --bin prove -- --seed-bug no-precedence > "$RUNNER_TEMP/no-precedence.json" || status=$?
          test "$status" -eq 1
          jq -e '[.counterexamples[] | select(.check == "exclusive")] | length > 0 and all((.replay.seeded | length) >= 2 and (.replay.rules | length) == 1)' "$RUNNER_TEMP/no-precedence.json"
          status=0
          cargo run -q -p keelson-policy --bin prove -- --seed-bug drop-gray > "$RUNNER_TEMP/drop-gray.json" || status=$?
          test "$status" -eq 1
          jq -e '[.counterexamples[] | select(.check == "total")] | length == 1 and all(.replay.seeded == [] and .replay.rules == ["user"])' "$RUNNER_TEMP/drop-gray.json"
      - name: Attribution latency
        run: |
          set -o pipefail
          cargo bench -p keelson-policy --bench attribute | tee -a "$GITHUB_STEP_SUMMARY"

  attest-proofs:
    needs: [changes, proofs]
    if: (needs.changes.outputs.rust == 'true') && (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            engine/policy/proofs/proof-bundle.json
            engine/policy/proofs/attribution-bundle.json

  policy-parity:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        seed: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Embedded policies and the parity sample are fresh
        run: |
          pnpm --filter @keelson/policy embed
          cargo run -p keelson-policy --bin parity -- --seed 1 --n 105 > packages/policy/test/vectors/parity.jsonl
          git diff --exit-code packages/policy
      - name: Generate 10,000 cases with seed ${{ matrix.seed }}
        run: cargo run -p keelson-policy --bin parity -- --seed ${{ matrix.seed }} --n 10000 > "$RUNNER_TEMP/parity.jsonl"
      - run: pnpm turbo run build --filter=@keelson/policy^...
      - run: pnpm --filter @keelson/policy test
        env:
          PARITY_FILE: ${{ runner.temp }}/parity.jsonl

  noir:
    needs: changes
    if: needs.changes.outputs.noir == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - id: nargo
        uses: actions/cache@v6
        with:
          path: ~/.nargo/bin
          key: nargo-1.0.0-${{ runner.os }}
      - if: steps.nargo.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.nargo/bin
          curl -fsSL --retry 12 --retry-all-errors --retry-delay 30 --retry-max-time 900 \
            https://github.com/noir-lang/noir/releases/download/v1.0.0/noir-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C ~/.nargo/bin
      - run: echo "$HOME/.nargo/bin" >> "$GITHUB_PATH"
      - uses: ./.github/actions/setup-bb
      - run: nargo test
        working-directory: circuits/vectors
      - run: nargo test
        working-directory: circuits/c1
      - name: The engine's program and key and the Solidity verifiers are what the circuit compiles to
        run: |
          circuits/c1/build.sh
          git diff --exit-code engine/tee/zk contracts/src/verifiers packages/alibi/src/verify/c1-vk.ts
      - name: bb proves and verifies the demo mandate
        run: |
          circuits/c1/prove.sh "$RUNNER_TEMP/c1-proof.json"
          bb gates -b circuits/c1/target/mandate_predicate.json | tee -a "$GITHUB_STEP_SUMMARY"
      - run: nargo test
        working-directory: circuits/c2a
      - name: The C2a key and Solidity verifiers are what the circuit compiles to
        run: |
          circuits/c2a/build.sh
          git diff --exit-code circuits/c2a/mandate_violation.vk contracts/src/verifiers
      - name: bb proves and verifies each violation class of the demo mandate
        run: |
          for class in amount currency category expiry merchant; do
            circuits/c2a/prove.sh "$class" "$RUNNER_TEMP/c2a-$class.json"
          done
          bb gates -b circuits/c2a/target/mandate_violation.json | tee -a "$GITHUB_STEP_SUMMARY"
      - run: nargo test
        working-directory: circuits/c3
      - name: The C3 program, key and Solidity verifiers are what the circuit compiles to
        run: |
          circuits/c3/build.sh
          git diff --exit-code circuits/c3/anonymous_mandate.vk contracts/src/verifiers services/api/zk packages/alibi/src/verify/c3-vk.ts
      - name: bb proves and verifies a passkey assertion of each type
        run: |
          for type in payment webauthn; do
            circuits/c3/prove.sh "$type" "$RUNNER_TEMP/c3-$type.json"
          done
          bb gates -b circuits/c3/target/anonymous_mandate.json | tee -a "$GITHUB_STEP_SUMMARY"
