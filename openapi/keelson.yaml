        - purchaseId
        - mode
        - decision
        - countersign
        - digest
        - signatures
        - signers
    OnceApproval:
      type: object
      properties:
        device_code:
          type: string
          description: "Absent when the user is already being asked about this cart: keep
            polling the device code you were given then."
        user_code:
          type: string
        verification_uri:
          type: string
        verification_uri_complete:
          type: string
        expires_in:
          type: integer
        interval:
          type: integer
        request_id:
          type: string
          description: Read the request's state with `GET /v1/connections/requests/{id}`.
      required:
        - user_code
        - verification_uri
        - verification_uri_complete
        - expires_in
        - interval
        - request_id
      description: "On a deny for a cart over the mandate's amount or outside its
        merchants: the user was asked to approve this cart once. Poll `POST
        /v1/connections/token` with its `device_code`; the answer is a
        single-purchase mandate for exactly this cart."
    CountersignRequest:
      type: object
      properties:
        authorizationId:
          type: string
          minLength: 1
          maxLength: 64
          description: The PayPal authorization that holds the mandate's funds, or this
            request's own hold when the mandate holds each purchase separately;
            leg A reads it. Absent for a card mandate, whose purchase is paid
            with a single-use card issued after the ALLOW.
        closedMandate:
          type: string
          minLength: 1
          maxLength: 131072
          description: The open mandate closed by the agent's key binding over the request
            and cart. Required, except of an app acting for a user under a
            mandate of Keelson's hosted operator, which sends `mandateId`
            instead.
        mandateId:
          type: string
          pattern: ^[0-7][0-9A-HJKMNP-TV-Z]{25}$
          description: "Only for an app acting for a user (`purchases:write`) under a
            mandate of Keelson's hosted operator that the user approved for it:
            Keelson closes the mandate with the hosted operator's key over
            `requestId` and this cart."
        requestId:
          type: string
          pattern: ^[0-7][0-9A-HJKMNP-TV-Z]{25}$
          description: "With `mandateId`: the request ULID the closed mandate binds, and
            the purchase's id; a new one when left out."
        cart:
          $ref: "#/components/schemas/Cart"
        unit:
          type: object
          additionalProperties: {}
          description: "The PayPal purchase unit the cart is checked against: `{amount}`,
            the checkout total the buyer pays as a PayPal Orders v2 amount,
            whose `breakdown` has the `item_total` of the cart's lines and, when
            the checkout charges them, `tax_total`, `shipping` and `discount`.
            Keelson countersigns `amount.value`, which must be `item_total +
            tax_total + shipping − discount`, and checks it against the
            mandate's budget. `handling`, `insurance` and `shipping_discount`
            are refused: fold them into `shipping`."
        evidence:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
              maxLength: 256
            maxItems: 8
          default: {}
          description: "Evidence sources per field. `channel3:` sources are refused here:
            the API adds them from the observation stored in the evidence."
        evidenceRoot:
          type: string
          pattern: ^0x[0-9a-f]{64}$
          description: The root of the evidence stored with `POST /v1/evidence` for this
            mandate.
        live:
          type: object
          properties:
            store:
              type: string
              maxLength: 256
              format: uri
              description: "The store's origin: the origin of the website the mandate allows
                for the cart's merchant."
          required:
            - store
          additionalProperties: false
          description: "Only when the buyer pays at the store's own checkout with their
            own PayPal account: Keelson countersigns and logs the purchase and
            issues its Alibi, and neither covers nor captures it. Its Alibi is
            public once the PayPal transaction is recorded. The agent's pay
            click waits for an ALLOW; the agent then records PayPal's
            transaction id with `PUT /v1/purchases/{id}/paypal-transaction`."
        repeatOf:
          type: string
          minLength: 26
          maxLength: 26
          description: "Only when the user asked to buy the same cart again: the id of the
            latest purchase of this cart under the mandate. Not needed once that
            purchase was denied or failed before capture, or was captured more
            than ten minutes ago. A retry after a lost answer never sends it:
            the `409 purchase-exists` answer names the purchase already made."
      required:
        - cart
        - unit
        - evidenceRoot
