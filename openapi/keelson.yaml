              $ref: "#/components/schemas/BondDeposit"
      responses:
        "200":
          description: Confirmed on-chain
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "202":
          description: Sent and not yet confirmed; poll `Location`
          headers:
            Location:
              schema:
                type: string
              required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "401":
          description: No valid credentials
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Not allowed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
