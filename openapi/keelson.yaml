          description: Stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  rail:
                    type: string
                    enum:
                      - pyusd
                      - paypal
                    description: "`pyusd`: slashes and warranties pay the merchant in PYUSD on
                      chain. `paypal`: they pay Keelson's treasury, and Keelson
                      sends the merchant a PayPal Payout in USD."
