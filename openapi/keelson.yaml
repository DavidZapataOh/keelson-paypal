          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: PayPal unavailable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/transactions/{id}:
    get:
      tags:
        - transactions
      summary: A relayed transaction
      description: "A transaction the Keelson relayer sent: its status, hash, receipt
        fields and explorer link. Final records are immutable."
      parameters:
        - schema:
            type: string
            pattern: ^[0-7][0-9A-HJKMNP-TV-Z]{25}$
          required: true
          name: id
          in: path
      responses:
        "200":
          description: The transaction
          headers:
            Cache-Control:
              schema:
                type: string
              required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "404":
          description: No such transaction
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/redteam/campaigns:
    get:
      tags:
        - red team
      summary: Red-team campaigns
      description: The latest red-team campaigns, newest first. Public.
      responses:
        "200":
          description: Up to 20 campaigns
          content:
            application/json:
              schema:
                type: object
                properties:
                  campaigns:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        startedAt:
                          type: string
                        finishedAt:
                          type:
                            - string
                            - "null"
                        attacks:
                          type: integer
                      required:
                        - id
                        - startedAt
                        - finishedAt
                        - attacks
                required:
                  - campaigns
  /v1/redteam/campaigns/{id}/ledger:
    get:
      tags:
        - red team
      summary: A campaign's ledger
      description: "The campaign's hash-chained JSON Lines ledger, byte for byte: the
        header, one line per attack and, once finished, the summary. Each line
        is RFC 8785 JSON whose `prev` is the SHA-256 of `keelson/redteam/v1 ‖
        0x00 ‖ previous line`. Public."
      parameters:
        - schema:
            type: string
            pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
            description: The campaign's ULID.
          required: true
          description: The campaign's ULID.
          name: id
          in: path
      responses:
        "200":
          description: The ledger so far
          content:
            application/jsonl:
              schema:
                type: string
        "404":
          description: No such campaign
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/redteam/campaigns/{id}/scoreboard:
    get:
      tags:
        - red team
      summary: A campaign's scoreboard
      description: "Agent ASR, Keelson's escape rate with its Clopper-Pearson 95 %
        interval, false blocks and utility under attack with Wilson 95 %
        intervals, per backbone and split, computed from the ledger alone. The
        body is RFC 8785 JSON: recomputing it from the ledger gives the same
        bytes. Public."
      parameters:
        - schema:
            type: string
            pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
            description: The campaign's ULID.
          required: true
          description: The campaign's ULID.
          name: id
          in: path
      responses:
        "200":
          description: The scoreboard of the ledger so far
          content:
            application/json:
              schema:
                type: object
                properties: {}
                additionalProperties: {}
        "404":
          description: No such campaign
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/redteam/campaigns/{id}/scoreboard/stream:
    get:
      tags:
        - red team
      summary: Follow a campaign's scoreboard
      description: "Server-sent events: a `scoreboard` event with the current
        scoreboard, another each time the ledger grows, and `end` once the
        campaign is finished. Public."
      parameters:
        - schema:
            type: string
            pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
            description: The campaign's ULID.
          required: true
          description: The campaign's ULID.
          name: id
          in: path
      responses:
        "200":
          description: An event stream
          content:
            text/event-stream:
              schema:
                type: string
        "404":
          description: No such campaign
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: Too many open streams
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/judge/sessions:
    post:
      tags:
        - judge
      summary: Open a Judge Mode session
      description: "Creates a judge: a tenant with no email, no account and no key,
        signed in with a session cookie until the nightly reset after 12 hours.
        A judge reads the demo merchant's console (no changes), walks the tour,
        and can sign its own mandates with a passkey like any user. Five per
        hour per address."
      responses:
        "201":
          description: The judge, signed in (the session cookie is set)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JudgeSession"
        "403":
          description: Not called from the app's origin
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Already signed in as someone else
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Too many judges
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: Sign-in is not configured
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/judge/tour:
    get:
      tags:
        - judge
      summary: What the Judge Mode tour shows
      description: "The newest real records on this deployment: the demo operator's
        latest mandate with a captured purchase (its card and every purchase
        under it, blocked ones included), the latest sandbox dispute with a
        verdict, and the latest finished red-team campaign. Judges only."
      responses:
        "200":
          description: The tour
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JudgeTour"
        "401":
          description: No session
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Not a judge
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
webhooks: {}
