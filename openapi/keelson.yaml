              - name
              - endpoint
        x402Support:
          type: boolean
        active:
          type: boolean
        registrations:
          type: array
          items:
            type: object
            properties:
              agentId:
                anyOf:
                  - type: number
                  - type: string
              agentRegistry:
                type: string
            required:
              - agentId
              - agentRegistry
        supportedTrust:
          type: array
          items:
            type: string
      required:
        - type
        - name
        - description
        - image
        - services
        - x402Support
        - active
        - registrations
      description: An ERC-8004 agent registration file (`registration-v1`).
    OperatorBond:
