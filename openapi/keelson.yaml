        - prompt
    Countersigned:
      type: object
      properties:
        purchaseId:
          type: string
        mode:
          type: string
          enum:
            - 2of2
            - degraded
          description: "`degraded` when leg B was unreachable and only leg A signed."
        decision:
          type: string
          enum:
            - allow
            - deny
        countersign:
          type: object
          additionalProperties:
            type: string
          description: The EIP-712 `Countersign` message, as decimal strings.
        digest:
          type: string
          pattern: ^0x[0-9a-f]{64}$
        signatures:
          type: object
          properties:
            tdx:
              type: string
              pattern: ^0x[0-9a-f]{130}$
            nitro:
              type:
                - string
                - "null"
              pattern: ^0x[0-9a-f]{130}$
          required:
            - tdx
            - nitro
        signers:
          type: object
          properties:
            tdx:
              type: string
            nitro:
              type:
                - string
                - "null"
          required:
            - tdx
            - nitro
        trace:
          description: The `keelson.eval/1` trace both legs signed over.
        state:
          type: string
          description: "`CAPTURED` once logged, covered and captured; `FAILED` with
            `failure` when a step refused; `COUNTERSIGNED`, `LOGGED` or
            `COVERED` while a step is pending; `DENIED` for a DENY."
        logIndex:
          type: string
          description: The leaf's index in the Alibi log.
        coverage:
          type: object
          properties:
            chainId:
              type: integer
            txHash:
              type:
                - string
                - "null"
          required:
            - chainId
            - txHash
          description: The `lockCoverage` transaction of the operator's bond.
        capture:
          type: object
          properties:
            id:
              type: string
            invoiceId:
              type: string
            status:
              type:
                - string
                - "null"
          required:
            - id
            - invoiceId
            - status
          description: The PayPal capture of the countersigned amount.
        failure:
          type: object
          properties:
            step:
              type: string
            reason:
              type: string
          required:
            - step
            - reason
          description: The step that failed and why; nothing was captured.
        blocked:
          type: array
          items:
            type: string
          description: For a `DENIED` cart, the mandate fields whose check failed.
        live:
          type: object
          properties:
            store:
              type: string
            transactionId:
              type:
                - string
                - "null"
          required:
            - store
            - transactionId
          description: "A purchase the buyer pays at the store's own checkout: the store's
            origin and the PayPal transaction id once the agent recorded it.
            Never covered nor captured."
      required:
        - purchaseId
        - mode
        - decision
        - countersign
        - digest
        - signatures
        - signers
    CountersignRequest:
      type: object
      properties:
        authorizationId:
          type: string
          minLength: 1
          maxLength: 64
          description: The PayPal authorization that holds the mandate's funds, or this
            request's own hold when the mandate holds each purchase separately;
            leg A reads it.
        closedMandate:
          type: string
          minLength: 1
          maxLength: 131072
          description: The open mandate closed by the agent's key binding over the request
            and cart.
        cart:
          $ref: "#/components/schemas/Cart"
        unit:
          type: object
          additionalProperties: {}
          description: The PayPal purchase unit the cart is checked against.
        evidence:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
              maxLength: 256
            maxItems: 8
          default: {}
          description: "Evidence sources per field. `channel3:` sources are refused here:
            the API adds them from the observation stored in the evidence."
        evidenceRoot:
          type: string
          pattern: ^0x[0-9a-f]{64}$
          description: The root of the evidence stored with `POST /v1/evidence` for this
            mandate.
        live:
          type: object
          properties:
            store:
              type: string
              maxLength: 256
              format: uri
              description: The store's origin.
          required:
            - store
          additionalProperties: false
          description: "Only when the buyer pays at the store's own checkout with their
            own PayPal account: Keelson countersigns and logs the purchase and
            issues its Alibi, and neither covers nor captures it. The agent's
            pay click waits for an ALLOW; the agent then records PayPal's
            transaction id with `PUT /v1/purchases/{id}/paypal-transaction`."
        repeatOf:
          type: string
          minLength: 26
          maxLength: 26
          description: "Only when the user asked to buy the same cart again: the id of the
            latest purchase of this cart under the mandate. Not needed once that
            purchase was denied or failed before capture, or was captured more
            than ten minutes ago. A retry after a lost answer never sends it:
            the `409 purchase-exists` answer names the purchase already made."
