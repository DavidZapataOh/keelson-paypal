    CompileMandate:
      type: object
      properties:
        prompt:
          type: string
          minLength: 1
          description: The shopping request in natural language, at most 2000 UTF-16 code
            units.
          example: Running shoes, size 10, under $100, free returns, by Friday
        credentialId:
          type: string
          minLength: 1
          description: The passkey that will sign the mandate; defaults to the most recent
            one.
        mode:
          type: string
          enum:
            - immediate
            - autonomous
          default: autonomous
          description: Whether the user is present at checkout (`immediate`) or not
            (`autonomous`).
      required:
        - prompt
    Countersigned:
      type: object
      properties:
        purchaseId:
          type: string
        mode:
          type: string
          enum:
            - 2of2
            - degraded
          description: "`degraded` when leg B was unreachable and only leg A signed."
        decision:
          type: string
          enum:
            - allow
            - deny
        countersign:
          type: object
          additionalProperties:
            type: string
          description: The EIP-712 `Countersign` message, as decimal strings.
        digest:
          type: string
          pattern: ^0x[0-9a-f]{64}$
        signatures:
          type: object
          properties:
            tdx:
              type: string
              pattern: ^0x[0-9a-f]{130}$
            nitro:
              type:
                - string
                - "null"
              pattern: ^0x[0-9a-f]{130}$
          required:
            - tdx
            - nitro
        signers:
          type: object
          properties:
            tdx:
              type: string
            nitro:
              type:
                - string
                - "null"
          required:
            - tdx
            - nitro
        trace:
          description: The `keelson.eval/1` trace both legs signed over.
        approval:
          $ref: "#/components/schemas/OnceApproval"
        state:
          type: string
          description: "`CAPTURED` once logged, covered and captured; `FAILED` with
            `failure` when a step refused; `COUNTERSIGNED`, `LOGGED` or
            `COVERED` while a step is pending; `DENIED` for a DENY."
        logIndex:
          type: string
          description: The leaf's index in the Alibi log.
        coverage:
          type: object
          properties:
            chainId:
              type: integer
            txHash:
              type:
                - string
                - "null"
          required:
            - chainId
            - txHash
          description: The `lockCoverage` transaction of the operator's bond.
        capture:
          type: object
          properties:
            id:
              type: string
            invoiceId:
              type: string
            status:
              type:
                - string
                - "null"
          required:
            - id
            - invoiceId
            - status
          description: The PayPal capture of the countersigned amount.
        failure:
          type: object
          properties:
            step:
              type: string
            reason:
              type: string
          required:
            - step
            - reason
          description: The step that failed and why; nothing was captured.
        blocked:
          type: array
          items:
            type: string
          description: For a `DENIED` cart, the mandate fields whose check failed.
        reasons:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              mandate:
                type:
                  - string
                  - "null"
              cart:
                type:
                  - string
                  - "null"
            required:
              - field
              - mandate
              - cart
          description: For a `DENIED` cart, each failed field with what the mandate
            allowed and what the cart had, as text.
        checks:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              mandate:
                type:
                  - string
                  - "null"
              cart:
                type:
                  - string
                  - "null"
              pass:
                type: boolean
            required:
              - field
              - mandate
              - cart
              - pass
          description: For a purchase the engine checked, each mandate field with what the
            mandate allowed, what the cart had and whether it held.
        card:
          type: object
          properties:
            issuer:
              type: string
            lastFour:
              type: string
            state:
              type: string
            expiresAt:
              type: string
            controls:
              type: object
              additionalProperties: {}
            settledMinor:
              type:
                - string
                - "null"
            chargebacks:
              type: array
              items:
                type: object
                additionalProperties: {}
              description: Chargebacks filed through the card issuer over this purchase.
            bondClaimMinor:
              type: string
              description: "The most a bond claim over this purchase may pay: the settled
                amount less what chargebacks returned; 0 while one is open."
            authorizations:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  amountMinor:
                    type: string
                  currency:
                    type: string
                  mcc:
                    type: string
                  merchantName:
                    type: string
                  merchantCountry:
                    type: string
                  approved:
                    type: boolean
                  failedMask:
                    type: integer
                  reason:
                    type:
                      - string
                      - "null"
                  legs:
                    type: object
                    properties:
                      tdx:
                        type: boolean
                      nitro:
                        type: boolean
                    required:
                      - tdx
                      - nitro
                  latencyMs:
                    type: integer
                  at:
                    type: string
                required:
                  - id
                  - amountMinor
                  - currency
                  - mcc
                  - merchantName
                  - merchantCountry
                  - approved
                  - failedMask
                  - reason
                  - legs
                  - latencyMs
                  - at
          required:
            - issuer
            - lastFour
            - state
            - expiresAt
            - controls
            - settledMinor
            - chargebacks
            - bondClaimMinor
            - authorizations
          description: "A card purchase: its single-use card (never its number) and every
            authorization the card network sent it, with both legs' decision.
            `CAPTURED` once the merchant's capture settles."
        live:
          type: object
          properties:
            store:
              type: string
            transactionId:
              type:
                - string
                - "null"
          required:
            - store
            - transactionId
          description: "A purchase the buyer pays at the store's own checkout: the store's
            origin and the PayPal transaction id once the agent recorded it.
            Never covered nor captured."
