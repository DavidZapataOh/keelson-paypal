            low balance"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/merchants/payout-address:
    post:
      tags:
        - merchants
      summary: Set a merchant's payout address, gasless
      description: Relays `setPayoutAddress` to the bond vault; Keelson pays the gas.
      parameters:
        - schema:
            type: string
            minLength: 1
            maxLength: 255
          required: true
          name: idempotency-key
          in: header
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayoutAddress"
      responses:
        "200":
          description: Confirmed on-chain
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "202":
          description: Sent and not yet confirmed; poll `Location`
          headers:
            Location:
              schema:
                type: string
              required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "401":
          description: No valid credentials
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Not allowed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The same call was submitted with other arguments
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: "Invalid, or the call reverts: `error` names the contract's custom
            error"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: "The relayer cannot send now: chain unavailable, gas price cap or
            low balance"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/transactions/{id}:
    get:
      tags:
        - transactions
      summary: A relayed transaction
      description: "A transaction the Keelson relayer sent: its status, hash, receipt
        fields and explorer link. Final records are immutable."
      parameters:
        - schema:
            type: string
            pattern: ^[0-7][0-9A-HJKMNP-TV-Z]{25}$
          required: true
          name: id
          in: path
      responses:
        "200":
          description: The transaction
          headers:
            Cache-Control:
              schema:
                type: string
              required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "404":
          description: No such transaction
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
webhooks: {}
