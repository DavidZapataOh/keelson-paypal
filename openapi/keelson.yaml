            - at
            - campaigns
            - mu_ppm
            - kappa
        evidence:
          type: object
          properties:
            coverages:
              type: integer
            incidents:
              type: object
              properties:
                total:
                  type: integer
                slashes:
                  type: integer
                  description: Paid from the operator's bond.
                pool:
                  type: integer
                  description: Paid from its `ViolationBondPool` deposit.
                uncollected:
                  type: integer
                  description: Paid by Keelson's treasury instead.
                pending:
                  type: integer
                  description: Not settled yet.
              required:
                - total
                - slashes
                - pool
                - uncollected
                - pending
              description: "Verdicts with the operator at fault: what the grade counts."
          required:
            - coverages
            - incidents
        reserve:
          type: object
          properties:
            warranties:
              type: integer
          required:
            - warranties
          description: Keelson's own faults on the operator's coverages, paid by its
            reserve. Not in the grade.
        frequency:
          type: object
          properties:
            alpha:
              type: number
            beta:
              type: number
            credibility_ppm:
              type: integer
            mean_ppm:
              type: integer
            upper95_ppm:
              type: integer
          required:
            - alpha
            - beta
            - credibility_ppm
            - mean_ppm
            - upper95_ppm
        severity:
          type: object
          properties:
            meanMinor:
              type: integer
            maxMinor:
              type: integer
            lossRatio_ppm:
              type: integer
          required:
            - meanMinor
            - maxMinor
            - lossRatio_ppm
        loss:
          type: object
          properties:
            horizon:
              type: integer
            scenarios:
              type: integer
            expectedMinor:
              type: integer
            var99Minor:
              type: integer
            es99Minor:
              type: integer
            var995Minor:
              type: integer
          required:
            - horizon
            - scenarios
            - expectedMinor
            - var99Minor
            - es99Minor
            - var995Minor
        premium:
          type: object
          properties:
            bps:
              type: integer
              description: Charged on each new coverage, in `lockCoverage`.
            modelBps:
              type: integer
            floorBps:
              type: integer
            theta:
              type: number
            costOfCapital:
              type: number
          required:
            - bps
            - modelBps
            - floorBps
            - theta
            - costOfCapital
        bond:
          type: object
          properties:
            requiredMinor:
              type: integer
          required:
            - requiredMinor
        computeMs:
          type: number
      required:
        - v
        - agentId
        - grade
        - computedAt
        - calibration
        - evidence
        - reserve
        - frequency
        - severity
        - loss
        - premium
        - bond
        - computeMs
      description: An operator's trust grade, premium and minimum bond. Amounts are US
        cents. The red-team campaigns set the prior of the incident rate; the
        operator's covered purchases and the verdicts with it at fault update it
