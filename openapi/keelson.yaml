          description: Registered users when the tree had this root.
        created_at:
          type: string
          format: date-time
      required:
        - root
        - size
        - created_at
    DisputeStatus:
      type: object
      properties:
        dispute_id:
          type: string
        purchase_id:
          type: string
        state:
          type: string
          enum:
            - OPEN
            - ATTRIBUTED
            - RESOLVED
        reason:
          type: string
          description: PayPal's `dispute_reason`.
        received_at:
          type:
            - string
            - "null"
          format: date-time
          description: When Keelson received the dispute's first webhook or poll.
        attributed_at:
          type:
            - string
            - "null"
          format: date-time
        elapsed_ms:
          type:
            - integer
            - "null"
          description: From `received_at` to `attributed_at`; null while the dispute is
            open.
        liable:
          type:
            - string
            - "null"
          enum:
            - operator
            - keelson
            - merchant
            - user
            - null
        parties:
          type: array
          items:
            type: object
            properties:
              party:
                type: string
                enum:
                  - operator
                  - keelson
                  - merchant
              liable:
                type: boolean
            required:
              - party
              - liable
          description: "The parties a verdict can make pay: the operator's bond, Keelson's
            reserve, or the merchant through PayPal."
        verdict:
          type:
            - object
            - "null"
          properties:
            rule:
              type: string
              example: R61
            digest:
              type: string
            chain_id:
              type: integer
            message:
              type: object
              additionalProperties:
                type: string
            signatures:
              type: array
              items:
                type: object
                properties:
                  tee:
                    type: integer
                  signer:
                    type: string
                  signature:
                    type: string
                required:
                  - tee
                  - signer
                  - signature
            facts:
              type: object
              additionalProperties:
                anyOf:
                  - type: string
                  - type: boolean
          required:
            - rule
            - digest
            - chain_id
            - message
            - signatures
            - facts
        settlement:
          type:
            - object
            - "null"
          properties:
            rail:
              type: string
              enum:
                - pyusd
                - paypal
              description: "`pyusd`: the payee the verdict names is the merchant. `paypal`: it
                is Keelson's treasury, which pays the merchant a PayPal Payout."
            outcome:
              type:
                - string
                - "null"
              enum:
                - paid
                - queued
                - claimable
                - failed
                - null
              description: "`queued`: the slash waits out the veto window until `ready_at`.
                `claimable`: the PYUSD transfer failed and waits as a claim.
                Null until the chain answered; always null when neither the
                operator nor Keelson is liable."
            failure:
              type:
                - string
                - "null"
              description: "The contract error that refused the settlement on chain: of a
                `failed` one, or of one Keelson's treasury paid instead."
            paid_by:
              type:
                - string
                - "null"
              enum:
                - chain
                - treasury
                - violation-pool
                - null
              description: "`chain`: the operator's bond or Keelson's reserve paid.
                `violation-pool`: the operator's `ViolationBondPool` deposit
                paid the merchant on a court's conviction, with no verdict.
                `treasury`: the chain refused a verdict that still holds (its
                window or deadline had passed), so Keelson's treasury pays the
                payee itself, PYUSD on chain or a PayPal Payout; the settlement
                is paid once `outcome` is `paid`."
            refund_id:
              type:
                - string
                - "null"
              description: The buyer's PayPal refund; its `custom_id` is the verdict's `ksv1.`
                reference.
            tx_hash:
              type:
                - string
                - "null"
            explorer_url:
              type:
                - string
                - "null"
            ready_at:
              type:
                - string
                - "null"
              format: date-time
            payout_batch_id:
              type:
                - string
                - "null"
            payout_status:
              type:
                - string
                - "null"
            settled_at:
              type:
                - string
                - "null"
              format: date-time
          required:
            - rail
            - outcome
            - failure
            - paid_by
            - refund_id
            - tx_hash
            - explorer_url
            - ready_at
            - payout_batch_id
            - payout_status
            - settled_at
        responses:
          type: array
          items:
            type: object
            properties:
              action:
                type: string
                enum:
                  - provide_evidence
                  - send_message
                  - accept_claim
              stage:
                type: string
                description: PayPal's lifecycle stage when it was sent.
              evidence_types:
                type: array
                items:
                  type: string
              drafted_by:
                type:
                  - string
                  - "null"
                enum:
                  - model
                  - template
                  - null
                description: "`model` when the statement was drafted with citations; `template`
                  when the rule's fixed statement was sent. Null for an accepted
                  claim."
              citations:
                type: integer
                description: "How many passages of the Alibi and the verdict the statement
                  cites. The statement itself is not public: it quotes the
                  purchase's Alibi."
              sent_at:
                type: string
                format: date-time
            required:
              - action
              - stage
              - evidence_types
              - drafted_by
              - citations
              - sent_at
          description: What Keelson sent PayPal for the party at fault. The action and the
            evidence types follow from the rule; a model only drafts the text.
      required:
        - dispute_id
        - purchase_id
        - state
        - reason
        - received_at
        - attributed_at
        - elapsed_ms
        - liable
        - parties
        - verdict
        - settlement
        - responses
    Passkeys:
      type: object
      properties:
        passkeys:
          type: array
          items:
            type: object
            properties:
              credentialId:
                type: string
              payment:
                type: boolean
                description: Registered with the SPC `payment` extension, so SPC can use it.
            required:
              - credentialId
              - payment
      required:
        - passkeys
    Operator:
      type: object
      properties:
        agentId:
          type: string
          pattern: ^(0|[1-9]\d{0,19})$
          description: The ERC-8004 agent id, a decimal integer.
        chainId:
          type: integer
        agentRegistry:
          type: string
        owner:
          type: string
          description: The agent's owner in the Identity registry.
      required:
        - agentId
        - chainId
        - agentRegistry
        - owner
    LinkOperator:
      type: object
      properties:
        chainId:
          anyOf:
            - type: number
              enum:
                - 421614
            - type: number
              enum:
                - 42161
            - type: number
              enum:
                - 11155111
        agentId:
          type: string
          pattern: ^(0|[1-9]\d{0,19})$
          description: The ERC-8004 agent id, a decimal integer.
        name:
          type: string
          minLength: 1
          maxLength: 200
        cnfJwk:
          type: object
          properties:
            kty:
              type: string
              enum:
                - EC
            crv:
              type: string
              enum:
                - P-256
            x:
              type: string
              pattern: ^[A-Za-z0-9_-]{43}$
            y:
              type: string
              pattern: ^[A-Za-z0-9_-]{43}$
            kid:
              type: string
              maxLength: 64
          required:
            - kty
            - crv
            - x
            - y
          description: The agent's P-256 `cnf` key, a public JWK.
        deadline:
          type: integer
          exclusiveMinimum: 0
          description: Unix seconds, at most 15 minutes ahead.
        signature:
          type: string
          maxLength: 8194
          pattern: ^0x([0-9a-fA-F]{2})+$
          description: "The EIP-712 `OperatorLink(uint256 agentId,bytes32
            cnfThumbprint,uint256 deadline)` signature under the domain `{ name:
            \"Keelson\", version: \"1\", chainId }`, by the agent's owner or
            `agentWallet` (EOA, ERC-1271 or ERC-6492). `cnfThumbprint` is the
            RFC 7638 SHA-256 thumbprint of `cnfJwk`."
      required:
        - chainId
        - agentId
        - name
        - cnfJwk
        - deadline
        - signature
    AgentRegistration:
      type: object
      properties:
        type:
          type: string
        name:
          type: string
        description:
          type: string
        image:
          type: string
        services:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              endpoint:
                type: string
              version:
                type: string
