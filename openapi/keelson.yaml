openapi: 3.1.0
info:
  title: Keelson API
  version: 0.0.0
components:
  schemas:
    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
      required:
        - type
        - title
        - status
        - instance
      additionalProperties: {}
    CreatedMandate:
      type: object
      properties:
        id:
          type: string
        mandateHash:
          type: string
          pattern: ^0x[0-9a-f]{64}$
        state:
          type: string
          enum:
            - SIGNED
      required:
        - id
        - mandateHash
        - state
    CreateMandate:
      type: object
      properties:
        payloadSd:
          type: object
          additionalProperties: {}
          description: The SD-JWT payload with its `_sd` digests, as signed.
        disclosures:
          type: array
          items:
            type: string
          maxItems: 1024
          description: Every disclosure of the payload; each digest must resolve.
        commitment:
          type: string
          pattern: ^0x[0-9a-f]{64}$
          description: "`C_m`; must equal the payload's `zk.commitment`."
        assertion:
          $ref: "#/components/schemas/PasskeyAssertion"
      required:
        - payloadSd
        - disclosures
        - commitment
        - assertion
    PasskeyAssertion:
      type: object
      properties:
        authenticatorData:
          type: string
        clientDataJSON:
          type: string
        signature:
          type: string
        credentialId:
          type: string
        userHandle:
          type: string
      required:
        - authenticatorData
        - clientDataJSON
        - signature
        - credentialId
      description: A WebAuthn or Secure Payment Confirmation assertion, base64url fields.
    Mandate:
      type: object
      properties:
        id:
          type: string
        state:
          type: string
          enum:
            - DRAFT
            - COMPILED
            - SIGNED
            - HOLD_PENDING
            - ACTIVE
            - EXHAUSTED
            - EXPIRED
            - REVOKED
        mandateHash:
          type:
            - string
            - "null"
          pattern: ^0x[0-9a-f]{64}$
        card:
          anyOf:
            - $ref: "#/components/schemas/MandateCard"
            - type: "null"
          description: The card rendered from the stored payload, before any checkout
            evidence.
      required:
        - id
        - state
        - mandateHash
        - card
    MandateCard:
      type: object
      properties:
        rows:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              label:
                type: string
              values:
                type: array
                items:
                  type: string
              color:
                type: string
                enum:
                  - green
                  - amber
                  - gray
              answers:
                type: string
                enum:
                  - Keelson
                  - Agent operator
                  - You
            required:
              - field
              - label
              - values
              - color
              - answers
        warnings:
          type: array
          items:
            type: string
      required:
        - rows
        - warnings
    CompiledMandate:
      type: object
      properties:
        mandateDraft:
          type: object
          additionalProperties: {}
          description: The compiled `keelson.mandate.1` payload, unsigned; its commitment
            is zero.
        card:
          $ref: "#/components/schemas/MandateCard"
        ambiguous:
          type: array
          items:
            type: string
          description: Card fields the compilations disagreed on, shown gray for the user
            to settle.
        check:
          type: object
          properties:
            status:
              type: string
              enum:
                - ok
                - refused
                - failed
                - aborted
                - skipped
            discrepancies:
              type:
                - array
                - "null"
              items:
                type: object
                properties:
                  field:
                    type: string
                  issue:
                    type: string
                required:
                  - field
                  - issue
          required:
            - status
            - discrepancies
          description: The round trip of the card against the request. Only `ok` means it
            was checked.
      required:
        - mandateDraft
        - card
        - ambiguous
        - check
    CompileMandate:
      type: object
      properties:
        prompt:
          type: string
          minLength: 1
          description: The shopping request in natural language, at most 2000 UTF-16 code
            units.
          example: Running shoes, size 10, under $100, free returns, by Friday
        credentialId:
          type: string
          minLength: 1
          description: The passkey that will sign the mandate; defaults to the most recent
            one.
        mode:
          type: string
          enum:
            - immediate
            - autonomous
          default: autonomous
          description: Whether the user is present at checkout (`immediate`) or not
            (`autonomous`).
      required:
        - prompt
    Passkeys:
      type: object
      properties:
        passkeys:
          type: array
          items:
            type: object
            properties:
              credentialId:
                type: string
              payment:
                type: boolean
                description: Registered with the SPC `payment` extension, so SPC can use it.
            required:
              - credentialId
              - payment
      required:
        - passkeys
  parameters: {}
paths:
  /health:
    get:
      tags:
        - system
      summary: Liveness probe
      responses:
        "200":
          description: The service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                required:
                  - status
  /status:
    get:
      tags:
        - system
      summary: Dependency status
      responses:
        "200":
          description: Status of the service and its dependencies; always 200
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                      - degraded
                  dependencies:
                    type: object
                    properties:
                      db:
                        type: string
                        enum:
                          - up
                          - down
                      kv:
                        type: string
                        enum:
                          - up
                          - down
                    required:
                      - db
                      - kv
                  version:
                    type: string
                required:
                  - status
                  - dependencies
                  - version
  /v1/events:
    get:
      tags:
        - events
      summary: Stream events
      description: Server-sent events for one channel. Send `Last-Event-ID` to replay
        the events after that id before going live.
      parameters:
        - schema:
            type: string
            description: "`public:<name>`, or the caller's own namespace
              `<base64url(kind:subject)>` with an optional `:<suffix>`."
          required: true
          description: "`public:<name>`, or the caller's own namespace
            `<base64url(kind:subject)>` with an optional `:<suffix>`."
          name: channel
          in: query
        - schema:
            type: string
          required: false
          name: last-event-id
          in: header
      responses:
        "200":
          description: An event stream; each event carries the row id, the channel and a
            JSON payload
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          description: Invalid channel or Last-Event-ID
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Not authenticated
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: The channel belongs to another principal
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Too many concurrent streams for this principal
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/mandates:
    post:
      tags:
        - mandates
      summary: Store a passkey-signed mandate
      description: Verifies the passkey assertion over `M =
        SHA-256("keelson/mandate-challenge/v1" || 0x00 || H_sd || C_m)` and
        stores the mandate as `SIGNED`.
      parameters:
        - schema:
            type: string
            minLength: 1
            maxLength: 255
          required: true
          name: idempotency-key
          in: header
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMandate"
      responses:
        "201":
          description: The mandate was stored
          headers:
            location:
              schema:
                type: string
              required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedMandate"
        "401":
          description: Not signed in, or the signature is invalid
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: The passkey is not the signer's
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The mandate is already stored
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: The mandate is invalid
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/mandates/{id}:
    get:
      tags:
        - mandates
      summary: Get a mandate
      parameters:
        - schema:
            type: string
          required: true
          name: id
          in: path
      responses:
        "200":
          description: The mandate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mandate"
        "401":
          description: Not signed in
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such mandate for this user
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/mandates/compile:
    post:
      tags:
        - mandates
      summary: Compile a mandate from a shopping request
      description: Two models compile the request independently; fields they disagree
        on or the request leaves unstated come back ambiguous, and a third model
        checks the rendered card against the request. Limited to 10 requests a
        minute per user.
      parameters:
        - schema:
            type: string
            minLength: 1
            maxLength: 255
          required: true
          name: idempotency-key
          in: header
        - schema:
            type: string
            maxLength: 128
            description: The app's opaque device id, recorded as `risk_data.device_fp`.
              Required.
          required: false
          description: The app's opaque device id, recorded as `risk_data.device_fp`.
            Required.
          name: keelson-device
          in: header
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompileMandate"
      responses:
        "200":
          description: The draft mandate and its card
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompiledMandate"
        "401":
          description: Not signed in
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: The passkey is not the user's
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The user has no passkey to sign with
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: The prompt is too long (`prompt-too-long`), the device id is
            missing (`device-required`), the compilations conflict
            (`compile-conflict`), the request leaves out a value a mandate needs
            (`compile-needs-input`) or cannot become a mandate
            (`compile-unresolved`); `fields` names what to ask the user
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Too many compilations
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "502":
          description: The models failed to compile the request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: Inputs a mandate needs are not available yet; `missing` names them
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/passkeys:
    get:
      tags:
        - passkeys
      summary: List the signed-in user's passkeys
      description: The credentials a mandate can be signed with, oldest first.
      responses:
        "200":
          description: The passkeys
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Passkeys"
        "401":
          description: Not signed in
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
webhooks: {}
