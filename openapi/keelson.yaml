          in: header
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BondDeposit"
      responses:
        "200":
          description: Confirmed on-chain
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "202":
          description: Sent and not yet confirmed; poll `Location`
          headers:
            Location:
              schema:
                type: string
              required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "401":
          description: No valid credentials
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Not allowed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The same call was submitted with other arguments
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: "Invalid, or the call reverts: `error` names the contract's custom
