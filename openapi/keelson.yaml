      required:
        - v
        - mid
        - iat
        - nbf
        - exp
        - nonce
        - mode
        - user
        - agent
        - payment
        - checkout
        - intent
        - policy
        - consent
        - zk
        - risk_data
      additionalProperties: false
      description: The compiled `keelson.mandate.1` payload, unsigned; its commitment
