  /v1/alibis/verify:
    post:
      tags:
        - alibis
      summary: Verify an alibi
      description: Runs the browser verifier's algorithm on an Alibi bundle against
        the pinned trust roots and a public Arbitrum RPC. No authentication; the
        bundle is not stored.
      requestBody:
        required: true
        content:
          application/vnd.keelson.alibi.v1+json:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: The report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlibiReport"
        "400":
          description: Not an Alibi bundle; `pointer` names the failing value
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          description: The body is over 1 MiB
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "415":
          description: The body is not an Alibi bundle's media type
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
