      summary: Choose how a merchant is paid when a dispute goes its way
      description: "Applies to verdicts signed afterwards: the rail decides the payee
        the TEE legs sign into the `Verdict`. The merchant signs the choice, as
        it signs its on-chain payout address. Sent by a client with
        `merchants:write` or by the merchant's own session."
