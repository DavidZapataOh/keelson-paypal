openapi: 3.1.0
info:
  title: Keelson API
  version: 0.0.0
servers:
  - url: https://api.keelson.finance
    description: Keelson's API, on the PayPal sandbox
components:
  securitySchemes:
    oauth2:
      type: oauth2
      description: OAuth 2.1. An operator's agent uses client credentials; an app
        acting for a user uses the authorization code grant with PKCE (S256).
        Every token is requested for the resource `https://api.keelson.finance`
        (RFC 8707).
      flows:
        clientCredentials:
          tokenUrl: https://api.keelson.finance/api/auth/oauth2/token
          scopes: &a1
            countersign:write: Countersign carts as the operator's own agent
            evidence:write: Seal and store evidence
            evidence:disclose: Disclose stored evidence items
            evidence:decrypt: Decrypt sealed evidence originals
            alibis:read: Read and verify Alibis
            disputes:read: Read disputes and their attribution
            operators:write: Link and manage operators
            merchants:write: Manage a merchant's settings
            mandates:request: Ask the user for a mandate or a change of one
            purchases:write: Check and countersign carts for the user
            offline_access: Stay connected with a refresh token
        authorizationCode:
          authorizationUrl: https://api.keelson.finance/api/auth/oauth2/authorize
          tokenUrl: https://api.keelson.finance/api/auth/oauth2/token
          refreshUrl: https://api.keelson.finance/api/auth/oauth2/token
          scopes: *a1
    session:
      type: apiKey
      in: cookie
      name: __Secure-better-auth.session_token
      description: The session of a user signed in to the Keelson app.
  schemas:
    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
      required:
        - type
        - title
        - status
        - instance
      additionalProperties: {}
    Capabilities:
      type: object
      properties:
        decoys:
          type: boolean
      required:
        - decoys
    CreatedMandate:
      type: object
      properties:
        id:
          type: string
        mandateHash:
          type: string
          pattern: ^0x[0-9a-f]{64}$
        state:
          type: string
          enum:
            - SIGNED
            - ACTIVE
          description: "`ACTIVE` at once when the mandate allows several merchants: each
            cart is then held on its own."
        openMandate:
          type:
            - string
            - "null"
          description: The open mandate (L2) the TEE issued; the agent closes it per
            purchase.
      required:
        - id
        - mandateHash
        - state
        - openMandate
    CreateMandate:
      type: object
      properties:
        payloadSd:
          type: object
          additionalProperties: {}
          description: The SD-JWT payload with its `_sd` digests, as signed.
        disclosures:
          type: array
          items:
            type: string
          maxItems: 1024
          description: Every disclosure of the payload; each digest must resolve.
        decoySalts:
          type: array
          items:
            type: string
            pattern: ^[A-Za-z0-9_-]{22}$
          maxItems: 512
          description: The salts of the payload's decoy digests (RFC 9901 section 4.2.5);
            every other digest resolves to a disclosure. Accepted once both TEEs
            resolve decoys.
        commitment:
          type: string
          pattern: ^0x[0-9a-f]{64}$
          description: "`C_m`; must equal the payload's `zk.commitment`."
        renews:
          type: string
          minLength: 26
          maxLength: 26
          description: "A mandate of yours that `needsRenewal`, which this one replaces:
            it is revoked, and its PayPal hold voided, once this one is stored."
        salt:
          type: string
          pattern: ^0x[0-9a-f]{32}$
          description: The salt that opens `C_m`; the TEE needs it to issue the mandate.
        assertion:
          $ref: "#/components/schemas/PasskeyAssertion"
        connection:
          type: object
          properties:
            code:
              type: string
              minLength: 8
              maxLength: 16
            askAboveMinor:
              type: integer
              exclusiveMinimum: 0
              maximum: 9007199254740991
          required:
            - code
          description: The agent's request this mandate approves, by its user code. The
            mandate must name the asking agent's operator and grant no more than
            it asked; `askAboveMinor` may only be lower too.
      required:
        - payloadSd
        - disclosures
        - commitment
        - assertion
    PasskeyAssertion:
      type: object
      properties:
        authenticatorData:
          type: string
        clientDataJSON:
          type: string
        signature:
          type: string
        credentialId:
          type: string
        userHandle:
          type: string
      required:
        - authenticatorData
        - clientDataJSON
        - signature
        - credentialId
      description: A WebAuthn or Secure Payment Confirmation assertion, base64url fields.
    Mandates:
      type: object
      properties:
        mandates:
          type: array
          items:
            $ref: "#/components/schemas/MandateSummary"
      required:
        - mandates
    MandateSummary:
      type: object
      properties:
        id:
          type: string
        state:
          type: string
          enum:
            - DRAFT
            - COMPILED
            - SIGNED
            - HOLD_PENDING
            - ACTIVE
            - EXHAUSTED
            - EXPIRED
            - REVOKED
        budget:
          $ref: "#/components/schemas/MandateBudget"
        merchantIds:
          type: array
          items:
            type: string
        holdMode:
          type: string
          enum:
            - mandate
            - per_purchase
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - state
        - budget
        - merchantIds
        - holdMode
        - expiresAt
        - createdAt
    MandateBudget:
      type: object
      properties:
        currency:
          type: string
        maxMinor:
          type: string
          pattern: ^\d+$
        remainingMinor:
          type: string
          pattern: ^\d+$
      required:
        - currency
        - maxMinor
        - remainingMinor
      description: The mandate's budget and what is left of it, in minor units.
    Mandate:
      type: object
      properties:
        id:
          type: string
        state:
          type: string
          enum:
            - DRAFT
            - COMPILED
            - SIGNED
            - HOLD_PENDING
            - ACTIVE
            - EXHAUSTED
            - EXPIRED
            - REVOKED
        rail:
          type: string
          enum:
            - paypal
            - card
          description: "`card` when each purchase is paid with its own single-use card."
        mandateHash:
          type:
            - string
            - "null"
          pattern: ^0x[0-9a-f]{64}$
        budget:
          $ref: "#/components/schemas/MandateBudget"
        expiresAt:
          type: string
          format: date-time
        hold:
          anyOf:
            - $ref: "#/components/schemas/MandateHold"
            - type: "null"
          description: The PayPal hold of the mandate's budget, once its order exists.
        card:
          anyOf:
            - $ref: "#/components/schemas/MandateCard"
            - type: "null"
          description: The card rendered from the stored payload, before any checkout
            evidence.
        purchases:
          type: array
          items:
            $ref: "#/components/schemas/MandatePurchase"
          description: The mandate's latest 100 purchases, newest first.
        c3Published:
          type: boolean
          description: Whether the mandate's C3 proof (its user is registered, without
            saying who) is stored and its root is on chain. Its purchases'
            Alibis wait for it.
        pendingHolds:
          type: array
          items:
            $ref: "#/components/schemas/PendingPurchaseHold"
          description: Purchase holds of a several-store mandate still waiting for the
            buyer's PayPal approval, oldest first. Later changes arrive as
            `mandate.purchase_hold` events.
        status:
          anyOf:
            - type: object
              properties:
                uri:
                  type: string
                idx:
                  type: integer
                revoked:
                  type: boolean
              required:
                - uri
                - idx
                - revoked
            - type: "null"
          description: "The mandate's entry in the public status list
            (draft-ietf-oauth-status-list-21): `revoked` once its revocation is
            requested, which the list carries from its next signing."
        needsRenewal:
          type: boolean
          description: "`true` when leg A no longer holds the credential issuer key the
            mandate was issued with: countersigns answer `mandate-needs-renewal`
            until the user signs a new mandate with `renews`."
      required:
        - id
        - state
        - rail
        - mandateHash
        - budget
        - expiresAt
        - hold
        - card
        - purchases
        - c3Published
        - pendingHolds
        - status
        - needsRenewal
    MandateHold:
      type: object
      properties:
        mode:
          type: string
          enum:
            - mandate
            - per_purchase
        orderId:
          type: string
        authorizationId:
          type:
            - string
            - "null"
          description: "The authorization captures use: the original, or its
            reauthorization."
        authorizedAt:
          type:
            - string
            - "null"
          format: date-time
        reauthorizedAt:
          type:
            - string
            - "null"
          format: date-time
        remainingMinor:
          type: string
          pattern: ^\d+$
        state:
          type: string
          enum:
            - PENDING
            - AUTHORIZED
            - RELEASED
          description: "`PENDING` until authorized; `RELEASED` once the mandate ended and
            the hold was voided or captured."
      required:
        - mode
        - orderId
        - authorizationId
        - authorizedAt
        - reauthorizedAt
        - remainingMinor
        - state
    MandateCard:
      type: object
      properties:
        rows:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              label:
                type: string
              values:
                type: array
                items:
                  type: string
              color:
                type: string
                enum:
                  - green
                  - amber
                  - gray
              answers:
                type: string
                enum:
                  - Keelson
                  - Agent operator
                  - You
            required:
              - field
              - label
              - values
              - color
              - answers
        warnings:
          type: array
          items:
            type: string
      required:
        - rows
        - warnings
    MandatePurchase:
      type: object
      properties:
        id:
          type: string
          description: The purchase's ULID, which is also its Alibi id.
        merchantId:
          type: string
        amount:
          type: object
          properties:
            currency:
              type: string
            minor:
              type: string
            breakdown:
              $ref: "#/components/schemas/CheckoutBreakdown"
          required:
            - currency
            - minor
        createdAt:
          type: string
          format: date-time
        state:
          type: string
        logIndex:
          type: string
          description: The leaf's index in the Alibi log.
        coverage:
          type: object
          properties:
            chainId:
              type: integer
            txHash:
              type:
                - string
                - "null"
          required:
            - chainId
            - txHash
          description: The `lockCoverage` transaction of the operator's bond.
        capture:
          type: object
          properties:
            id:
              type: string
            invoiceId:
              type: string
            status:
              type:
                - string
                - "null"
          required:
            - id
            - invoiceId
            - status
          description: The PayPal capture of the countersigned amount.
        failure:
          type: object
          properties:
            step:
              type: string
            reason:
              type: string
          required:
            - step
            - reason
          description: The step that failed and why; nothing was captured.
        blocked:
          type: array
          items:
            type: string
          description: For a `DENIED` cart, the mandate fields whose check failed.
        reasons:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              mandate:
                type:
                  - string
                  - "null"
              cart:
                type:
                  - string
                  - "null"
            required:
              - field
              - mandate
              - cart
          description: For a `DENIED` cart, each failed field with what the mandate
            allowed and what the cart had, as text.
        checks:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              mandate:
                type:
                  - string
                  - "null"
              cart:
                type:
                  - string
                  - "null"
              pass:
                type: boolean
            required:
              - field
              - mandate
              - cart
              - pass
          description: For a purchase the engine checked, each mandate field with what the
            mandate allowed, what the cart had and whether it held.
        card:
          type: object
          properties:
            issuer:
              type: string
            lastFour:
              type: string
            state:
              type: string
            expiresAt:
              type: string
            controls:
              type: object
              additionalProperties: {}
            settledMinor:
              type:
                - string
                - "null"
            chargebacks:
              type: array
              items:
                type: object
                additionalProperties: {}
              description: Chargebacks filed through the card issuer over this purchase.
            bondClaimMinor:
              type: string
              description: "The most a bond claim over this purchase may pay: the settled
                amount less what chargebacks returned; 0 while one is open."
            authorizations:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  amountMinor:
                    type: string
                  currency:
                    type: string
                  mcc:
                    type: string
                  merchantName:
                    type: string
                  merchantCountry:
                    type: string
                  approved:
                    type: boolean
                  failedMask:
                    type: integer
                  reason:
                    type:
                      - string
                      - "null"
                  legs:
                    type: object
                    properties:
                      tdx:
                        type: boolean
                      nitro:
                        type: boolean
                    required:
                      - tdx
                      - nitro
                  latencyMs:
                    type: integer
                  at:
                    type: string
                required:
                  - id
                  - amountMinor
                  - currency
                  - mcc
                  - merchantName
                  - merchantCountry
                  - approved
                  - failedMask
                  - reason
                  - legs
                  - latencyMs
                  - at
          required:
            - issuer
            - lastFour
            - state
            - expiresAt
            - controls
            - settledMinor
            - chargebacks
            - bondClaimMinor
            - authorizations
          description: "A card purchase: its single-use card (never its number) and every
            authorization the card network sent it, with both legs' decision.
            `CAPTURED` once the merchant's capture settles."
        live:
          type: object
          properties:
            store:
              type: string
            transactionId:
              type:
                - string
                - "null"
          required:
            - store
            - transactionId
          description: "A purchase the buyer pays at the store's own checkout: the store's
            origin and the PayPal transaction id once the agent recorded it.
            Never covered nor captured."
        disputes:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              state:
                type: string
                enum:
                  - OPEN
                  - ATTRIBUTED
                  - RESOLVED
            required:
              - id
              - state
          description: PayPal disputes over the purchase; `GET /v1/disputes/{id}` has each.
      required:
        - id
        - merchantId
        - amount
        - createdAt
        - state
        - disputes
    CheckoutBreakdown:
      type: object
      properties:
        items:
          type: string
        tax:
          type: string
        shipping:
          type: string
        discount:
          type: string
      required:
        - items
        - tax
        - shipping
        - discount
      description: "What the countersigned total is made of, in minor units: the
        items, plus tax and shipping, less discounts. Absent for purchases
        countersigned without it."
    PendingPurchaseHold:
      type: object
      properties:
        requestId:
          type: string
        orderId:
          type: string
          description: The PayPal order the buyer approves.
        merchant:
          type: string
        amountMinor:
          type: string
      required:
        - requestId
        - orderId
        - merchant
        - amountMinor
    PayPalClient:
      type: object
      properties:
        clientId:
          type: string
        environment:
          type: string
          enum:
            - sandbox
            - production
      required:
        - clientId
        - environment
    HoldOrder:
      type: object
      properties:
        orderId:
          type: string
        state:
          type: string
          enum:
            - HOLD_PENDING
        approved:
          type: boolean
          description: "The user's saved PayPal paid the order, so PayPal shows the buyer
            nothing: authorize it next."
      required:
        - orderId
        - state
        - approved
    AuthorizedHold:
      type: object
      properties:
        state:
          type: string
          enum:
            - ACTIVE
        authorizationId:
          type: string
        expiresAt:
          type: string
          format: date-time
          description: When PayPal expires the authorization, 29 days after it was created.
      required:
        - state
        - authorizationId
        - expiresAt
    PendingHold:
      type: object
      properties:
        state:
          type: string
          enum:
            - HOLD_PENDING
        authorizationId:
          type: string
      required:
        - state
        - authorizationId
      description: PayPal holds the authorization for review; Keelson activates it
        once created.
    AuthorizeHold:
      type: object
      properties:
        orderId:
          type: string
          minLength: 1
          maxLength: 64
      required:
        - orderId
      description: The order the buyer approved.
    PayPalSetupToken:
      type: object
      properties:
        setupToken:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[0-9A-Za-z_-]+$
      required:
        - setupToken
    PayPalWallet:
      type: object
      properties:
        email:
          type:
            - string
            - "null"
          description: The PayPal account, as PayPal names it.
        createdAt:
          type: string
          format: date-time
      required:
        - email
        - createdAt
      description: The PayPal the user saved for holds under the mandates they sign.
    PurchaseHoldOrder:
      type: object
      properties:
        requestId:
          type: string
        orderId:
          type: string
      required:
        - requestId
        - orderId
    CreatePurchaseHold:
      type: object
      properties:
        requestId:
          type: string
          pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
          description: The request id the purchase is countersigned under.
        merchant:
          type: string
          minLength: 1
          maxLength: 256
        currency:
          type: string
          minLength: 3
          maxLength: 3
        amountMinor:
          type: string
          pattern: ^[1-9]\d{0,17}$
          description: The checkout total the purchase is countersigned for, tax and
            shipping included, in minor units.
        cartHash:
          type: string
          pattern: ^0x[0-9a-f]{64}$
        closedMandate:
          type: string
          minLength: 1
          maxLength: 32768
          description: The mandate's open mandate closed by the agent key over `requestId`
            and `cartHash`; it proves the caller is the mandate's agent.
      required:
        - requestId
        - merchant
        - currency
        - amountMinor
        - cartHash
        - closedMandate
    AuthorizedPurchaseHold:
      type: object
      properties:
        requestId:
          type: string
        state:
          type: string
          enum:
            - AUTHORIZED
            - PENDING
        authorizationId:
          type: string
      required:
        - requestId
        - state
        - authorizationId
      description: "`PENDING` while PayPal reviews the authorization; asking again
        once it is created authorizes the hold."
    AuthorizePurchaseHold:
      type: object
      properties:
        orderId:
          type: string
          minLength: 1
          maxLength: 64
      required:
        - orderId
      description: The order the buyer approved.
    RevokedMandate:
      type: object
      properties:
        state:
          type: string
          enum:
            - REVOKED
      required:
        - state
    RevokingMandate:
      type: object
      properties:
        state:
          type: string
          enum:
            - REVOKING
      required:
        - state
      description: Purchases already countersigned may still be captured; the hold is
        voided after them.
    DeviceAuthorization:
      type: object
      properties:
        device_code:
          type: string
        user_code:
          type: string
        verification_uri:
          type: string
        verification_uri_complete:
          type: string
        expires_in:
          type: integer
        interval:
          type: integer
        request_id:
          type: string
          description: "The request's id: `GET /v1/connections/requests/{id}` reads its
            state without spending the device code."
        match_number:
          type: integer
          minimum: 10
          maximum: 99
          description: "Show it beside the link: the user picks it out of three before the
            request opens, so a link relayed by someone else does not."
      required:
        - device_code
        - user_code
        - verification_uri
        - verification_uri_complete
        - expires_in
        - interval
        - request_id
      description: RFC 8628 §3.2. Show `user_code` and `verification_uri` to the user,
        then poll `POST /v1/connections/token` every `interval` seconds.
    ConnectionRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          example: Claude Code
        reason:
          type: string
          minLength: 100
          maxLength: 1000
          description: Why the agent asks, in its own words; the user reads it before
            approving.
        limits:
          $ref: "#/components/schemas/ConnectionLimits"
      required:
        - name
        - reason
        - limits
    ConnectionLimits:
      type: object
      properties:
        currency:
          type: string
          enum:
            - AUD
            - BRL
            - CAD
            - CNY
            - CZK
            - DKK
            - EUR
            - HKD
            - HUF
            - ILS
            - JPY
            - MYR
            - MXN
            - TWD
            - NZD
            - NOK
            - PHP
            - PLN
            - GBP
            - SGD
            - SEK
            - CHF
            - THB
            - USD
          default: USD
        perPurchaseMinor:
          type: integer
          exclusiveMinimum: 0
          maximum: 9007199254740991
          description: Most one purchase may cost, minor units.
        totalMinor:
          type: integer
          exclusiveMinimum: 0
          maximum: 9007199254740991
          description: Most all purchases may cost together.
        merchants:
          type: array
          items:
            type: string
            enum:
              - mrc_runfast
          minItems: 1
          maxItems: 1
          default:
            - mrc_runfast
          description: Onboarded merchant ids; every one when left out.
        until:
          type: string
          format: date-time
          description: When the mandate ends.
        askAboveMinor:
          type: integer
          exclusiveMinimum: 0
          maximum: 9007199254740991
          description: Above this a purchase waits for the user's one-time approval,
            although the limits allow it.
      required:
        - perPurchaseMinor
        - totalMinor
        - until
    ConnectionApproved:
      type: object
      properties:
        mandate_id:
          type: string
        kind:
          type: string
          enum:
            - connect
            - once
      required:
        - mandate_id
        - kind
    ConnectionTokenError:
      type: object
      properties:
        error:
          type: string
          enum:
            - authorization_pending
            - slow_down
            - access_denied
            - expired_token
            - invalid_grant
            - unsupported_grant_type
        error_description:
          type: string
        interval:
          type: integer
      required:
        - error
        - error_description
    Connection:
      type: object
      properties:
        code:
          type: string
        kind:
          type: string
          enum:
            - connect
            - once
            - change
          description: "`connect`: standing limits. `once`: one cart its mandate does not
            allow. `change`: new limits that replace `parent`, whose hold is
            released."
        state:
          type: string
          enum:
            - PENDING
            - APPROVED
            - DENIED
            - EXPIRED
        name:
          type: string
        reason:
          type: string
        agent:
          type: object
          properties:
            agentId:
              type: string
            operator:
              type: string
            bond:
              type:
                - object
                - "null"
              properties:
                asset:
                  type: string
                min:
                  type: number
                vault:
                  type: string
              required:
                - asset
                - min
                - vault
          required:
            - agentId
            - operator
            - bond
        limits:
          type: object
          properties:
            currency:
              type: string
            perPurchaseMinor:
              type: string
            totalMinor:
              type: string
            askAboveMinor:
              type:
