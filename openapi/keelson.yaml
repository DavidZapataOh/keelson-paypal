openapi: 3.1.0
info:
  title: Keelson API
  version: 0.0.0
components:
  schemas:
    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
      required:
        - type
        - title
        - status
        - instance
      additionalProperties: {}
    CreatedMandate:
      type: object
      properties:
        id:
          type: string
        mandateHash:
          type: string
          pattern: ^0x[0-9a-f]{64}$
        state:
          type: string
          enum:
            - SIGNED
        openMandate:
          type:
            - string
            - "null"
          description: The open mandate (L2) the TEE issued; the agent closes it per
            purchase.
      required:
        - id
        - mandateHash
        - state
        - openMandate
    CreateMandate:
      type: object
      properties:
        payloadSd:
          type: object
          additionalProperties: {}
          description: The SD-JWT payload with its `_sd` digests, as signed.
        disclosures:
          type: array
          items:
            type: string
          maxItems: 1024
          description: Every disclosure of the payload; each digest must resolve.
        commitment:
          type: string
          pattern: ^0x[0-9a-f]{64}$
          description: "`C_m`; must equal the payload's `zk.commitment`."
        salt:
          type: string
          pattern: ^0x[0-9a-f]{32}$
          description: The salt that opens `C_m`; the TEE needs it to issue the mandate.
        assertion:
          $ref: "#/components/schemas/PasskeyAssertion"
      required:
        - payloadSd
        - disclosures
        - commitment
        - assertion
    PasskeyAssertion:
      type: object
      properties:
        authenticatorData:
          type: string
        clientDataJSON:
          type: string
        signature:
          type: string
        credentialId:
          type: string
        userHandle:
          type: string
      required:
        - authenticatorData
        - clientDataJSON
        - signature
        - credentialId
      description: A WebAuthn or Secure Payment Confirmation assertion, base64url fields.
    Mandate:
      type: object
      properties:
        id:
          type: string
        state:
          type: string
          enum:
            - DRAFT
            - COMPILED
            - SIGNED
            - HOLD_PENDING
            - ACTIVE
            - EXHAUSTED
            - EXPIRED
            - REVOKED
        mandateHash:
          type:
            - string
            - "null"
          pattern: ^0x[0-9a-f]{64}$
        card:
          anyOf:
            - $ref: "#/components/schemas/MandateCard"
            - type: "null"
          description: The card rendered from the stored payload, before any checkout
            evidence.
      required:
        - id
        - state
        - mandateHash
        - card
    MandateCard:
      type: object
      properties:
        rows:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              label:
                type: string
              values:
                type: array
                items:
                  type: string
              color:
                type: string
                enum:
                  - green
                  - amber
                  - gray
              answers:
                type: string
                enum:
                  - Keelson
                  - Agent operator
                  - You
            required:
              - field
              - label
              - values
              - color
              - answers
        warnings:
          type: array
          items:
            type: string
      required:
        - rows
        - warnings
    CompiledMandate:
      type: object
      properties:
        mandateDraft:
          $ref: "#/components/schemas/MandateDraft"
        card:
          $ref: "#/components/schemas/MandateCard"
        ambiguous:
          type: array
          items:
            type: string
            enum:
              - mode
              - recurrence
              - total
              - currency
              - budget
              - merchant
              - deadline
              - quantity
              - items
              - category
              - variant
              - return_policy
              - agent
              - bond
              - subjective
              - summary
          description: Card fields the compilations disagreed on or the request left
            unstated, shown gray for the user to settle. Pass them to
            `prepareSigning` so the card the user signs shows them gray too.
        check:
          type: object
          properties:
            status:
              type: string
              enum:
                - ok
                - refused
                - failed
                - aborted
                - skipped
            discrepancies:
              type:
                - array
                - "null"
              items:
                type: object
                properties:
                  field:
                    type: string
                  issue:
                    type: string
                required:
                  - field
                  - issue
          required:
            - status
            - discrepancies
          description: The round trip of the card against the request. Only `ok` means it
            was checked.
      required:
        - mandateDraft
        - card
        - ambiguous
        - check
    MandateDraft:
      type: object
      properties:
        v:
          type: string
          enum:
            - keelson.mandate.1
        mid:
          type: string
        iat:
          type: integer
          minimum: 0
        nbf:
          type: integer
          minimum: 0
        exp:
          type: integer
          minimum: 0
        nonce:
          type: string
          pattern: ^[A-Za-z0-9_-]{21}[AQgw]$
        mode:
          type: string
          enum:
            - immediate
            - autonomous
        user:
          type: object
          properties:
            sub:
              type: string
            cred:
              type: object
              properties:
                id:
                  type: string
                  pattern: ^[A-Za-z0-9_-]+$
                rp_id:
                  type: string
                jwk:
                  type: object
                  properties:
                    kty:
                      type: string
                      enum:
                        - EC
                    crv:
                      type: string
                      enum:
                        - P-256
                    x:
                      type: string
                      pattern: ^[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$
                    y:
                      type: string
                      pattern: ^[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$
                  required:
                    - kty
                    - crv
                    - x
                    - y
                  additionalProperties: false
              required:
                - id
                - rp_id
                - jwk
              additionalProperties: false
            app_login_id:
              type: string
          required:
            - sub
            - cred
            - app_login_id
          additionalProperties: false
        agent:
          type: object
          properties:
            operator:
              type: object
              properties:
                agent_registry:
                  type: string
                agent_id:
                  type: string
              required:
                - agent_registry
                - agent_id
              additionalProperties: false
            cnf:
              type: object
              properties:
                jwk:
                  type: object
                  properties:
                    kty:
                      type: string
                      enum:
                        - EC
                    crv:
                      type: string
                      enum:
                        - P-256
                    x:
                      type: string
                      pattern: ^[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$
                    y:
                      type: string
                      pattern: ^[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$
                    kid:
                      type: string
                  required:
                    - kty
                    - crv
                    - x
                    - y
                    - kid
                  additionalProperties: false
              required:
                - jwk
              additionalProperties: false
            bond:
              type: object
              properties:
                vault:
                  type: string
                asset:
                  type: string
                min:
                  type: integer
                  minimum: 0
              required:
                - vault
                - asset
                - min
              additionalProperties: false
          required:
            - operator
            - cnf
            - bond
          additionalProperties: false
        payment:
          type: object
          properties:
            rail:
              type: string
              enum:
                - paypal
            currency:
              type: string
              enum:
                - AUD
                - BRL
                - CAD
                - CNY
                - CZK
                - DKK
                - EUR
                - HKD
                - HUF
                - ILS
                - JPY
                - MYR
                - MXN
                - TWD
                - NZD
                - NOK
                - PHP
                - PLN
                - GBP
                - SGD
                - SEK
                - CHF
                - THB
                - USD
            constraints:
              type: array
              items:
                oneOf:
                  - type: object
                    properties:
                      type:
                        type: string
                        enum:
                          - payment.amount_range
                      max:
                        type: integer
                        minimum: 0
                      currency:
                        type: string
                        enum:
                          - AUD
                          - BRL
                          - CAD
                          - CNY
                          - CZK
                          - DKK
                          - EUR
                          - HKD
                          - HUF
                          - ILS
                          - JPY
                          - MYR
                          - MXN
                          - TWD
                          - NZD
                          - NOK
                          - PHP
                          - PLN
                          - GBP
                          - SGD
                          - SEK
                          - CHF
                          - THB
                          - USD
                    required:
                      - type
                      - max
                      - currency
                    additionalProperties: false
                  - type: object
                    properties:
                      type:
                        type: string
                        enum:
                          - payment.budget
                      max:
                        type: integer
                        minimum: 0
                      currency:
                        type: string
                        enum:
                          - AUD
                          - BRL
                          - CAD
                          - CNY
                          - CZK
                          - DKK
                          - EUR
                          - HKD
                          - HUF
                          - ILS
                          - JPY
                          - MYR
                          - MXN
                          - TWD
                          - NZD
                          - NOK
                          - PHP
                          - PLN
                          - GBP
                          - SGD
                          - SEK
                          - CHF
                          - THB
                          - USD
                    required:
                      - type
                      - max
                      - currency
                    additionalProperties: false
                  - type: object
                    properties:
                      type:
                        type: string
                        enum:
                          - payment.allowed_payees
                      allowed:
                        type: array
                        items:
                          type: object
                          properties:
                            paypal_merchant_id:
                              type: string
                          required:
                            - paypal_merchant_id
                          additionalProperties: false
                        minItems: 1
                    required:
                      - type
                      - allowed
                    additionalProperties: false
                  - type: object
                    properties:
                      type:
                        type: string
                        enum:
                          - payment.execution_date
                      not_after:
                        type: string
                        format: date-time
                    required:
                      - type
                      - not_after
                    additionalProperties: false
          required:
            - rail
            - currency
            - constraints
          additionalProperties: false
        checkout:
          type: object
          properties:
            constraints:
              type: array
              items:
                oneOf:
                  - type: object
                    properties:
                      type:
                        type: string
                        enum:
                          - checkout.allowed_merchants
                      allowed:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            name:
                              type: string
                            website:
                              type: string
                            paypal_merchant_id:
                              type: string
                          required:
                            - id
                            - name
                            - website
                            - paypal_merchant_id
                          additionalProperties: false
                        minItems: 1
                    required:
                      - type
                      - allowed
                    additionalProperties: false
                  - type: object
                    properties:
                      type:
                        type: string
                        enum:
                          - checkout.line_items
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            acceptable_items:
                              type: array
                              items:
                                type: object
                                properties:
                                  id:
                                    type: string
                                  title:
                                    type: string
                                required:
                                  - id
                                additionalProperties: false
                              minItems: 1
                            quantity:
                              type: integer
                              exclusiveMinimum: 0
                          required:
                            - id
                            - acceptable_items
                            - quantity
                          additionalProperties: false
                    required:
                      - type
                      - items
                    additionalProperties: false
                  - type: object
                    properties:
                      type:
                        type: string
                        enum:
                          - keelson.category
                      allow:
                        type: array
                        items:
                          type: string
                          enum:
                            - gpt:1
                            - gpt:166
                            - gpt:8
                            - gpt:537
                            - gpt:111
                            - gpt:141
                            - gpt:222
                            - gpt:412
                            - gpt:436
                            - gpt:632
                            - gpt:469
                            - gpt:536
                            - gpt:5181
                            - gpt:772
                            - gpt:783
                            - gpt:922
                            - gpt:5605
                            - gpt:2092
                            - gpt:988
                            - gpt:1239
                            - gpt:888
                            - gpt:187
                        minItems: 1
                      deny:
                        type: array
                        items:
                          type: string
                          enum:
                            - gpt:1
                            - gpt:166
                            - gpt:8
                            - gpt:537
                            - gpt:111
                            - gpt:141
                            - gpt:222
                            - gpt:412
                            - gpt:436
                            - gpt:632
                            - gpt:469
                            - gpt:536
                            - gpt:5181
                            - gpt:772
                            - gpt:783
                            - gpt:922
                            - gpt:5605
                            - gpt:2092
                            - gpt:988
                            - gpt:1239
                            - gpt:888
                            - gpt:187
                    required:
                      - type
                      - allow
                      - deny
                    additionalProperties: false
                  - type: object
                    properties:
                      type:
                        type: string
                        enum:
                          - keelson.attributes
                      must:
                        type: object
                        additionalProperties:
                          type: string
                    required:
                      - type
                      - must
                    additionalProperties: false
                  - type: object
                    properties:
                      type:
                        type: string
                        enum:
                          - keelson.returns
                      min_days:
                        type: integer
                        minimum: 0
                      free:
                        type: boolean
                    required:
                      - type
                      - min_days
                      - free
                    additionalProperties: false
          required:
            - constraints
          additionalProperties: false
        intent:
          type: object
          properties:
            prompt_summary:
              type: string
            prompt_hash:
              type: string
              pattern: ^sha256:[0-9a-f]{64}$
            subjective:
              type: array
              items:
                type: string
          required:
            - prompt_summary
            - prompt_hash
            - subjective
          additionalProperties: false
        policy:
          type: object
          properties:
            engine:
              type: string
            version:
              type: string
            policy_set_hash:
              type: string
              pattern: ^sha256:[0-9a-f]{64}$
            measurements:
              type: array
              items:
                type: string
          required:
            - engine
            - version
            - policy_set_hash
            - measurements
          additionalProperties: false
        consent:
          type: object
          properties:
            terms_hash:
              type: string
              pattern: ^sha256:[0-9a-f]{64}$
            instruction_use:
              type: boolean
            responsibility_ack:
              type: boolean
            merchant_policy_ack:
              type: string
            recurrence_ack:
              type: boolean
          required:
            - terms_hash
            - instruction_use
            - responsibility_ack
            - merchant_policy_ack
            - recurrence_ack
          additionalProperties: false
        zk:
          type: object
          properties:
            commitment:
              type: string
              pattern: ^0x[0-9a-f]{64}$
          required:
            - commitment
          additionalProperties: false
        risk_data:
          type: object
          properties:
            device_fp:
              type: string
            ip:
              type: string
          required:
            - device_fp
            - ip
          additionalProperties: false
      required:
        - v
        - mid
        - iat
        - nbf
        - exp
        - nonce
        - mode
        - user
        - agent
        - payment
        - checkout
        - intent
        - policy
        - consent
        - zk
        - risk_data
      additionalProperties: false
      description: The compiled `keelson.mandate.1` payload, unsigned; its commitment
        is zero.
    CompileMandate:
      type: object
      properties:
        prompt:
          type: string
          minLength: 1
          description: The shopping request in natural language, at most 2000 UTF-16 code
            units.
          example: Running shoes, size 10, under $100, free returns, by Friday
        credentialId:
          type: string
          minLength: 1
          description: The passkey that will sign the mandate; defaults to the most recent
            one.
        mode:
          type: string
          enum:
            - immediate
            - autonomous
          default: autonomous
          description: Whether the user is present at checkout (`immediate`) or not
            (`autonomous`).
      required:
        - prompt
    Countersigned:
      type: object
      properties:
        purchaseId:
          type: string
        mode:
          type: string
          enum:
            - 2of2
            - degraded
          description: "`degraded` when leg B was unreachable and only leg A signed."
        decision:
          type: string
          enum:
            - allow
            - deny
        countersign:
          type: object
          additionalProperties:
            type: string
          description: The EIP-712 `Countersign` message, as decimal strings.
        digest:
          type: string
          pattern: ^0x[0-9a-f]{64}$
        signatures:
          type: object
          properties:
            tdx:
              type: string
              pattern: ^0x[0-9a-f]{130}$
            nitro:
              type:
                - string
                - "null"
              pattern: ^0x[0-9a-f]{130}$
          required:
            - tdx
            - nitro
        signers:
          type: object
          properties:
            tdx:
              type: string
            nitro:
              type:
                - string
                - "null"
          required:
            - tdx
            - nitro
        trace:
          description: The `keelson.eval/1` trace both legs signed over.
      required:
        - purchaseId
        - mode
        - decision
        - countersign
        - digest
        - signatures
        - signers
    CountersignRequest:
      type: object
      properties:
        authorizationId:
          type: string
          minLength: 1
          maxLength: 64
          description: The PayPal authorization that holds the mandate's funds; leg A
            reads it.
        closedMandate:
          type: string
          minLength: 1
          maxLength: 131072
          description: The open mandate closed by the agent's key binding over the request
            and cart.
        cart:
          $ref: "#/components/schemas/Cart"
        unit:
          type: object
          additionalProperties: {}
          description: The PayPal purchase unit the cart is checked against.
        evidence:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
              maxLength: 256
            maxItems: 8
          default: {}
        evidenceRoot:
          type: string
          pattern: ^0x[0-9a-f]{64}$
          description: The root of the evidence stored with `POST /v1/evidence` for this
            mandate.
      required:
        - authorizationId
        - closedMandate
        - cart
        - unit
        - evidenceRoot
    Cart:
      type: object
      properties:
        merchant:
          type: string
          minLength: 1
          maxLength: 256
        currency:
          type: string
          minLength: 3
          maxLength: 3
        lines:
          type: array
          items:
            type: object
            properties:
              sku:
                type: string
                maxLength: 256
              size:
                type:
                  - string
                  - "null"
                maxLength: 256
              color:
                type:
                  - string
                  - "null"
                maxLength: 256
              category:
                type: string
                maxLength: 256
              qty:
                type: integer
                exclusiveMinimum: 0
              unit_minor:
                type: integer
                minimum: 0
            required:
              - sku
              - category
              - qty
              - unit_minor
          minItems: 1
          maxItems: 32
        return_days:
          type: integer
          minimum: 0
        returns_free:
          type: boolean
      required:
        - merchant
        - currency
        - lines
        - return_days
        - returns_free
    EvidenceUpload:
      type: object
      properties:
        mandateId:
          type: string
          minLength: 26
          maxLength: 26
        manifest:
          $ref: "#/components/schemas/EvidenceManifest"
        items:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                maxLength: 64
              mediaType:
                type: string
                maxLength: 128
              salt:
                type: string
                description: 32 random bytes, base64.
              bytes:
                type: string
                description: The item bytes, base64.
            required:
              - type
              - mediaType
              - salt
              - bytes
          minItems: 1
          maxItems: 18
      required:
        - mandateId
        - manifest
        - items
    EvidenceManifest:
      type: object
      properties:
        v:
          type: string
          enum:
            - keelson.manifest/1
        root:
          type: string
          pattern: ^0x[0-9a-f]{64}$
        items:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
              media_type:
                type: string
              leaf:
                type: string
                pattern: ^0x[0-9a-f]{64}$
                description: '`SHA-256(0x00 ‖ "keelson/evidence-item/v1" ‖ salt ‖ type ‖ 0x00 ‖
                  media_type ‖ 0x00 ‖ content_hash)`.'
            required:
              - type
              - media_type
              - leaf
          minItems: 1
          maxItems: 18
      required:
        - v
        - root
        - items
      description: Type, media type and salted leaf of every item, in order; `root` is
        the RFC 6962 tree hash of the leaves and the `evidenceRoot`. Content
        hashes and salts are only given in a disclosure.
    DisclosedEvidence:
      type: object
      properties:
        disclosure:
          $ref: "#/components/schemas/EvidenceDisclosure"
        bytes:
          type: string
      required:
        - disclosure
        - bytes
    EvidenceDisclosure:
      type: object
      properties:
        index:
          type: integer
        type:
          type: string
        media_type:
          type: string
        content_hash:
          type: string
          pattern: ^0x[0-9a-f]{64}$
        salt:
          type: string
          pattern: ^0x[0-9a-f]{64}$
        path:
          type: array
          items:
            type: string
            pattern: ^0x[0-9a-f]{64}$
          description: The RFC 9162 inclusion proof, leaf first.
        size:
          type: integer
      required:
        - index
        - type
        - media_type
        - content_hash
        - salt
        - path
        - size
    TeeLeg:
      type: object
      properties:
        tee:
          type: string
          enum:
            - tdx
            - nitro
        signer:
          type: string
        measurement:
          type: string
        registeredAt:
          type: string
        verifiedAt:
          type: string
          description: When the attestation last verified.
        expiresAt:
          type: string
        attestation:
          type: object
          additionalProperties: {}
          description: "The attestation the signer was admitted from: the platform
            evidence, its binding and the block it was made over."
      required:
        - tee
        - signer
        - measurement
        - registeredAt
        - verifiedAt
        - expiresAt
        - attestation
    Passkeys:
      type: object
      properties:
        passkeys:
          type: array
          items:
            type: object
            properties:
              credentialId:
                type: string
              payment:
                type: boolean
                description: Registered with the SPC `payment` extension, so SPC can use it.
            required:
              - credentialId
              - payment
      required:
        - passkeys
  parameters: {}
paths:
  /health:
    get:
      tags:
        - system
      summary: Liveness probe
      responses:
        "200":
          description: The service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                required:
                  - status
  /status:
    get:
      tags:
        - system
      summary: Dependency status
      responses:
        "200":
          description: Status of the service and its dependencies; always 200
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                      - degraded
                  dependencies:
                    type: object
                    properties:
                      db:
                        type: string
                        enum:
                          - up
                          - down
                      kv:
                        type: string
                        enum:
                          - up
                          - down
                      teeA:
                        type: string
                        enum:
                          - up
                          - down
                      teeB:
                        type: string
                        enum:
                          - up
                          - down
                      log:
                        type: object
                        properties:
                          status:
                            type: string
                            enum:
                              - up
                              - down
                          origins:
                            type: array
                            items:
                              type: object
                              properties:
                                origin:
                                  type: string
                                size:
                                  type: integer
                                checkpointAgeMs:
                                  type: integer
                              required:
                                - origin
                                - size
                                - checkpointAgeMs
                        required:
                          - status
                          - origins
                    required:
                      - db
                      - kv
                  version:
                    type: string
                required:
                  - status
                  - dependencies
                  - version
  /v1/events:
    get:
      tags:
        - events
      summary: Stream events
      description: Server-sent events for one channel. Send `Last-Event-ID` to replay
        the events after that id before going live.
      parameters:
        - schema:
            type: string
            description: "`public:<name>`, or the caller's own namespace
              `<base64url(kind:subject)>` with an optional `:<suffix>`."
          required: true
          description: "`public:<name>`, or the caller's own namespace
            `<base64url(kind:subject)>` with an optional `:<suffix>`."
          name: channel
          in: query
        - schema:
            type: string
          required: false
          name: last-event-id
          in: header
      responses:
        "200":
          description: An event stream; each event carries the row id, the channel and a
            JSON payload
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          description: Invalid channel or Last-Event-ID
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Not authenticated
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: The channel belongs to another principal
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Too many concurrent streams for this principal
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/mandates:
    post:
      tags:
        - mandates
      summary: Store a passkey-signed mandate
      description: Verifies the passkey assertion over `M =
        SHA-256("keelson/mandate-challenge/v1" || 0x00 || H_sd || C_m)` and
        stores the mandate as `SIGNED`.
      parameters:
        - schema:
            type: string
            minLength: 1
            maxLength: 255
          required: true
          name: idempotency-key
          in: header
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMandate"
      responses:
        "201":
          description: The mandate was stored
          headers:
            location:
              schema:
                type: string
              required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedMandate"
        "401":
          description: Not signed in, or the signature is invalid
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: The passkey is not the signer's
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The mandate is already stored
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: The mandate is invalid
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: The TEE could not issue the mandate
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/mandates/{id}:
    get:
      tags:
        - mandates
      summary: Get a mandate
      description: Renders the card of the signed mandate. The user answered for every
        field when signing, so fields that were ambiguous at compile time show
        with the colors the engine enforces, not gray.
      parameters:
        - schema:
            type: string
          required: true
          name: id
          in: path
      responses:
        "200":
          description: The mandate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mandate"
        "401":
          description: Not signed in
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such mandate for this user
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/mandates/compile:
    post:
      tags:
        - mandates
      summary: Compile a mandate from a shopping request
      description: Two models compile the request independently; fields they disagree
        on or the request leaves unstated come back ambiguous, and a third model
        checks the rendered card against the request. Limited to 10 requests a
        minute per user.
      parameters:
        - schema:
            type: string
            minLength: 1
            maxLength: 255
          required: true
          name: idempotency-key
          in: header
        - schema:
            type: string
            maxLength: 128
            description: The app's opaque device id, recorded as `risk_data.device_fp`.
              Required.
          required: false
          description: The app's opaque device id, recorded as `risk_data.device_fp`.
            Required.
          name: keelson-device
          in: header
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompileMandate"
      responses:
        "200":
          description: The draft mandate and its card
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompiledMandate"
        "401":
          description: Not signed in
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: The passkey is not the user's
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The user has no passkey to sign with
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: The prompt is too long (`prompt-too-long`), the device id is
            missing (`device-required`), the compilations conflict
            (`compile-conflict`), the request leaves out a value a mandate needs
            (`compile-needs-input`) or cannot become a mandate
            (`compile-unresolved`); `fields` names what to ask the user
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Too many compilations
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "502":
          description: The models failed to compile the request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: Inputs a mandate needs are not available yet
            (`compile-unavailable`; `missing` names them), or the rate limit
            store is unreachable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/countersign:
    post:
      tags:
        - tee
      summary: Countersign a cart
      description: Sends the cart to the TEE legs in order and returns the
        countersignatures only when both agree. A DENY is countersigned too.
      parameters:
        - schema:
            type: string
            minLength: 1
            maxLength: 255
          required: true
          name: idempotency-key
          in: header
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CountersignRequest"
      responses:
        "200":
          description: The decision and its countersignatures
          headers:
            Keelson-Countersign-Mode:
              schema:
                type: string
                enum:
                  - 2of2
                  - degraded
                description: "`degraded` when only one TEE signed; the same as `mode` in the
                  body."
              required: true
              description: "`degraded` when only one TEE signed; the same as `mode` in the
                body."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Countersigned"
        "401":
          description: A leg refused the agent's authority
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such mandate
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The mandate is not active, the evidence root is not stored for it
            or already binds another purchase, or the request was already used
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          description: A leg refused the request as too large
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: The request is invalid, or the evidence holds another cart
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Too many countersigns for this mandate
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "502":
          description: The legs disagree, or a signer is not registered
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: A leg needed to sign, or PayPal, is unavailable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/evidence:
    post:
      tags:
        - evidence
      summary: Store sealed evidence
      description: Stores what the agent saw at decision time for an active mandate.
        The manifest is rebuilt from the items and must match, every item has
        its own salt, no public item may still hold an email address or phone
        number, and every `.original` must open with the evidence identity. A
        countersign may only bind a stored root, once.
      parameters:
        - schema:
            type: string
            minLength: 1
            maxLength: 255
          required: true
          name: idempotency-key
          in: header
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvidenceUpload"
      responses:
        "201":
          description: Stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  evidenceRoot:
                    type: string
                    pattern: ^0x[0-9a-f]{64}$
                required:
                  - evidenceRoot
        "404":
          description: No such mandate
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The mandate is not active, holds the most bundles it may, or the
            root is stored for another mandate
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          description: The bundle is larger than 16 MiB
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: The items do not build the manifest, a public item holds PII, or an
            original does not open
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Too many uploads for this mandate
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/evidence/{root}:
    get:
      tags:
        - evidence
      summary: Read an evidence manifest
      description: "The public manifest of a stored bundle: salted leaves only."
      parameters:
        - schema:
            type: string
            pattern: ^0x[0-9a-f]{64}$
          required: true
          name: root
          in: path
      responses:
        "200":
          description: The manifest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceManifest"
        "404":
          description: No such bundle
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/evidence/{root}/items/{index}:
    get:
      tags:
        - evidence
      summary: Disclose one evidence item
      description: One item with its content hash, salt and inclusion proof, for an
        arbiter. Every disclosure is recorded with its `reason`. An `.original`
        item stays age ciphertext unless `decrypt=1` is sent with the
        `evidence:decrypt` scope.
      parameters:
        - schema:
            type: string
            pattern: ^0x[0-9a-f]{64}$
          required: true
          name: root
          in: path
        - schema:
            type:
              - integer
              - "null"
            minimum: 0
            maximum: 17
          required: true
          name: index
          in: path
        - schema:
            type: string
            minLength: 1
            maxLength: 256
            description: Why the item is opened, such as the dispute it serves.
          required: true
          description: Why the item is opened, such as the dispute it serves.
          name: reason
          in: query
        - schema:
            type: string
            enum:
              - "1"
          required: false
          name: decrypt
          in: query
      responses:
        "200":
          description: The item and its disclosure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DisclosedEvidence"
        "403":
          description: Decrypting needs the `evidence:decrypt` scope
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such bundle or item
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: The item is not an `.original`, or it does not open with the
            evidence identity
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: The evidence identity is not configured
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/tee/attestations:
    get:
      tags:
        - tee
      summary: Attested TEE signers
      description: The signers whose countersignatures are accepted, each with the
        attestation it was admitted from, and the measurements the deployment
        publishes. A verifier checks the attestations itself.
      responses:
        "200":
          description: The admitted signers and the published measurements
          content:
            application/json:
              schema:
                type: object
                properties:
                  legs:
                    type: array
                    items:
                      $ref: "#/components/schemas/TeeLeg"
                  measurements:
                    type: object
                    properties:
                      engineBuildId:
                        type: string
                      tdx:
                        type: array
                        items:
                          type: string
                      nitro:
                        type: array
                        items:
                          type: string
                      provenance:
                        type: string
                        description: Where the Sigstore build provenance attested measurements.json is
                          published; `gh attestation verify` checks it.
                    required:
                      - engineBuildId
                      - tdx
                      - nitro
                      - provenance
                required:
                  - legs
                  - measurements
  /v1/passkeys:
    get:
      tags:
        - passkeys
      summary: List the signed-in user's passkeys
      description: The credentials a mandate can be signed with, oldest first.
      responses:
        "200":
          description: The passkeys
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Passkeys"
        "401":
          description: Not signed in
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
webhooks: {}
