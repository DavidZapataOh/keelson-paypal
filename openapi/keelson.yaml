  /v1/countersign:
    post:
      tags:
        - tee
      summary: Countersign a cart
      description: "Sends the cart to the TEE legs in order and returns the
        countersignatures only when both agree. A DENY is countersigned too. A
        cart is bought once per mandate: while a purchase of the same cart is in
        flight, or for ten minutes after it was captured, another request for it
        is answered `409 purchase-exists` with that purchase's id, whatever its
        request id, evidence or `Idempotency-Key`. Retrying after a lost answer
        is therefore safe; to buy the same cart again on purpose, name that
        purchase in `repeatOf`."
      parameters:
        - schema:
            type: string
            minLength: 1
            maxLength: 255
          required: true
          name: idempotency-key
          in: header
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CountersignRequest"
      responses:
        "200":
          description: The decision and its countersignatures
          headers:
            Keelson-Countersign-Mode:
              schema:
                type: string
                enum:
                  - 2of2
                  - degraded
                description: "`degraded` when only one TEE signed; the same as `mode` in the
                  body."
              required: true
              description: "`degraded` when only one TEE signed; the same as `mode` in the
                body."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Countersigned"
        "202":
          description: Countersigned, and a step of the purchase is still pending;
            `Location` is the purchase, which finishes on its own
          headers:
            Location:
              schema:
                type: string
              required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Countersigned"
        "401":
          description: A leg refused the agent's authority
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such mandate of an operator this client linked
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The mandate is not active, the evidence root is not stored for it
            or already binds another purchase, the request was already used, or
            the same cart is already being bought (`purchase-exists`, with its
            `purchaseId`)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          description: A leg refused the request as too large
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: The request is invalid, the authorization is not this purchase's
            hold, the cart is not the one held for this request, the evidence
            holds another cart, or its Channel3 observation is not usable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Too many countersigns for this mandate
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "502":
          description: The legs disagree, or a signer is not registered
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: A leg needed to sign, or PayPal, is unavailable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/live-purchases:
