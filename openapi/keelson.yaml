  /v1/bonds/{agentId}/deposits:
    post:
      tags:
        - bonds
      summary: Deposit PYUSD into an operator's bond, gasless
      description: Relays `depositWithAuthorization` (EIP-3009) or `depositWithPermit`
        (EIP-2612) to the bond vault; Keelson pays the gas. The same
        authorization is sent once, whatever the idempotency key. An
        `operators:write` client sends either; the operator's own session
        (EIP-4361, from the operator console) sends a permit whose `owner` is a
        wallet it signed in with that owns the agent.
      parameters:
        - schema:
            type: string
            pattern: ^(0|[1-9]\d{0,19})$
            description: The ERC-8004 agent id, a decimal integer.
          required: true
          description: The ERC-8004 agent id, a decimal integer.
          name: agentId
          in: path
        - schema:
            type: string
            minLength: 1
            maxLength: 255
          required: true
