              type: string
              format: date-time
            campaigns:
              type: array
              items:
                type: string
              description: The red-team campaigns pooled.
            mu_ppm:
              type: integer
              description: The prior's mean, ASR × escape + amber.
            kappa:
              type: number
              description: The prior's strength, by the method of moments.
