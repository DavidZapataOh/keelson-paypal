openapi: 3.1.0
info:
  title: Keelson API
  version: 0.0.0
components:
  schemas:
    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
      required:
        - type
        - title
        - status
        - instance
      additionalProperties: {}
    CreatedMandate:
      type: object
      properties:
        id:
          type: string
        mandateHash:
          type: string
          pattern: ^0x[0-9a-f]{64}$
        state:
          type: string
          enum:
            - SIGNED
            - ACTIVE
          description: "`ACTIVE` at once when the mandate allows several merchants: each
            cart is then held on its own."
        openMandate:
          type:
            - string
            - "null"
          description: The open mandate (L2) the TEE issued; the agent closes it per
            purchase.
      required:
        - id
        - mandateHash
        - state
        - openMandate
    CreateMandate:
      type: object
      properties:
        payloadSd:
          type: object
          additionalProperties: {}
          description: The SD-JWT payload with its `_sd` digests, as signed.
        disclosures:
          type: array
          items:
            type: string
          maxItems: 1024
          description: Every disclosure of the payload; each digest must resolve.
        commitment:
          type: string
          pattern: ^0x[0-9a-f]{64}$
          description: "`C_m`; must equal the payload's `zk.commitment`."
        salt:
          type: string
          pattern: ^0x[0-9a-f]{32}$
          description: The salt that opens `C_m`; the TEE needs it to issue the mandate.
        assertion:
          $ref: "#/components/schemas/PasskeyAssertion"
      required:
        - payloadSd
        - disclosures
        - commitment
        - assertion
    PasskeyAssertion:
      type: object
      properties:
        authenticatorData:
          type: string
        clientDataJSON:
          type: string
        signature:
          type: string
        credentialId:
          type: string
        userHandle:
          type: string
      required:
        - authenticatorData
        - clientDataJSON
        - signature
        - credentialId
      description: A WebAuthn or Secure Payment Confirmation assertion, base64url fields.
    Mandates:
      type: object
      properties:
        mandates:
          type: array
          items:
            $ref: "#/components/schemas/MandateSummary"
      required:
        - mandates
    MandateSummary:
      type: object
      properties:
        id:
          type: string
        state:
          type: string
          enum:
            - DRAFT
            - COMPILED
            - SIGNED
            - HOLD_PENDING
            - ACTIVE
            - EXHAUSTED
            - EXPIRED
            - REVOKED
        budget:
          $ref: "#/components/schemas/MandateBudget"
        merchantIds:
          type: array
          items:
            type: string
        holdMode:
          type: string
          enum:
            - mandate
            - per_purchase
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - state
        - budget
        - merchantIds
        - holdMode
        - expiresAt
        - createdAt
    MandateBudget:
      type: object
      properties:
        currency:
          type: string
        maxMinor:
          type: string
          pattern: ^\d+$
        remainingMinor:
          type: string
          pattern: ^\d+$
      required:
        - currency
        - maxMinor
        - remainingMinor
      description: The mandate's budget and what is left of it, in minor units.
    Mandate:
      type: object
      properties:
        id:
          type: string
        state:
          type: string
          enum:
            - DRAFT
            - COMPILED
            - SIGNED
            - HOLD_PENDING
            - ACTIVE
            - EXHAUSTED
            - EXPIRED
            - REVOKED
        mandateHash:
          type:
            - string
            - "null"
          pattern: ^0x[0-9a-f]{64}$
        budget:
          $ref: "#/components/schemas/MandateBudget"
        expiresAt:
          type: string
          format: date-time
        hold:
          anyOf:
            - $ref: "#/components/schemas/MandateHold"
            - type: "null"
          description: The PayPal hold of the mandate's budget, once its order exists.
        card:
          anyOf:
            - $ref: "#/components/schemas/MandateCard"
            - type: "null"
          description: The card rendered from the stored payload, before any checkout
            evidence.
        purchases:
          type: array
          items:
            $ref: "#/components/schemas/MandatePurchase"
          description: The mandate's latest 100 purchases, newest first.
        pendingHolds:
          type: array
          items:
            $ref: "#/components/schemas/PendingPurchaseHold"
          description: Purchase holds of a several-store mandate still waiting for the
            buyer's PayPal approval, oldest first. Later changes arrive as
            `mandate.purchase_hold` events.
      required:
        - id
        - state
        - mandateHash
        - budget
        - expiresAt
        - hold
        - card
        - purchases
        - pendingHolds
    MandateHold:
      type: object
      properties:
        mode:
          type: string
          enum:
            - mandate
            - per_purchase
        orderId:
          type: string
        authorizationId:
          type:
            - string
            - "null"
          description: "The authorization captures use: the original, or its
            reauthorization."
        authorizedAt:
          type:
            - string
            - "null"
          format: date-time
        reauthorizedAt:
          type:
            - string
            - "null"
          format: date-time
        remainingMinor:
          type: string
          pattern: ^\d+$
        state:
          type: string
          enum:
            - PENDING
            - AUTHORIZED
            - RELEASED
          description: "`PENDING` until authorized; `RELEASED` once the mandate ended and
            the hold was voided or captured."
      required:
        - mode
        - orderId
        - authorizationId
        - authorizedAt
        - reauthorizedAt
        - remainingMinor
        - state
    MandateCard:
      type: object
      properties:
        rows:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              label:
                type: string
              values:
                type: array
                items:
                  type: string
              color:
                type: string
                enum:
                  - green
                  - amber
                  - gray
              answers:
                type: string
                enum:
                  - Keelson
                  - Agent operator
                  - You
            required:
              - field
              - label
              - values
              - color
              - answers
        warnings:
          type: array
          items:
            type: string
      required:
        - rows
        - warnings
    MandatePurchase:
      type: object
      properties:
        id:
          type: string
          description: The purchase's ULID, which is also its Alibi id.
        merchantId:
          type: string
        amount:
          type: object
          properties:
            currency:
              type: string
            minor:
              type: string
          required:
            - currency
            - minor
        createdAt:
          type: string
          format: date-time
        state:
          type: string
        logIndex:
          type: string
          description: The leaf's index in the Alibi log.
        coverage:
          type: object
          properties:
            chainId:
              type: integer
            txHash:
              type:
                - string
                - "null"
          required:
            - chainId
            - txHash
          description: The `lockCoverage` transaction of the operator's bond.
        capture:
          type: object
          properties:
            id:
              type: string
            invoiceId:
              type: string
            status:
              type:
                - string
                - "null"
          required:
            - id
            - invoiceId
            - status
          description: The PayPal capture of the countersigned amount.
        failure:
          type: object
          properties:
            step:
              type: string
            reason:
              type: string
          required:
            - step
            - reason
          description: The step that failed and why; nothing was captured.
        blocked:
          type: array
          items:
            type: string
          description: For a `DENIED` cart, the mandate fields whose check failed.
        live:
          type: object
          properties:
            store:
              type: string
            transactionId:
              type:
                - string
                - "null"
          required:
            - store
            - transactionId
          description: "A purchase the buyer pays at the store's own checkout: the store's
            origin and the PayPal transaction id once the agent recorded it.
            Never covered nor captured."
        disputes:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              state:
                type: string
                enum:
                  - OPEN
                  - ATTRIBUTED
                  - RESOLVED
            required:
              - id
              - state
          description: PayPal disputes over the purchase; `GET /v1/disputes/{id}` has each.
      required:
        - id
        - merchantId
        - amount
        - createdAt
        - state
        - disputes
    PendingPurchaseHold:
      type: object
      properties:
        requestId:
          type: string
        orderId:
          type: string
          description: The PayPal order the buyer approves.
        merchant:
          type: string
        amountMinor:
          type: string
      required:
        - requestId
        - orderId
        - merchant
        - amountMinor
    PayPalClient:
      type: object
      properties:
        clientId:
          type: string
        environment:
          type: string
          enum:
            - sandbox
            - production
      required:
        - clientId
        - environment
    HoldOrder:
      type: object
      properties:
        orderId:
          type: string
        state:
          type: string
          enum:
            - HOLD_PENDING
      required:
        - orderId
        - state
    AuthorizedHold:
      type: object
      properties:
        state:
          type: string
          enum:
            - ACTIVE
        authorizationId:
          type: string
        expiresAt:
          type: string
          format: date-time
          description: When PayPal expires the authorization, 29 days after it was created.
      required:
        - state
        - authorizationId
        - expiresAt
    PendingHold:
      type: object
      properties:
        state:
          type: string
          enum:
            - HOLD_PENDING
        authorizationId:
          type: string
      required:
        - state
        - authorizationId
      description: PayPal holds the authorization for review; Keelson activates it
        once created.
    AuthorizeHold:
      type: object
      properties:
        orderId:
          type: string
          minLength: 1
          maxLength: 64
      required:
        - orderId
      description: The order the buyer approved.
    PurchaseHoldOrder:
      type: object
      properties:
        requestId:
          type: string
        orderId:
          type: string
      required:
        - requestId
        - orderId
    CreatePurchaseHold:
      type: object
      properties:
        requestId:
          type: string
          pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
          description: The request id the purchase is countersigned under.
        merchant:
          type: string
          minLength: 1
          maxLength: 256
        currency:
          type: string
          minLength: 3
          maxLength: 3
        amountMinor:
          type: string
          pattern: ^[1-9]\d{0,17}$
          description: The cart total, in minor units.
        cartHash:
          type: string
          pattern: ^0x[0-9a-f]{64}$
        closedMandate:
          type: string
          minLength: 1
          maxLength: 32768
          description: The mandate's open mandate closed by the agent key over `requestId`
            and `cartHash`; it proves the caller is the mandate's agent.
      required:
        - requestId
        - merchant
        - currency
        - amountMinor
        - cartHash
        - closedMandate
    AuthorizedPurchaseHold:
      type: object
      properties:
        requestId:
          type: string
        state:
          type: string
          enum:
            - AUTHORIZED
            - PENDING
        authorizationId:
          type: string
      required:
        - requestId
        - state
        - authorizationId
      description: "`PENDING` while PayPal reviews the authorization; asking again
        once it is created authorizes the hold."
    AuthorizePurchaseHold:
      type: object
      properties:
        orderId:
          type: string
          minLength: 1
          maxLength: 64
      required:
        - orderId
      description: The order the buyer approved.
    RevokedMandate:
      type: object
      properties:
        state:
          type: string
          enum:
            - REVOKED
      required:
        - state
    RevokingMandate:
      type: object
      properties:
        state:
          type: string
          enum:
            - REVOKING
      required:
        - state
      description: Purchases already countersigned may still be captured; the hold is
        voided after them.
    CompiledMandate:
      type: object
      properties:
        mandateDraft:
          $ref: "#/components/schemas/MandateDraft"
        card:
          $ref: "#/components/schemas/MandateCard"
        ambiguous:
          type: array
          items:
            type: string
            enum:
              - mode
              - recurrence
              - total
              - currency
              - budget
              - merchant
              - deadline
              - quantity
              - items
              - category
              - variant
              - return_policy
              - agent
              - bond
              - subjective
              - summary
          description: Card fields the compilations disagreed on or the request left
            unstated, shown gray for the user to settle. Pass them to
            `prepareSigning` so the card the user signs shows them gray too.
        check:
          type: object
          properties:
            status:
              type: string
              enum:
                - ok
                - refused
                - failed
                - aborted
                - skipped
            discrepancies:
              type:
                - array
                - "null"
              items:
                type: object
                properties:
                  field:
                    type: string
                  issue:
                    type: string
                required:
                  - field
                  - issue
          required:
            - status
            - discrepancies
          description: The round trip of the card against the request. Only `ok` means it
            was checked.
      required:
        - mandateDraft
        - card
        - ambiguous
        - check
    MandateDraft:
      type: object
      properties:
        v:
          type: string
          enum:
            - keelson.mandate.1
        mid:
          type: string
        iat:
          type: integer
          minimum: 0
        nbf:
          type: integer
          minimum: 0
        exp:
          type: integer
          minimum: 0
        nonce:
          type: string
          pattern: ^[A-Za-z0-9_-]{21}[AQgw]$
        mode:
          type: string
          enum:
            - immediate
            - autonomous
        user:
          type: object
          properties:
            sub:
              type: string
            cred:
              type: object
              properties:
                id:
                  type: string
                  pattern: ^[A-Za-z0-9_-]+$
                rp_id:
                  type: string
                jwk:
                  type: object
                  properties:
                    kty:
                      type: string
                      enum:
                        - EC
                    crv:
                      type: string
                      enum:
                        - P-256
                    x:
                      type: string
                      pattern: ^[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$
                    y:
                      type: string
                      pattern: ^[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$
                  required:
                    - kty
                    - crv
                    - x
                    - y
                  additionalProperties: false
              required:
                - id
                - rp_id
                - jwk
              additionalProperties: false
            app_login_id:
              type: string
          required:
            - sub
            - cred
            - app_login_id
          additionalProperties: false
        agent:
          type: object
          properties:
            operator:
              type: object
              properties:
                agent_registry:
                  type: string
                agent_id:
                  type: string
              required:
                - agent_registry
                - agent_id
              additionalProperties: false
            cnf:
              type: object
              properties:
                jwk:
                  type: object
                  properties:
                    kty:
                      type: string
                      enum:
                        - EC
                    crv:
                      type: string
                      enum:
                        - P-256
                    x:
                      type: string
                      pattern: ^[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$
                    y:
                      type: string
                      pattern: ^[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$
                    kid:
                      type: string
                  required:
                    - kty
                    - crv
                    - x
                    - y
                    - kid
                  additionalProperties: false
              required:
                - jwk
              additionalProperties: false
            bond:
              type: object
              properties:
                vault:
                  type: string
                asset:
                  type: string
                min:
                  type: integer
                  minimum: 0
              required:
                - vault
                - asset
                - min
              additionalProperties: false
          required:
            - operator
            - cnf
            - bond
          additionalProperties: false
        payment:
          type: object
          properties:
            rail:
              type: string
              enum:
                - paypal
            currency:
              type: string
              enum:
                - AUD
                - BRL
                - CAD
                - CNY
                - CZK
                - DKK
                - EUR
                - HKD
                - HUF
                - ILS
                - JPY
                - MYR
                - MXN
                - TWD
                - NZD
                - NOK
                - PHP
                - PLN
                - GBP
                - SGD
                - SEK
                - CHF
                - THB
                - USD
            constraints:
              type: array
              items:
                oneOf:
                  - type: object
                    properties:
                      type:
                        type: string
                        enum:
                          - payment.amount_range
                      max:
                        type: integer
                        minimum: 0
                      currency:
                        type: string
                        enum:
                          - AUD
                          - BRL
                          - CAD
                          - CNY
                          - CZK
                          - DKK
                          - EUR
                          - HKD
                          - HUF
                          - ILS
                          - JPY
                          - MYR
                          - MXN
                          - TWD
                          - NZD
                          - NOK
                          - PHP
                          - PLN
                          - GBP
                          - SGD
                          - SEK
                          - CHF
                          - THB
                          - USD
                    required:
                      - type
                      - max
                      - currency
                    additionalProperties: false
                  - type: object
                    properties:
                      type:
                        type: string
                        enum:
                          - payment.budget
                      max:
                        type: integer
                        minimum: 0
                      currency:
                        type: string
                        enum:
                          - AUD
                          - BRL
                          - CAD
                          - CNY
                          - CZK
                          - DKK
                          - EUR
                          - HKD
                          - HUF
                          - ILS
                          - JPY
                          - MYR
                          - MXN
                          - TWD
                          - NZD
                          - NOK
                          - PHP
                          - PLN
                          - GBP
                          - SGD
                          - SEK
                          - CHF
                          - THB
                          - USD
                    required:
                      - type
                      - max
                      - currency
                    additionalProperties: false
                  - type: object
                    properties:
                      type:
                        type: string
                        enum:
                          - payment.allowed_payees
                      allowed:
                        type: array
                        items:
                          type: object
                          properties:
                            paypal_merchant_id:
                              type: string
                          required:
                            - paypal_merchant_id
                          additionalProperties: false
                        minItems: 1
                    required:
                      - type
                      - allowed
                    additionalProperties: false
                  - type: object
                    properties:
                      type:
                        type: string
                        enum:
                          - payment.execution_date
                      not_after:
                        type: string
                        format: date-time
                    required:
                      - type
                      - not_after
                    additionalProperties: false
          required:
            - rail
            - currency
            - constraints
          additionalProperties: false
        checkout:
          type: object
          properties:
            constraints:
              type: array
              items:
                oneOf:
                  - type: object
                    properties:
                      type:
                        type: string
                        enum:
                          - checkout.allowed_merchants
                      allowed:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            name:
                              type: string
                            website:
                              type: string
                            paypal_merchant_id:
                              type: string
                          required:
                            - id
                            - name
                            - website
                            - paypal_merchant_id
                          additionalProperties: false
                        minItems: 1
                    required:
                      - type
                      - allowed
                    additionalProperties: false
                  - type: object
                    properties:
                      type:
                        type: string
                        enum:
                          - checkout.line_items
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            acceptable_items:
                              type: array
                              items:
                                type: object
                                properties:
                                  id:
                                    type: string
                                  title:
                                    type: string
                                required:
                                  - id
                                additionalProperties: false
                              minItems: 1
                            quantity:
                              type: integer
                              exclusiveMinimum: 0
                          required:
                            - id
                            - acceptable_items
                            - quantity
                          additionalProperties: false
                    required:
                      - type
                      - items
                    additionalProperties: false
                  - type: object
                    properties:
                      type:
                        type: string
                        enum:
                          - keelson.category
                      allow:
                        type: array
                        items:
                          type: string
                          enum:
                            - gpt:1
                            - gpt:166
                            - gpt:8
                            - gpt:537
                            - gpt:111
                            - gpt:141
                            - gpt:222
                            - gpt:412
                            - gpt:436
                            - gpt:632
                            - gpt:469
                            - gpt:536
                            - gpt:5181
                            - gpt:772
                            - gpt:783
                            - gpt:922
                            - gpt:5605
                            - gpt:2092
                            - gpt:988
                            - gpt:1239
                            - gpt:888
                            - gpt:187
                        minItems: 1
                      deny:
                        type: array
                        items:
                          type: string
                          enum:
                            - gpt:1
                            - gpt:166
                            - gpt:8
                            - gpt:537
                            - gpt:111
                            - gpt:141
                            - gpt:222
                            - gpt:412
                            - gpt:436
                            - gpt:632
                            - gpt:469
                            - gpt:536
                            - gpt:5181
                            - gpt:772
                            - gpt:783
                            - gpt:922
                            - gpt:5605
                            - gpt:2092
                            - gpt:988
                            - gpt:1239
                            - gpt:888
                            - gpt:187
                    required:
                      - type
                      - allow
                      - deny
                    additionalProperties: false
                  - type: object
                    properties:
                      type:
                        type: string
                        enum:
                          - keelson.attributes
                      must:
                        type: object
                        additionalProperties:
                          type: string
                    required:
                      - type
                      - must
                    additionalProperties: false
                  - type: object
                    properties:
                      type:
                        type: string
                        enum:
                          - keelson.returns
                      min_days:
                        type: integer
                        minimum: 0
                      free:
                        type: boolean
                    required:
                      - type
                      - min_days
                      - free
                    additionalProperties: false
          required:
            - constraints
          additionalProperties: false
        intent:
          type: object
          properties:
            prompt_summary:
              type: string
            prompt_hash:
              type: string
              pattern: ^sha256:[0-9a-f]{64}$
            subjective:
              type: array
              items:
                type: string
          required:
            - prompt_summary
            - prompt_hash
            - subjective
          additionalProperties: false
        policy:
          type: object
          properties:
            engine:
              type: string
            version:
              type: string
            policy_set_hash:
              type: string
              pattern: ^sha256:[0-9a-f]{64}$
            measurements:
              type: array
              items:
                type: string
          required:
            - engine
            - version
            - policy_set_hash
            - measurements
          additionalProperties: false
        consent:
          type: object
          properties:
            terms_hash:
              type: string
              pattern: ^sha256:[0-9a-f]{64}$
            instruction_use:
              type: boolean
            responsibility_ack:
              type: boolean
            merchant_policy_ack:
              type: string
            recurrence_ack:
              type: boolean
          required:
            - terms_hash
            - instruction_use
            - responsibility_ack
            - merchant_policy_ack
            - recurrence_ack
          additionalProperties: false
        zk:
          type: object
          properties:
            commitment:
