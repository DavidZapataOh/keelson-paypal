            type: object
            properties:
              field:
                type: string
              color:
                type: string
              pass:
                type: boolean
            required:
              - field
              - color
              - pass
          description: Each mandate field the engine checked.
        alibi_fragment:
          type:
            - string
            - "null"
          description: "`<leaf hash>.<anchored size>.<chain id>`: the fragment of the
            Alibi's verifier link,
            `https://verify.keelson.finance/a/<id>#<fragment>`."
      required:
        - id
        - state
        - mode
        - amount
        - merchant_id
        - created_at
        - log_index
        - capture_id
        - coverage_tx
        - failure
        - checks
        - alibi_fragment
  parameters: {}
paths:
  /health:
    get:
      operationId: getHealth
      tags:
        - system
      summary: Liveness probe
      responses:
        "200":
          description: The service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                required:
                  - status
  /v1/engine/capabilities:
    get:
      operationId: getEngineCapabilities
      tags:
        - system
      summary: What both TEEs do
      description: "The features both TEE legs run, which a client may use: `decoys`,
        a mandate padded with decoy digests (RFC 9901 section 4.2.5)."
      responses:
        "200":
          description: The features both legs report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capabilities"
  /status/v1/mandates/2026-1:
    get:
      operationId: getMandateStatusList
      tags:
        - mandates
      summary: The mandate status list
      description: "The Token Status List (draft-ietf-oauth-status-list-21) of every
        mandate that carries a `status` claim: one bit per mandate, set once it
        is revoked or its user stopped their agents. Signed by the TEE that
        issues mandates, with the issuer key the open mandates name; it never
        clears a bit. Both TEEs check it on every countersign."
      responses:
        "200":
          description: The current status list token
          content:
            application/statuslist+jwt:
              schema:
                type: string
        "404":
          description: No list is published yet
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /status:
    get:
      operationId: getStatus
      tags:
        - system
      summary: Dependency status
      responses:
        "200":
          description: Status of the service and its dependencies; always 200
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                      - degraded
                  dependencies:
                    type: object
                    properties:
                      db:
                        type: string
                        enum:
                          - up
                          - down
                      kv:
                        type: string
                        enum:
                          - up
                          - down
                      teeA:
                        type: string
                        enum:
                          - up
                          - down
                      teeB:
                        type: string
                        enum:
                          - up
                          - down
                      relayer:
                        type: object
                        properties:
                          status:
                            type: string
                            enum:
                              - up
                              - down
                              - degraded
                          chains:
                            type: array
                            items:
                              type: object
                              properties:
                                chainId:
                                  type: integer
                                status:
                                  type: string
                                  enum:
                                    - up
                                    - down
                                    - degraded
                                address:
                                  type: string
                                balanceWei:
                                  type: string
                                nextNonce:
                                  type: string
                                pending:
                                  type: integer
                                baseFeeWei:
                                  type: string
                              required:
                                - chainId
                                - status
                                - address
                                - pending
                        required:
                          - status
                          - chains
                      log:
                        type: object
                        properties:
                          status:
                            type: string
                            enum:
                              - up
                              - down
                          origins:
                            type: array
                            items:
                              type: object
                              properties:
                                origin:
                                  type: string
                                size:
                                  type: integer
                                checkpointAgeMs:
                                  type: integer
                              required:
                                - origin
                                - size
                                - checkpointAgeMs
                        required:
                          - status
                          - origins
                      paypal:
                        type: object
                        properties:
                          status:
                            type: string
                            enum:
                              - up
                              - down
                          environment:
                            type: string
                            enum:
                              - sandbox
                              - production
                        required:
                          - status
                          - environment
                      webhooks:
                        type: object
                        properties:
                          status:
                            type: string
                            enum:
                              - up
                              - down
                          lastWebhookAgeMs:
                            type: integer
                          lastPollAgeMs:
                            type: integer
                        required:
                          - status
                      chainEvents:
                        type: object
                        properties:
                          status:
                            type: string
                            enum:
                              - up
                              - down
                          finalizedBlock:
                            type: string
                          reconciledAgeMs:
                            type: integer
                        required:
                          - status
                      anchor:
                        type: object
                        properties:
                          status:
                            type: string
                            enum:
                              - up
                              - down
                          environment:
                            type: string
                            enum:
                              - arbitrum-sepolia
                          size:
                            type: string
                          anchoredAgeMs:
                            type: integer
                        required:
                          - status
                          - environment
                    required:
                      - db
                      - kv
                  rpc:
                    type: object
                    properties:
                      calls:
                        type: array
                        items:
                          type: object
                          properties:
                            provider:
                              type: string
                            method:
                              type: string
                            calls:
                              type: integer
                          required:
                            - provider
                            - method
                            - calls
                    required:
                      - calls
                  version:
                    type: string
                required:
                  - status
                  - dependencies
                  - rpc
                  - version
  /v1/events:
    get:
      operationId: streamEvents
      tags:
        - events
      summary: Stream events
      description: Server-sent events for one channel. Send `Last-Event-ID` to replay
        the events after that id before going live.
      security:
        - session: []
        - oauth2: []
      parameters:
        - schema:
            type: string
            description: "`public:<name>`, or the caller's own namespace
              `<base64url(kind:subject)>` with an optional `:<suffix>`."
          required: true
          description: "`public:<name>`, or the caller's own namespace
            `<base64url(kind:subject)>` with an optional `:<suffix>`."
          name: channel
          in: query
        - schema:
            type: string
          required: false
          name: last-event-id
          in: header
      responses:
        "200":
          description: An event stream; each event carries the row id, the channel and a
            JSON payload
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          description: Invalid channel or Last-Event-ID
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Not authenticated
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: The channel belongs to another principal
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Too many concurrent streams for this principal
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/mandates:
    post:
      operationId: createMandate
      tags:
        - mandates
      summary: Store a passkey-signed mandate
      description: Verifies the passkey assertion over `M =
        SHA-256("keelson/mandate-challenge/v1" || 0x00 || H_sd || C_m)` and
        stores the mandate as `SIGNED`, or `ACTIVE` when it allows several
        merchants.
      security:
        - session: []
      parameters:
        - schema:
            type: string
            minLength: 1
            maxLength: 255
          required: true
          name: idempotency-key
          in: header
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMandate"
      responses:
        "201":
          description: The mandate was stored
          headers:
            location:
              schema:
                type: string
              required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedMandate"
        "401":
          description: Not signed in, or the signature is invalid
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: The passkey is not the signer's
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The mandate is already stored
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: "The mandate is invalid (`invalid-mandate`), or it binds an agent
            key, a bond, an engine build, a policy set or terms other than the
            ones `POST /v1/mandates/compile` fills: the named operator's
            registered `cnf` key, its bond vault with the 50 PYUSD minimum, the
            engine version and TEE measurements of the build the legs run (or of
            another build admitted during a rotation), the current policy set
            hash and the current terms (`mandate-binding-mismatch`; `fields`
            names `agent.cnf`, `agent.bond`, `policy.engine`, `policy.version`,
            `policy.measurements`, `policy.policy_set_hash` or `consent`)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Too many approvals by user code
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: The TEE could not issue the mandate
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    get:
      operationId: listMandates
      tags:
        - mandates
      summary: List your mandates
      description: The signed-in user's latest 50 signed mandates, newest first.
      security:
        - session: []
      responses:
        "200":
          description: The mandates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mandates"
        "401":
          description: Not signed in
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/mandates/{id}:
    get:
      operationId: getMandate
      tags:
        - mandates
      summary: Get a mandate
      description: Renders the card of the signed mandate. The user answered for every
        field when signing, so fields that were ambiguous at compile time show
        with the colors the engine enforces, not gray.
      security:
        - session: []
      parameters:
        - schema:
            type: string
          required: true
          name: id
          in: path
      responses:
        "200":
          description: The mandate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mandate"
        "401":
          description: Not signed in
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such mandate for this user
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/paypal/client:
    get:
      operationId: getPayPalClient
      tags:
        - paypal
      summary: Get the PayPal client ID
      description: The client ID and environment the JavaScript SDK loads with. The
        client ID is public by design.
      responses:
        "200":
          description: The PayPal client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayPalClient"
        "503":
          description: PayPal is not configured
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/mandates/{id}/hold:
    post:
      operationId: holdMandate
      tags:
        - mandates
      summary: Hold a mandate's budget
      description: Creates the PayPal `AUTHORIZE` order for the budget of a signed
        mandate, bound to the signed mandate hash by its `custom_id`, and moves
        the mandate to `HOLD_PENDING`. With the user's saved PayPal, PayPal
        authorizes the order as it creates it (`approved`); otherwise the buyer
        approves it in PayPal. While the mandate waits for approval the same
        order is returned; an order PayPal no longer offers is replaced.
      security:
        - session: []
      parameters:
        - schema:
            type: string
          required: true
          name: id
          in: path
        - schema:
            type: string
            minLength: 1
            maxLength: 255
          required: true
          name: idempotency-key
          in: header
      responses:
        "200":
          description: The order the buyer approves
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HoldOrder"
        "401":
          description: Not signed in
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such mandate for this user
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The mandate is not signed, or it holds each purchase separately
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Keelson cannot capture for the mandate's merchant, PayPal refused,
            or the hold would pass the hosted operator's total cap
            (`hosted-cap`)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: PayPal is unavailable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/mandates/{id}/hold/authorize:
    post:
      operationId: authorizeMandateHold
      tags:
        - mandates
      summary: Authorize an approved hold
      description: Authorizes the order stored for the mandate, checks the
        authorization against the signed mandate (amount, currency, `custom_id`,
        payee) and moves the mandate to `ACTIVE`. An authorization that does not
        match is voided.
      security:
        - session: []
      parameters:
        - schema:
            type: string
          required: true
          name: id
          in: path
        - schema:
            type: string
            minLength: 1
            maxLength: 255
          required: true
          name: idempotency-key
          in: header
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthorizeHold"
      responses:
        "200":
          description: The mandate is active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizedHold"
        "202":
          description: PayPal holds the authorization as pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingHold"
        "401":
          description: Not signed in
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such mandate for this user
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The mandate is not waiting for its hold, or the order is not its
            order
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: The authorization does not match the mandate, or PayPal refused
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: PayPal is unavailable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/paypal/wallet/setup-token:
    post:
      operationId: createPayPalSetupToken
      tags:
        - paypal
      summary: Start saving PayPal
      description: Creates the PayPal Vault setup token the user approves in PayPal,
        for one merchant-initiated token billed on the terms of the mandates
        they sign.
      security:
        - session: []
      parameters:
        - schema:
            type: string
            minLength: 1
            maxLength: 255
          required: true
          name: idempotency-key
          in: header
      responses:
        "201":
          description: The setup token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayPalSetupToken"
        "401":
          description: Not signed in
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: PayPal refused
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: PayPal is unavailable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/paypal/wallet:
    post:
      operationId: savePayPalWallet
      tags:
        - paypal
      summary: Save PayPal
      description: Exchanges the setup token the user approved for a payment token and
        saves it as the user's PayPal for holds, in place of any saved before.
      security:
        - session: []
      parameters:
        - schema:
            type: string
            minLength: 1
            maxLength: 255
          required: true
          name: idempotency-key
          in: header
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayPalSetupToken"
      responses:
        "201":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayPalWallet"
        "401":
          description: Not signed in
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such setup token of this user
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: PayPal refused
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: PayPal is unavailable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    get:
      operationId: getPayPalWallet
      tags:
        - paypal
      summary: The saved PayPal
      security:
        - session: []
      responses:
        "200":
          description: The saved PayPal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayPalWallet"
        "401":
          description: Not signed in
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No saved PayPal
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: PayPal is unavailable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    delete:
      operationId: removePayPalWallet
      tags:
        - paypal
      summary: Remove the saved PayPal
      description: Deletes the payment token at PayPal and forgets it. Holds already
        authorized stay until they are captured, voided or expire; new holds
        need PayPal's approval again.
      security:
        - session: []
      responses:
        "204":
          description: Removed
        "401":
          description: Not signed in
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No saved PayPal
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: PayPal refused
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: PayPal is unavailable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/mandates/{id}/holds:
    post:
      operationId: holdCart
      tags:
        - mandates
      summary: Hold one cart of a multi-merchant mandate
      description: For a mandate that allows several merchants, creates the PayPal
        `AUTHORIZE` order for exactly one cart, keyed by the request id it will
        be countersigned under. The user approves it like a mandate hold.
      security:
        - oauth2:
            - countersign:write
      parameters:
        - schema:
            type: string
          required: true
          name: id
          in: path
        - schema:
            type: string
            minLength: 1
            maxLength: 255
          required: true
          name: idempotency-key
          in: header
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePurchaseHold"
      responses:
        "201":
          description: The order the buyer approves
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseHoldOrder"
        "401":
          description: No valid access token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: The caller is not the mandate's agent
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such mandate
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The mandate holds its whole budget, is not active, or the request
            id is already used
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: The cart is outside the mandate, its open cart holds with this one
            exceed the remaining budget, Keelson cannot capture for it, PayPal
            refused, or the hold would pass the hosted operator's total cap
            (`hosted-cap`)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: PayPal is unavailable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/mandates/{id}/holds/{requestId}/authorize:
    post:
      operationId: authorizeCartHold
      tags:
        - mandates
      summary: Authorize an approved cart hold
      description: Authorizes the order stored for the request and checks the
        authorization against it (amount, currency, `custom_id`, payee). An
        authorization that does not match is voided.
      security:
        - session: []
      parameters:
        - schema:
            type: string
          required: true
          name: id
          in: path
        - schema:
            type: string
          required: true
          name: requestId
          in: path
        - schema:
            type: string
            minLength: 1
            maxLength: 255
          required: true
          name: idempotency-key
          in: header
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthorizePurchaseHold"
      responses:
        "200":
          description: The cart is held
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizedPurchaseHold"
        "202":
          description: PayPal holds the authorization as pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizedPurchaseHold"
        "401":
          description: Not signed in
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such hold for this user
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The mandate is not active, the hold is not pending, or the order is
            not its order
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: The authorization does not match the hold, or PayPal refused
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: PayPal is unavailable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/mandates/{id}/revoke:
    post:
      operationId: revokeMandate
      tags:
        - mandates
      summary: Revoke a mandate
      description: Stops new countersigns at once, voids the PayPal hold and moves the
        mandate to `REVOKED`. While a countersigned purchase may still be
        captured, the void waits for it and the revocation completes in the
        background.
      security:
        - session: []
      parameters:
        - schema:
            type: string
          required: true
          name: id
          in: path
        - schema:
            type: string
            minLength: 1
            maxLength: 255
          required: true
          name: idempotency-key
          in: header
      responses:
        "200":
          description: The mandate is revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevokedMandate"
        "202":
          description: The mandate is being revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevokingMandate"
        "401":
          description: Not signed in
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such mandate for this user
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The mandate has already ended
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: PayPal refused the void
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: PayPal is unavailable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/connections:
    post:
      operationId: requestMandate
      tags:
        - connections
      summary: Ask the user for a mandate
      description: >-
        The agent's operator asks its user for a mandate with these limits, as
        an RFC 8628 device authorization: the user opens
        `verification_uri_complete`, compares `user_code` and approves on
        Keelson's page with a passkey, lowering any limit. Only a client that
        linked an operator may ask, and the mandate names that operator. The
        code expires in 15 minutes and is single use.


        An app acting for a user with a token they granted it
        (`mandates:request`) asks that user only: the request is theirs from the
        start, so it carries no number to match. The mandate names the app's own
        operator, or Keelson's hosted operator when the app has none. Through
        the hosted operator, every app is capped (`hosted-cap`): one user's open
        mandates and purchases of the last 180 days with apps whose redirect
        URIs are not a known host's may not pass `HOSTED_CAP_PER_USER_MINOR`,
        and with all such apps `HOSTED_CAP_KNOWN_PER_USER_MINOR`; every user's
        funded exposure may not pass `HOSTED_CAP_TOTAL_MINOR`.
      security:
        - oauth2:
            - countersign:write
        - oauth2:
            - mandates:request
      parameters:
        - schema:
            type: string
            minLength: 1
            maxLength: 255
          required: true
          name: idempotency-key
          in: header
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectionRequest"
      responses:
        "201":
          description: Show the code and the link to the user, then poll
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceAuthorization"
        "401":
          description: No valid access token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: The client linked no operator, and no hosted operator serves it
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The client linked several operators
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: The request is invalid, or over the hosted operator's cap
            (`hosted-cap`)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/connections/token:
    post:
      operationId: pollConnection
      tags:
        - connections
      summary: Poll for the user's answer
      description: "RFC 8628 §3.4 polling with
        `grant_type=urn:ietf:params:oauth:grant-type:device_code`. Until the
        user decides: `authorization_pending`, or `slow_down` (and 5 more
        seconds to wait) when polled faster than `interval`. Then
        `access_denied`, `expired_token`, or the approved mandate's id, once:
        the device code is spent by the answer that carries it."
      security:
        - oauth2:
            - countersign:write
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                grant_type:
                  type: string
                device_code:
                  type: string
                  maxLength: 256
              required:
                - grant_type
                - device_code
      responses:
        "200":
          description: "Approved: the mandate the user signed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionApproved"
        "400":
          description: Not approved, or not yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionTokenError"
        "401":
          description: No valid access token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/connections/{code}:
    get:
      operationId: getConnectionByCode
      tags:
        - connections
      summary: Read a request by its user code
      description: What the agent asks for, for the approval page. Limited to 20 reads
        a minute per user, so codes cannot be guessed.
      security:
        - session: []
      parameters:
        - schema:
            type: string
            minLength: 8
            maxLength: 16
          required: true
          name: code
          in: path
      responses:
        "200":
          description: The request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connection"
        "401":
          description: Not signed in
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such request for this user
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Too many reads
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/connections/{code}/deny:
    post:
      operationId: denyConnection
      tags:
        - connections
      summary: Deny a request
      security:
        - session: []
      parameters:
        - schema:
            type: string
            minLength: 8
            maxLength: 16
          required: true
          name: code
          in: path
        - schema:
            type: string
            minLength: 1
            maxLength: 255
          required: true
          name: idempotency-key
          in: header
      responses:
        "200":
          description: Denied; the agent's next poll says `access_denied`
          content:
            application/json:
              schema:
                type: object
                properties:
                  state:
                    type: string
                    enum:
                      - DENIED
                required:
                  - state
        "401":
          description: Not signed in
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No open request with this code
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/connections/{code}/match:
    post:
      operationId: matchConnection
      tags:
        - connections
      summary: Pick the agent's number
      description: The user picks the number the agent shows beside its link out of
        the three the request offers. The right one opens the request; a wrong
        one denies it, since the link may not be the user's agent's.
      security:
        - session: []
      parameters:
        - schema:
            type: string
            minLength: 8
            maxLength: 16
          required: true
          name: code
          in: path
        - schema:
            type: string
            minLength: 1
            maxLength: 255
          required: true
          name: idempotency-key
          in: header
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                number:
                  type: integer
                  minimum: 10
                  maximum: 99
              required:
                - number
      responses:
        "200":
          description: Matched
          content:
            application/json:
              schema:
                type: object
                properties:
                  matched:
                    type: boolean
                    enum:
                      - true
                required:
                  - matched
        "401":
          description: Not signed in
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No open request with this code
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Not the agent's number (`number-mismatch`); the request is denied
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/connections/requests/{id}:
    get:
      operationId: getConnectionRequest
      tags:
        - connections
      summary: Read your request's state
      description: "The state of a request this client made, as often as needed:
        reading it changes nothing and does not spend the device code. Wait
        `interval` seconds between reads. An app acting for a user
        (`mandates:request`) reads only that user's requests."
      security:
        - oauth2:
            - countersign:write
        - oauth2:
            - mandates:request
      parameters:
        - schema:
            type: string
            pattern: ^[0-7][0-9A-HJKMNP-TV-Z]{25}$
          required: true
          name: id
          in: path
      responses:
        "200":
          description: The request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionRequestState"
        "401":
          description: No valid access token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such request of this client
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/connections/{code}/draft:
    post:
      operationId: draftConnectionMandate
      tags:
        - connections
      summary: Draft the mandate that approves a request
      description: The unsigned mandate for the limits the user chose, which may only
        be lower than or equal to what the agent asked. It names the asking
        agent's operator. Sign it and store it with `POST /v1/mandates`, passing
        `connection`, to approve.
      security:
        - session: []
      parameters:
        - schema:
            type: string
            minLength: 8
            maxLength: 16
          required: true
          name: code
          in: path
        - schema:
            type: string
            minLength: 1
            maxLength: 255
          required: true
          name: idempotency-key
          in: header
        - schema:
            type: string
          required: false
          name: keelson-device
          in: header
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectionDraft"
      responses:
        "200":
          description: The draft mandate and its card
          content:
            application/json:
              schema:
                type: object
                properties:
                  mandateDraft:
                    type: object
                    additionalProperties: {}
                  card:
                    $ref: "#/components/schemas/MandateCard"
                  ambiguous:
                    type: array
                    items:
                      type: string
                  check:
                    type: object
                    properties:
                      status:
                        type: string
                        enum:
                          - skipped
                      discrepancies:
                        type: "null"
                    required:
                      - status
                      - discrepancies
                required:
                  - mandateDraft
                  - card
                  - ambiguous
                  - check
        "401":
          description: Not signed in
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: The passkey is not the user's
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No open request with this code
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The user has no passkey
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: A limit is above what the agent asked (`limits-raised`; `fields`
            names it)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: The operator's agent key or bond is not set
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/mandates/{id}/changes:
    post:
      operationId: requestMandateChange
      tags:
        - mandates
      summary: Ask the user to change a mandate
      description: The agent asks its user for different limits, with a one-line note
        the user reads verbatim. The user may lower what is asked and approves
        with a passkey; the new mandate then replaces this one, whose hold is
        released. Nothing changes until the user signs. Poll `GET
        /v1/connections/requests/{id}` for the answer. An app acting for a user
        (`mandates:request`) asks only about a mandate that user approved for
        it.
      security:
        - oauth2:
            - countersign:write
        - oauth2:
            - mandates:request
      parameters:
        - schema:
            type: string
            pattern: ^[0-7][0-9A-HJKMNP-TV-Z]{25}$
          required: true
          name: id
          in: path
        - schema:
            type: string
            minLength: 1
            maxLength: 255
          required: true
          name: idempotency-key
          in: header
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MandateChangeRequest"
      responses:
        "201":
          description: The user was asked; show the link and poll
          content:
            application/json:
              schema:
                type: object
                properties:
                  request_id:
                    type: string
                  user_code:
                    type: string
                  verification_uri_complete:
                    type: string
                  expires_in:
                    type: integer
                  interval:
                    type: integer
                required:
                  - request_id
                  - user_code
                  - verification_uri_complete
                  - expires_in
                  - interval
        "401":
          description: No valid access token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such mandate of an operator this client linked, or that the user
            approved for this app
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The mandate has ended, or a change of it is already waiting for the
            user (`change-pending`, with its `requestId`)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: The limits are invalid, or over the hosted operator's cap
            (`hosted-cap`)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/mandates/{id}/check:
    post:
      operationId: checkCart
      tags:
        - mandates
      summary: Check a cart against a mandate
      description: "A dry run: what a countersign of this cart would find, field by
        field, from the same policy set the TEE legs run, with nothing signed,
        reserved or logged. The countersign stays the only decision. An app
        acting for a user (`purchases:write`) checks only under a mandate that
        user approved for it."
      security:
        - oauth2:
            - countersign:write
        - oauth2:
            - purchases:write
      parameters:
        - schema:
            type: string
            pattern: ^[0-7][0-9A-HJKMNP-TV-Z]{25}$
          required: true
          name: id
          in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cart:
                  $ref: "#/components/schemas/Cart"
              required:
                - cart
      responses:
        "200":
          description: The check
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartCheck"
        "401":
          description: No valid access token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such mandate of an operator this client linked
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /access/v1/evaluation:
    post:
      operationId: accessEvaluation
      tags:
        - mandates
      summary: Preview a cart against a mandate (OpenID AuthZEN)
      description: "The Access Evaluation API of OpenID AuthZEN 1.0: would this
        agent's purchase of this cart pass this mandate now? It answers from the
        same policy set the TEE legs run, as `POST /v1/mandates/{id}/check`
        does, and is never binding."
      security:
        - oauth2:
            - countersign:write
        - oauth2:
            - purchases:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessEvaluationRequest"
      responses:
        "200":
          description: The decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessEvaluationResponse"
        "401":
          description: No valid access token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /access/v1/evaluations:
    post:
      operationId: accessEvaluations
      tags:
        - mandates
      summary: Preview several carts (OpenID AuthZEN boxcar)
      description: Up to 20 evaluations in one request, in order. Each takes the
        request's `subject`, `action` and `resource` for any it omits.
      security:
        - oauth2:
            - countersign:write
        - oauth2:
            - purchases:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                subject:
                  type: object
                  properties:
                    type:
                      type: string
                      enum:
                        - agent
                    id:
                      type: string
                      minLength: 1
                  required:
                    - type
                    - id
                action:
                  type: object
                  properties:
                    name:
                      type: string
                      enum:
                        - purchase
                  required:
                    - name
                resource:
                  type: object
                  properties:
                    type:
                      type: string
                      enum:
                        - mandate
                    id:
                      type: string
                      pattern: ^[0-7][0-9A-HJKMNP-TV-Z]{25}$
                    properties:
                      type: object
                      properties:
                        cart:
                          $ref: "#/components/schemas/Cart"
                      required:
                        - cart
                  required:
                    - type
                    - id
                    - properties
                evaluations:
                  type: array
                  items:
                    type: object
                    properties:
                      subject:
                        type: object
                        properties:
                          type:
                            type: string
                            enum:
                              - agent
                          id:
                            type: string
                            minLength: 1
                        required:
                          - type
                          - id
                      action:
                        type: object
                        properties:
                          name:
                            type: string
                            enum:
                              - purchase
                        required:
                          - name
                      resource:
                        type: object
                        properties:
                          type:
                            type: string
                            enum:
                              - mandate
                          id:
                            type: string
                            pattern: ^[0-7][0-9A-HJKMNP-TV-Z]{25}$
                          properties:
                            type: object
                            properties:
                              cart:
                                $ref: "#/components/schemas/Cart"
                            required:
                              - cart
                        required:
                          - type
                          - id
                          - properties
                  minItems: 1
                  maxItems: 20
              required:
                - evaluations
      responses:
        "200":
          description: The decisions, in order
          content:
            application/json:
              schema:
                type: object
                properties:
                  evaluations:
                    type: array
                    items:
                      $ref: "#/components/schemas/AccessEvaluationResponse"
                required:
                  - evaluations
        "401":
          description: No valid access token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/embed/origins:
    put:
      operationId: setEmbedOrigins
      tags:
        - embed
      summary: Set the origins that may frame approvals
      description: Replaces the https origins this client's agent platform may embed
        Keelson's approval in. Each becomes the page's `frame-ancestors` for
        that client's requests, and the only origin the frame talks to with
        `postMessage`.
      security:
        - oauth2:
            - countersign:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmbedOrigins"
      responses:
        "200":
          description: The origins now allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmbedOrigins"
        "401":
          description: No valid access token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: An origin is not a bare https origin
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/connections/embed:
    post:
      operationId: embedConnection
      tags:
        - embed
      summary: Embed the approval of a request
      description: For a pending request this client made, a URL to frame in the agent
        platform's page at `origin`, one of the client's embed origins. The
        URL's fragment carries a single-use token the frame redeems within five
        minutes; mint another to frame it again. The user approves in a Keelson
        window the frame opens, with a passkey; poll `POST
        /v1/connections/token` as usual for the answer.
      security:
        - oauth2:
            - countersign:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                device_code:
                  type: string
                  maxLength: 256
                origin:
                  type: string
                  maxLength: 255
              required:
                - device_code
                - origin
      responses:
        "201":
          description: Frame `url`; it opens to the request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmbedUrl"
        "401":
          description: No valid access token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: The origin is not one of this client's
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No pending request with this device code
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/embed/sessions:
    post:
      operationId: openEmbedSession
      tags:
        - embed
      summary: Open the embedded approval
      description: The frame spends its token, once, for a session it keeps in memory
        and sends in `Keelson-Embed`. No cookie is read or set.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  maxLength: 64
              required:
                - token
      responses:
        "201":
          description: The session and the request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmbedSession"
        "401":
          description: The token is unknown, spent or expired
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/embed/request:
    get:
      operationId: getEmbedRequest
      tags:
        - embed
      summary: Read the embedded request
      parameters:
        - schema:
            type: string
            maxLength: 64
          required: false
          name: keelson-embed
          in: header
      responses:
        "200":
          description: The request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmbedRequest"
        "401":
          description: No live embed session
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/embed/deny:
    post:
      operationId: denyEmbedRequest
      tags:
        - embed
      summary: Decline the embedded request
      parameters:
        - schema:
            type: string
            maxLength: 64
          required: false
          name: keelson-embed
          in: header
      responses:
        "200":
          description: Declined
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmbedRequest"
        "401":
          description: No live embed session
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The request is no longer pending
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/embed/sign-in/options:
    post:
      operationId: getEmbedSignInOptions
      tags:
        - embed
      summary: Start a passkey sign-in in the embedded approval
      description: WebAuthn request options for any of the user's passkeys, with a
        challenge for this embed session only. The frame passes them to
        `navigator.credentials.get`.
      parameters:
        - schema:
            type: string
            maxLength: 64
          required: false
          name: keelson-embed
          in: header
      responses:
        "200":
          description: The options
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
        "401":
          description: No live embed session
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/embed/sign-in:
    post:
      operationId: signInEmbed
      tags:
        - embed
      summary: Sign in with a passkey in the embedded approval
      description: Verifies the assertion against the session's challenge. It must
        come from the approval in a frame whose top-level origin is the embed's
        platform (`crossOrigin` true, `topOrigin` that origin). The session then
        signs for the passkey's user.
      parameters:
        - schema:
            type: string
            maxLength: 64
          required: false
          name: keelson-embed
          in: header
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebAuthnResponse"
      responses:
        "200":
          description: Who the frame signs for
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmbedSigner"
        "401":
          description: No live embed session, or the passkey did not verify
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/embed/links:
    post:
      operationId: createEmbedLink
      tags:
        - embed
      summary: Link the embedded approval to a Keelson window
      description: "A single-use nonce for the Keelson window the frame opens for a
        user without a passkey here: once they sign in there and confirm, this
        session signs for them."
      parameters:
        - schema:
            type: string
            maxLength: 64
          required: false
          name: keelson-embed
          in: header
      responses:
        "201":
          description: The nonce
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmbedLink"
        "401":
          description: No live embed session
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/embed/links/inspect:
    post:
      operationId: inspectEmbedLink
      tags:
        - embed
      summary: Read a link in the Keelson window
      description: The agent platform and the request an unspent link was opened for,
        so the window can show the user which page they are about to link before
        they confirm.
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nonce:
                  type: string
                  maxLength: 64
              required:
                - nonce
      responses:
        "200":
          description: The link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmbedLink"
        "401":
          description: Not signed in
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: The link is unknown, spent or expired
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/embed/links/confirm:
    post:
      operationId: confirmEmbedLink
      tags:
        - embed
      summary: Confirm a link from the Keelson window
      description: The signed-in user confirms the embedded approval that opened this
        window, named by its `ref`. The answer is a single-use grant the window
        hands only to that frame, its opener on Keelson's origin; the frame
        claims it with `POST /v1/embed/links/claim`. The frame may create a
        passkey only for a user who has none.
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nonce:
                  type: string
                  maxLength: 64
                ref:
                  type: string
                  maxLength: 26
              required:
                - nonce
                - ref
      responses:
        "200":
          description: The grant for the frame
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmbedLinked"
        "401":
          description: Not signed in
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: The link is unknown, spent, expired or for another request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/embed/links/claim:
    post:
      operationId: claimEmbedLink
      tags:
        - embed
      summary: Claim a link's grant in the embedded approval
      description: The frame redeems the grant its Keelson window handed it. It works
        once, and only for the session that opened the link; the session then
        signs for that user.
      parameters:
        - schema:
            type: string
            maxLength: 64
          required: false
          name: keelson-embed
          in: header
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                grant:
                  type: string
                  maxLength: 64
              required:
                - grant
      responses:
        "200":
          description: Who the frame signs for
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmbedSigner"
        "401":
          description: No live embed session, or the grant is not this session's
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/embed/passkeys/options:
    post:
      operationId: getEmbedPasskeyOptions
      tags:
        - embed
      summary: Start creating a passkey in the embedded approval
      description: WebAuthn creation options for the session's user, who linked a
        Keelson window. With `platform`, the passkey is created on this device's
        platform authenticator with the SPC `payment` extension.
      parameters:
        - schema:
            type: string
            maxLength: 64
          required: false
          name: keelson-embed
          in: header
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                platform:
                  type: boolean
              required:
                - platform
      responses:
        "200":
          description: The options
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
        "401":
          description: No live embed session, or no user linked
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/embed/passkeys:
    post:
      operationId: createEmbedPasskey
      tags:
        - embed
      summary: Create a passkey in the embedded approval
      description: Verifies the new credential against the session's challenge, made
        in the approval framed by the embed's platform, and stores it as the
        user's passkey (ES256 only).
      parameters:
        - schema:
            type: string
            maxLength: 64
          required: false
          name: keelson-embed
          in: header
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebAuthnResponse"
      responses:
        "201":
          description: Who the frame signs for, with the new passkey
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmbedSigner"
        "401":
          description: No live embed session, or no user linked
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: The credential did not verify
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/embed/draft:
    post:
      operationId: draftEmbedMandate
      tags:
        - embed
      summary: Draft the mandate in the embedded approval
      description: As `POST /v1/connections/{code}/draft`, for the embedded request
        and the session's user. The mandate carries `embed.top_origin`, the
        platform's origin, so only an assertion made in this frame signs it.
      parameters:
        - schema:
            type: string
            maxLength: 64
          required: false
          name: keelson-embed
          in: header
        - schema:
            type: string
          required: false
          name: keelson-device
          in: header
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectionDraft"
      responses:
        "200":
          description: The draft mandate and its card
          content:
            application/json:
              schema:
                type: object
                properties:
                  mandateDraft:
                    type: object
                    additionalProperties: {}
                  card:
                    $ref: "#/components/schemas/MandateCard"
                  ambiguous:
                    type: array
                    items:
                      type: string
                  check:
                    type: object
                    properties:
                      status:
                        type: string
                        enum:
                          - skipped
                      discrepancies:
                        type: "null"
                    required:
                      - status
                      - discrepancies
                required:
                  - mandateDraft
                  - card
                  - ambiguous
                  - check
        "401":
          description: No live embed session, or no user
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: The passkey is not the user's
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: The request is no longer open
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The user has no passkey
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: A limit is above what the agent asked
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: The operator's agent key or bond is not set
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/embed/mandates:
    post:
      operationId: createEmbedMandate
      tags:
        - embed
      summary: Approve the embedded request with a signed mandate
      description: As `POST /v1/mandates` with `connection`, for the embedded request
        and the session's user. The mandate's `embed.top_origin` must be the
        platform's origin, still registered, and the assertion must be made in
        this frame under it.
      parameters:
        - schema:
            type: string
            maxLength: 64
          required: false
          name: keelson-embed
          in: header
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                payloadSd:
                  type: object
                  additionalProperties: {}
                  description: The SD-JWT payload with its `_sd` digests, as signed.
                disclosures:
                  type: array
                  items:
                    type: string
                  maxItems: 1024
                  description: Every disclosure of the payload; each digest must resolve.
                decoySalts:
                  type: array
                  items:
                    type: string
                    pattern: ^[A-Za-z0-9_-]{22}$
                  maxItems: 512
                  description: The salts of the payload's decoy digests (RFC 9901 section 4.2.5);
                    every other digest resolves to a disclosure. Accepted once
                    both TEEs resolve decoys.
                commitment:
                  type: string
                  pattern: ^0x[0-9a-f]{64}$
                  description: "`C_m`; must equal the payload's `zk.commitment`."
                renews:
                  type: string
                  minLength: 26
                  maxLength: 26
                  description: "A mandate of yours that `needsRenewal`, which this one replaces:
                    it is revoked, and its PayPal hold voided, once this one is
                    stored."
                salt:
                  type: string
                  pattern: ^0x[0-9a-f]{32}$
                  description: The salt that opens `C_m`; the TEE needs it to issue the mandate.
                assertion:
                  $ref: "#/components/schemas/PasskeyAssertion"
                askAboveMinor:
                  type: integer
                  exclusiveMinimum: 0
                  maximum: 9007199254740991
              required:
                - payloadSd
                - disclosures
                - commitment
                - assertion
      responses:
        "201":
          description: The mandate; the request is approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedMandate"
        "401":
          description: No live embed session, no user, or a bad signature
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: The passkey is not the user's, or the origin is no longer registered
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: The request is no longer open
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The request was already answered
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: The mandate is invalid
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Too many approvals
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: Leg A cannot issue the mandate now
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/agents:
    get:
      operationId: listAgents
      tags:
        - agents
      summary: List your agents
      description: "Each agent that holds or held a mandate of yours, or that you
        connected: its live mandate with what is left, and when it last acted."
      security:
