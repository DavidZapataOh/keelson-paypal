      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  rail:
                    type: string
                    enum:
                      - pyusd
                      - paypal
                    description: "`pyusd`: slashes and warranties pay the merchant in PYUSD on
                      chain. `paypal`: they pay Keelson's treasury, and Keelson
                      sends the merchant a PayPal Payout in USD."
                  paypal_receiver:
                    anyOf:
                      - type: string
                        format: email
                      - type: string
                        pattern: ^[A-Z0-9]{13}$
                    description: "The PayPal account paid: an email address or a PayPal account id."
                required:
                  - rail
        "403":
          description: The signature, or the session, is not the merchant's
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
