              schema:
                $ref: "#/components/schemas/Problem"
  /v1/agents/stop:
    post:
      operationId: stopAgents
      tags:
        - agents
      summary: Stop all agents
      description: The kill switch. Keelson refuses every countersign of a mandate of
        yours stored before now, revokes every live mandate and voids its PayPal
        holds, denies every open request, revokes every agent's OAuth grant, and
        logs the stop as a `keelson.finance/stop/v1` leaf in the Alibi log.
        Purchases already countersigned may still be captured.
      security:
        - session: []
      parameters:
        - schema:
            type: string
            minLength: 1
            maxLength: 255
          required: true
          name: idempotency-key
          in: header
      responses:
        "200":
          description: Stopped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentStop"
        "401":
          description: Not signed in
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/agents/stops:
    get:
      operationId: listAgentStops
      tags:
        - agents
      summary: Your stops
      description: Each time you stopped all agents, newest first, with its log index.
      security:
        - session: []
      responses:
        "200":
          description: The stops
          content:
            application/json:
              schema:
                type: object
                properties:
                  stops:
                    type: array
                    items:
                      $ref: "#/components/schemas/AgentStop"
                required:
                  - stops
        "401":
          description: Not signed in
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/agents/{agentId}/disconnect:
    post:
      operationId: disconnectAgent
      tags:
        - agents
      summary: Disconnect an agent
      description: >-
        Revokes every live mandate of yours that names the agent and ends its
        connections. Keelson refuses its countersigns from now on; purchases
        already countersigned may still be captured.


        With `client`, only that app, of the apps acting through the agent: the
        mandates you approved for it, its requests, its OAuth grant and refresh
        tokens, and the access tokens it holds for you. Apps acting through
        Keelson's hosted operator are disconnected this way; without `client`,
        the hosted operator ends only your mandates of it that no app holds (its
        `Unknown app` row).
      security:
        - session: []
      parameters:
        - schema:
            type: string
            pattern: ^(0|[1-9]\d{0,77})$
          required: true
          name: agentId
          in: path
        - schema:
            type: string
            minLength: 1
            maxLength: 255
          required: false
          name: client
          in: query
        - schema:
            type: string
            minLength: 1
            maxLength: 255
          required: true
          name: idempotency-key
          in: header
      responses:
        "200":
          description: Disconnected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentsRevoked"
        "401":
          description: Not signed in
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No agent of yours with this id
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/activity:
    get:
      operationId: listActivity
      tags:
        - agents
      summary: Read your activity
      description: "What your agents and Keelson did, newest first, one plain line
        each: requests, purchases, blocks and stops. Purchases link to their
        Alibi and log entry."
      security:
        - session: []
      parameters:
        - schema:
            type: string
            pattern: ^(0|[1-9]\d{0,77})$
            description: Only this agent's rows, and stops of every agent.
          required: false
          description: Only this agent's rows, and stops of every agent.
          name: agent
          in: query
      responses:
        "200":
          description: The feed
          content:
            application/json:
              schema:
                type: object
                properties:
                  rows:
                    type: array
                    items:
                      $ref: "#/components/schemas/ActivityRow"
