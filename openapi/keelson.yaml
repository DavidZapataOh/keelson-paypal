  /v1/evidence/{root}/items/{index}:
    get:
      tags:
        - evidence
      summary: Disclose one evidence item
      description: One item with its content hash, salt and inclusion proof, for an
        arbiter. Every disclosure is recorded with its `reason`. An `.original`
        item stays age ciphertext unless `decrypt=1` is sent with the
        `evidence:decrypt` scope.
      parameters:
        - schema:
            type: string
            pattern: ^0x[0-9a-f]{64}$
          required: true
          name: root
          in: path
        - schema:
            type:
              - integer
              - "null"
            minimum: 0
            maximum: 21
          required: true
          name: index
          in: path
        - schema:
            type: string
            minLength: 1
            maxLength: 256
            description: Why the item is opened, such as the dispute it serves.
          required: true
          description: Why the item is opened, such as the dispute it serves.
          name: reason
          in: query
        - schema:
            type: string
            enum:
              - "1"
          required: false
          name: decrypt
          in: query
      responses:
        "200":
          description: The item and its disclosure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DisclosedEvidence"
        "403":
          description: Decrypting needs the `evidence:decrypt` scope
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such bundle or item
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: The item is not an `.original`, or it does not open with the
            evidence identity
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: The evidence identity is not configured
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/observations/channel3:
    post:
      tags:
        - evidence
      summary: Observe a product through Channel3
      description: "Asks Channel3 about the product page once (live fetch if its data
        is older than an hour, eight seconds at most), compares variant, price,
        availability and brand with what the agent saw, stores the observation
        and queues RFC 3161 tokens over its hash. Channel3 is third-party
        testimony: it is shown in the countersigned trace and never changes a
        decision."
      parameters:
        - schema:
            type: string
            minLength: 1
            maxLength: 255
          required: true
          name: idempotency-key
          in: header
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Channel3ObservationRequest"
      responses:
        "201":
          description: The observation and its sealed evidence item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel3Observation"
        "404":
          description: No such mandate of an operator this client linked
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The mandate is not active
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: The request is invalid
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Too many observations for this mandate, or today for this client
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: Channel3 is not configured, or the rate limit store is unreachable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/observations/channel3/{id}:
    get:
      tags:
        - evidence
      summary: Read a Channel3 observation
      description: The stored observation document and its hash; `GET
        /v1/timestamps/{content_hash}` serves its RFC 3161 tokens. Only the
        client that asked for it may read it.
      parameters:
        - schema:
            type: string
            minLength: 26
            maxLength: 26
          required: true
          name: id
          in: path
      responses:
        "200":
          description: The observation
          content:
            application/json:
              schema:
                type: object
                properties:
                  document:
                    type: object
                    additionalProperties: {}
                    description: The `keelson.channel3.observation/1` document; its JCS bytes hash
                      to `content_hash`.
                  content_hash:
                    type: string
                    pattern: ^0x[0-9a-f]{64}$
                required:
                  - document
                  - content_hash
        "404":
          description: No such observation
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/observations/web-fact:
    post:
      tags:
        - evidence
      summary: Notarize a product endpoint with TLSNotary
      description: Fetches the endpoint once over TLS with leg A as the TLSNotary
        notary (MPC-TLS, or Proxy-TLS when MPC-TLS fails), commits to the body
        or to the object around `anchor`, and returns the EIP-712 `WebFact` leg
        A signed with its attested key. Runs apart from any countersign and
        never delays one.
      parameters:
        - schema:
            type: string
            minLength: 1
            maxLength: 255
          required: true
          name: idempotency-key
          in: header
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebFactRequest"
      responses:
        "201":
          description: The signed WebFact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebFact"
        "422":
          description: The URL is refused, or its response is not a 200 the notary accepts
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Too many WebFacts today for this client
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "502":
          description: The session failed, or its WebFact did not verify
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: No prover is configured, leg A has no admitted signer, or the rate
            limit store is unreachable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/tee/attestations:
    get:
      tags:
        - tee
      summary: Attested TEE signers
      description: The signers whose countersignatures are accepted, each with the
        attestation it was admitted from, and the measurements the deployment
        publishes. A verifier checks the attestations itself.
      responses:
        "200":
          description: The admitted signers and the published measurements
          content:
            application/json:
              schema:
                type: object
                properties:
                  legs:
                    type: array
                    items:
                      $ref: "#/components/schemas/TeeLeg"
                  measurements:
                    type: object
                    properties:
                      engineBuildId:
                        type: string
                      tdx:
                        type: array
                        items:
                          type: string
                      nitro:
                        type: array
                        items:
                          type: string
                      provenance:
                        type: string
                        description: Where the Sigstore build provenance attested measurements.json is
                          published; `gh attestation verify` checks it.
                    required:
                      - engineBuildId
                      - tdx
                      - nitro
                      - provenance
                required:
                  - legs
                  - measurements
  /v1/timestamps/{hash}:
    get:
      tags:
        - timestamps
      summary: RFC 3161 timestamps of a hash
      description: The RFC 3161 tokens two independent TSAs issued over a log leaf
        hash (or another stamped hash). Each token's message imprint is the hash
        itself, so `openssl ts -verify -digest <hash>` checks it.
      parameters:
        - schema:
            type: string
            pattern: ^[0-9a-f]{64}$
            description: The SHA-256 hash, 64 lowercase hex digits.
          required: true
          description: The SHA-256 hash, 64 lowercase hex digits.
          name: hash
          in: path
      responses:
        "200":
          description: The tokens issued so far and the TSAs still pending
          content:
            application/json:
              schema:
                type: object
                properties:
                  hash:
                    type: string
                  stamps:
                    type: array
                    items:
                      $ref: "#/components/schemas/Timestamp"
                  pending:
                    type: array
                    items:
                      type: string
                      enum:
                        - digicert
                        - sigstore
                        - freetsa
                        - sectigo
                required:
                  - hash
                  - stamps
                  - pending
        "404":
          description: The hash was never queued
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/alibis/{id}.pdf:
    get:
      tags:
        - alibis
      summary: An alibi as a PDF/A-3b
      description: A one-page PDF/A-3b summary of the Alibi with a QR to its verify
        page and the bundle embedded as `<id>.alibi`. Same readers as the
        bundle.
      parameters:
        - schema:
            type: string
            pattern: ^[0-7][0-9A-HJKMNP-TV-Z]{25}$
            description: "The alibi id: the purchase's ULID."
          required: true
          description: "The alibi id: the purchase's ULID."
          name: id
          in: path
      responses:
        "200":
          description: The PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "304":
          description: The PDF has not changed
        "404":
          description: No alibi with this id that the caller may read
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/alibis/{id}:
    get:
      tags:
        - alibis
      summary: An alibi bundle
      description: "The purchase's Alibi: its RFC 8785 bundle, readable by the
        mandate's user or, with `alibis:read`, by the client that uploaded the
        purchase's evidence; the Alibi of a live purchase, once its PayPal
        transaction is recorded, by anyone. It grows as timestamps, the capture
        and the on-chain anchor arrive; earlier sections never change."
      parameters:
        - schema:
            type: string
            pattern: ^[0-7][0-9A-HJKMNP-TV-Z]{25}$
            description: "The alibi id: the purchase's ULID."
          required: true
          description: "The alibi id: the purchase's ULID."
          name: id
          in: path
      responses:
        "200":
          description: The bundle
          content:
            application/vnd.keelson.alibi.v1+json:
              schema:
                type: string
                format: binary
        "304":
          description: The bundle has not changed
        "404":
          description: No alibi with this id that the caller may read
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/alibis/verify:
    post:
      tags:
        - alibis
      summary: Verify an alibi
      description: Runs the browser verifier's algorithm on an Alibi bundle against
        the pinned trust roots and a public Arbitrum RPC. No authentication; the
        bundle is not stored.
      requestBody:
        required: true
        content:
          application/vnd.keelson.alibi.v1+json:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: The report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlibiReport"
        "400":
          description: Not an Alibi bundle; `pointer` names the failing value
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          description: The body is over 1 MiB
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "415":
          description: The body is not an Alibi bundle's media type
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/alibis/{id}/receipt:
    get:
      tags:
        - alibis
      summary: The public receipt of an alibi
      description: "What the public log already publishes about an Alibi: its leaf,
        inclusion proof, anchor and timestamps. No authentication."
      parameters:
        - schema:
            type: string
            pattern: ^[0-7][0-9A-HJKMNP-TV-Z]{25}$
            description: "The alibi id: the purchase's ULID."
          required: true
          description: "The alibi id: the purchase's ULID."
          name: id
          in: path
      responses:
        "200":
          description: The receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlibiReceipt"
        "404":
          description: No alibi with this id that the caller may read
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/anonymous-mandates/{mandateHash}:
    get:
      tags:
        - mandates
      summary: Proof that a registered user signed a mandate
      description: "The C3 `anonymous_mandate` zero-knowledge proof of the mandate
        whose passkey challenge is `mandateHash`, the `mandateHash` of its
        countersigns: a passkey in Keelson's registered-user tree signed it, and
        the mandate's commitment names that passkey. It shows neither the user
        nor the key, so it needs no authentication. Verify it with bb.js against
        the C3 key or with `eth_call` on `verifier`, and check that
        `user_set_root` is published in the `RegisteredUserSet` contract, as
        `verifyAnonymousMandate` in `@keelson/alibi/verify` does."
      parameters:
        - schema:
            type: string
            pattern: ^0x[0-9a-f]{64}$
          required: true
          name: mandateHash
          in: path
      responses:
        "200":
          description: The proof
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnonymousMandate"
        "404":
          description: No proof for this mandate yet
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/anonymous-purchases/{id}:
    get:
      tags:
        - purchases
      summary: Proof that a purchase was within a mandate a registered user signed
      description: "One zero-knowledge proof that composes the purchase's C1 proof
        (the countersigned cart satisfies the mandate) with its mandate's C3
        proof (a registered user's passkey, the one the mandate names, signed
        it) by recursion. It shows neither the mandate nor the user. Its public
        inputs are the countersign's cart fields, `C_m` and `M`, which link the
        purchases of one mandate: anyone holding the purchase id can read it."
      parameters:
        - schema:
            type: string
            pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
          required: true
          name: id
          in: path
      responses:
        "200":
          description: The proof
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnonymousPurchase"
        "404":
          description: No composed proof for this purchase yet
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/user-set/roots/{root}:
    get:
      tags:
        - mandates
      summary: A root of the registered-user tree
      description: "Whether `root` is, or was, the root of Keelson's registered-user
        tree: the Poseidon2 Merkle tree of every registered passkey's
        `user_key_hash`. A C3 proof under any root listed here was made by a
        registered user, who is hidden among the `size` users of that root.
        Roots stay valid after a passkey is removed. Keelson's relayer publishes
        every root to the `RegisteredUserSet` contract, which is what a verifier
        trusts; this route is a convenience."
      parameters:
        - schema:
            type: string
            pattern: ^0x[0-9a-f]{64}$
          required: true
          name: root
          in: path
      responses:
        "200":
          description: The root
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSetRoot"
        "404":
          description: No such root
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/disputes/{id}:
    get:
      tags:
        - Disputes
      summary: A dispute's attribution
      description: "Where a PayPal dispute over a Keelson purchase stands: the party
        at fault, the `Verdict` both TEE legs signed and the time from the
        dispute's arrival to its verdict. No authentication; it holds no
        personal data."
      parameters:
        - schema:
            type: string
            pattern: ^PP-[A-Z]-[0-9A-Za-z-]{1,40}$
          required: true
          name: id
          in: path
      responses:
        "200":
          description: The dispute
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DisputeStatus"
        "404":
          description: No dispute with this id over a Keelson purchase
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/passkeys:
    get:
