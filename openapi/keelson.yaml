openapi: 3.1.0
info:
  title: Keelson API
  version: 0.0.0
components:
  schemas:
    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
      required:
        - type
        - title
        - status
        - instance
      additionalProperties: {}
    CreatedMandate:
      type: object
      properties:
        id:
          type: string
        mandateHash:
          type: string
          pattern: ^0x[0-9a-f]{64}$
        state:
          type: string
          enum:
            - SIGNED
            - ACTIVE
          description: "`ACTIVE` at once when the mandate allows several merchants: each
            cart is then held on its own."
        openMandate:
          type:
            - string
            - "null"
          description: The open mandate (L2) the TEE issued; the agent closes it per
            purchase.
      required:
        - id
        - mandateHash
        - state
        - openMandate
    CreateMandate:
      type: object
      properties:
        payloadSd:
          type: object
          additionalProperties: {}
          description: The SD-JWT payload with its `_sd` digests, as signed.
        disclosures:
          type: array
          items:
            type: string
          maxItems: 1024
          description: Every disclosure of the payload; each digest must resolve.
        commitment:
          type: string
          pattern: ^0x[0-9a-f]{64}$
          description: "`C_m`; must equal the payload's `zk.commitment`."
        salt:
          type: string
          pattern: ^0x[0-9a-f]{32}$
          description: The salt that opens `C_m`; the TEE needs it to issue the mandate.
        assertion:
          $ref: "#/components/schemas/PasskeyAssertion"
      required:
        - payloadSd
        - disclosures
        - commitment
        - assertion
    PasskeyAssertion:
      type: object
      properties:
        authenticatorData:
          type: string
        clientDataJSON:
          type: string
        signature:
          type: string
        credentialId:
          type: string
        userHandle:
          type: string
      required:
        - authenticatorData
        - clientDataJSON
        - signature
        - credentialId
      description: A WebAuthn or Secure Payment Confirmation assertion, base64url fields.
    Mandate:
      type: object
      properties:
        id:
          type: string
        state:
          type: string
          enum:
            - DRAFT
            - COMPILED
            - SIGNED
            - HOLD_PENDING
            - ACTIVE
            - EXHAUSTED
            - EXPIRED
            - REVOKED
        mandateHash:
          type:
            - string
            - "null"
          pattern: ^0x[0-9a-f]{64}$
        hold:
          anyOf:
            - $ref: "#/components/schemas/MandateHold"
            - type: "null"
          description: The PayPal hold of the mandate's budget, once its order exists.
        card:
          anyOf:
            - $ref: "#/components/schemas/MandateCard"
            - type: "null"
          description: The card rendered from the stored payload, before any checkout
            evidence.
      required:
        - id
        - state
        - mandateHash
        - hold
        - card
    MandateHold:
      type: object
      properties:
        mode:
          type: string
          enum:
            - mandate
            - per_purchase
        orderId:
          type: string
        authorizationId:
          type:
            - string
            - "null"
          description: "The authorization captures use: the original, or its
            reauthorization."
        authorizedAt:
          type:
            - string
            - "null"
          format: date-time
        reauthorizedAt:
          type:
            - string
            - "null"
          format: date-time
        remainingMinor:
          type: string
          pattern: ^\d+$
        state:
          type: string
          enum:
            - PENDING
            - AUTHORIZED
            - RELEASED
          description: "`PENDING` until authorized; `RELEASED` once the mandate ended and
            the hold was voided or captured."
      required:
        - mode
        - orderId
        - authorizationId
        - authorizedAt
        - reauthorizedAt
        - remainingMinor
        - state
    MandateCard:
      type: object
      properties:
        rows:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              label:
                type: string
              values:
                type: array
                items:
                  type: string
              color:
                type: string
                enum:
                  - green
                  - amber
                  - gray
              answers:
                type: string
                enum:
                  - Keelson
                  - Agent operator
                  - You
            required:
              - field
              - label
              - values
              - color
              - answers
        warnings:
          type: array
          items:
            type: string
      required:
        - rows
        - warnings
    PayPalClient:
      type: object
      properties:
        clientId:
          type: string
        environment:
          type: string
          enum:
            - sandbox
            - production
      required:
        - clientId
        - environment
    HoldOrder:
      type: object
      properties:
        orderId:
          type: string
        state:
          type: string
          enum:
            - HOLD_PENDING
      required:
        - orderId
        - state
    AuthorizedHold:
      type: object
      properties:
        state:
          type: string
          enum:
            - ACTIVE
        authorizationId:
          type: string
        expiresAt:
          type: string
          format: date-time
          description: When PayPal expires the authorization, 29 days after it was created.
      required:
        - state
        - authorizationId
        - expiresAt
    PendingHold:
      type: object
      properties:
        state:
          type: string
          enum:
            - HOLD_PENDING
        authorizationId:
          type: string
      required:
        - state
        - authorizationId
      description: PayPal holds the authorization for review; Keelson activates it
        once created.
    AuthorizeHold:
      type: object
      properties:
        orderId:
          type: string
          minLength: 1
          maxLength: 64
      required:
        - orderId
      description: The order the buyer approved.
    PurchaseHoldOrder:
      type: object
      properties:
        requestId:
          type: string
        orderId:
          type: string
      required:
        - requestId
        - orderId
    CreatePurchaseHold:
      type: object
      properties:
        requestId:
          type: string
          pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
          description: The request id the purchase is countersigned under.
        merchant:
          type: string
          minLength: 1
          maxLength: 256
        currency:
          type: string
          minLength: 3
          maxLength: 3
        amountMinor:
          type: string
          pattern: ^[1-9]\d{0,17}$
          description: The cart total, in minor units.
        cartHash:
          type: string
          pattern: ^0x[0-9a-f]{64}$
        closedMandate:
          type: string
          minLength: 1
          maxLength: 32768
          description: The mandate's open mandate closed by the agent key over `requestId`
            and `cartHash`; it proves the caller is the mandate's agent.
      required:
        - requestId
        - merchant
        - currency
        - amountMinor
        - cartHash
        - closedMandate
    AuthorizedPurchaseHold:
      type: object
      properties:
        requestId:
          type: string
        state:
          type: string
          enum:
            - AUTHORIZED
            - PENDING
        authorizationId:
          type: string
      required:
        - requestId
        - state
        - authorizationId
      description: "`PENDING` while PayPal reviews the authorization; asking again
        once it is created authorizes the hold."
    AuthorizePurchaseHold:
      type: object
      properties:
        orderId:
          type: string
          minLength: 1
          maxLength: 64
      required:
        - orderId
      description: The order the buyer approved.
    RevokedMandate:
      type: object
      properties:
        state:
          type: string
          enum:
            - REVOKED
      required:
        - state
    RevokingMandate:
      type: object
      properties:
        state:
          type: string
          enum:
            - REVOKING
      required:
        - state
      description: Purchases already countersigned may still be captured; the hold is
        voided after them.
    CompiledMandate:
      type: object
      properties:
        mandateDraft:
          $ref: "#/components/schemas/MandateDraft"
        card:
          $ref: "#/components/schemas/MandateCard"
        ambiguous:
          type: array
          items:
            type: string
            enum:
              - mode
              - recurrence
              - total
              - currency
              - budget
              - merchant
              - deadline
              - quantity
              - items
              - category
              - variant
              - return_policy
              - agent
              - bond
              - subjective
              - summary
          description: Card fields the compilations disagreed on or the request left
            unstated, shown gray for the user to settle. Pass them to
            `prepareSigning` so the card the user signs shows them gray too.
        check:
          type: object
          properties:
            status:
              type: string
              enum:
                - ok
                - refused
                - failed
                - aborted
                - skipped
            discrepancies:
              type:
                - array
                - "null"
              items:
                type: object
                properties:
                  field:
                    type: string
                  issue:
                    type: string
                required:
                  - field
                  - issue
          required:
            - status
            - discrepancies
          description: The round trip of the card against the request. Only `ok` means it
            was checked.
      required:
        - mandateDraft
        - card
        - ambiguous
        - check
    MandateDraft:
      type: object
      properties:
        v:
          type: string
          enum:
            - keelson.mandate.1
        mid:
          type: string
        iat:
          type: integer
          minimum: 0
        nbf:
          type: integer
          minimum: 0
        exp:
          type: integer
          minimum: 0
        nonce:
          type: string
          pattern: ^[A-Za-z0-9_-]{21}[AQgw]$
        mode:
          type: string
          enum:
            - immediate
            - autonomous
        user:
          type: object
          properties:
            sub:
              type: string
            cred:
              type: object
              properties:
                id:
                  type: string
                  pattern: ^[A-Za-z0-9_-]+$
                rp_id:
                  type: string
                jwk:
                  type: object
                  properties:
                    kty:
                      type: string
                      enum:
                        - EC
                    crv:
                      type: string
                      enum:
                        - P-256
                    x:
                      type: string
                      pattern: ^[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$
                    y:
                      type: string
                      pattern: ^[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$
                  required:
                    - kty
                    - crv
                    - x
                    - y
                  additionalProperties: false
              required:
                - id
                - rp_id
                - jwk
              additionalProperties: false
            app_login_id:
              type: string
          required:
            - sub
            - cred
            - app_login_id
          additionalProperties: false
        agent:
          type: object
          properties:
            operator:
              type: object
              properties:
                agent_registry:
                  type: string
                agent_id:
                  type: string
              required:
                - agent_registry
                - agent_id
              additionalProperties: false
            cnf:
              type: object
              properties:
                jwk:
                  type: object
                  properties:
                    kty:
                      type: string
                      enum:
                        - EC
                    crv:
                      type: string
                      enum:
                        - P-256
                    x:
                      type: string
                      pattern: ^[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$
                    y:
                      type: string
                      pattern: ^[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$
                    kid:
                      type: string
                  required:
                    - kty
                    - crv
                    - x
                    - y
                    - kid
                  additionalProperties: false
              required:
                - jwk
              additionalProperties: false
            bond:
              type: object
              properties:
                vault:
                  type: string
                asset:
                  type: string
                min:
                  type: integer
                  minimum: 0
              required:
                - vault
                - asset
                - min
              additionalProperties: false
          required:
            - operator
            - cnf
            - bond
          additionalProperties: false
        payment:
          type: object
          properties:
            rail:
              type: string
              enum:
                - paypal
            currency:
              type: string
              enum:
                - AUD
                - BRL
                - CAD
                - CNY
                - CZK
                - DKK
                - EUR
                - HKD
                - HUF
                - ILS
                - JPY
                - MYR
                - MXN
                - TWD
                - NZD
                - NOK
                - PHP
                - PLN
                - GBP
                - SGD
                - SEK
                - CHF
                - THB
                - USD
            constraints:
              type: array
              items:
                oneOf:
                  - type: object
                    properties:
                      type:
                        type: string
                        enum:
                          - payment.amount_range
                      max:
                        type: integer
                        minimum: 0
                      currency:
                        type: string
                        enum:
                          - AUD
                          - BRL
                          - CAD
                          - CNY
                          - CZK
                          - DKK
                          - EUR
                          - HKD
                          - HUF
                          - ILS
                          - JPY
                          - MYR
                          - MXN
                          - TWD
                          - NZD
                          - NOK
                          - PHP
                          - PLN
                          - GBP
                          - SGD
                          - SEK
                          - CHF
                          - THB
                          - USD
                    required:
                      - type
                      - max
                      - currency
                    additionalProperties: false
                  - type: object
                    properties:
                      type:
                        type: string
                        enum:
                          - payment.budget
                      max:
                        type: integer
                        minimum: 0
                      currency:
                        type: string
                        enum:
                          - AUD
                          - BRL
                          - CAD
                          - CNY
                          - CZK
                          - DKK
                          - EUR
                          - HKD
                          - HUF
                          - ILS
                          - JPY
                          - MYR
                          - MXN
                          - TWD
                          - NZD
                          - NOK
                          - PHP
                          - PLN
                          - GBP
                          - SGD
                          - SEK
                          - CHF
                          - THB
                          - USD
                    required:
                      - type
                      - max
                      - currency
                    additionalProperties: false
                  - type: object
                    properties:
                      type:
                        type: string
                        enum:
                          - payment.allowed_payees
                      allowed:
                        type: array
                        items:
                          type: object
                          properties:
                            paypal_merchant_id:
                              type: string
                          required:
                            - paypal_merchant_id
                          additionalProperties: false
                        minItems: 1
                    required:
                      - type
                      - allowed
                    additionalProperties: false
                  - type: object
                    properties:
                      type:
                        type: string
                        enum:
                          - payment.execution_date
                      not_after:
                        type: string
                        format: date-time
                    required:
                      - type
                      - not_after
                    additionalProperties: false
          required:
            - rail
            - currency
            - constraints
          additionalProperties: false
        checkout:
          type: object
          properties:
            constraints:
              type: array
              items:
                oneOf:
                  - type: object
                    properties:
                      type:
                        type: string
                        enum:
                          - checkout.allowed_merchants
                      allowed:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            name:
                              type: string
                            website:
                              type: string
                            paypal_merchant_id:
                              type: string
                          required:
                            - id
                            - name
                            - website
                            - paypal_merchant_id
                          additionalProperties: false
                        minItems: 1
                    required:
                      - type
                      - allowed
                    additionalProperties: false
                  - type: object
                    properties:
                      type:
                        type: string
                        enum:
                          - checkout.line_items
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            acceptable_items:
                              type: array
                              items:
                                type: object
                                properties:
                                  id:
                                    type: string
                                  title:
                                    type: string
                                required:
                                  - id
                                additionalProperties: false
                              minItems: 1
                            quantity:
                              type: integer
                              exclusiveMinimum: 0
                          required:
                            - id
                            - acceptable_items
                            - quantity
                          additionalProperties: false
                    required:
                      - type
                      - items
                    additionalProperties: false
                  - type: object
                    properties:
                      type:
                        type: string
                        enum:
                          - keelson.category
                      allow:
                        type: array
                        items:
                          type: string
                          enum:
                            - gpt:1
                            - gpt:166
                            - gpt:8
                            - gpt:537
                            - gpt:111
                            - gpt:141
                            - gpt:222
                            - gpt:412
                            - gpt:436
                            - gpt:632
                            - gpt:469
                            - gpt:536
                            - gpt:5181
                            - gpt:772
                            - gpt:783
                            - gpt:922
                            - gpt:5605
                            - gpt:2092
                            - gpt:988
                            - gpt:1239
                            - gpt:888
                            - gpt:187
                        minItems: 1
                      deny:
                        type: array
                        items:
                          type: string
                          enum:
                            - gpt:1
                            - gpt:166
                            - gpt:8
                            - gpt:537
                            - gpt:111
                            - gpt:141
                            - gpt:222
                            - gpt:412
                            - gpt:436
                            - gpt:632
                            - gpt:469
                            - gpt:536
                            - gpt:5181
                            - gpt:772
                            - gpt:783
                            - gpt:922
                            - gpt:5605
                            - gpt:2092
                            - gpt:988
                            - gpt:1239
                            - gpt:888
                            - gpt:187
                    required:
                      - type
                      - allow
                      - deny
                    additionalProperties: false
                  - type: object
                    properties:
                      type:
                        type: string
                        enum:
                          - keelson.attributes
                      must:
                        type: object
                        additionalProperties:
                          type: string
                    required:
                      - type
                      - must
                    additionalProperties: false
                  - type: object
                    properties:
                      type:
                        type: string
                        enum:
                          - keelson.returns
                      min_days:
                        type: integer
                        minimum: 0
                      free:
                        type: boolean
                    required:
                      - type
                      - min_days
                      - free
                    additionalProperties: false
          required:
            - constraints
          additionalProperties: false
        intent:
          type: object
          properties:
            prompt_summary:
              type: string
            prompt_hash:
              type: string
              pattern: ^sha256:[0-9a-f]{64}$
            subjective:
              type: array
              items:
                type: string
          required:
            - prompt_summary
            - prompt_hash
            - subjective
          additionalProperties: false
        policy:
          type: object
          properties:
            engine:
              type: string
            version:
              type: string
            policy_set_hash:
              type: string
              pattern: ^sha256:[0-9a-f]{64}$
            measurements:
              type: array
              items:
                type: string
          required:
            - engine
            - version
            - policy_set_hash
            - measurements
          additionalProperties: false
        consent:
          type: object
          properties:
            terms_hash:
              type: string
              pattern: ^sha256:[0-9a-f]{64}$
            instruction_use:
              type: boolean
            responsibility_ack:
              type: boolean
            merchant_policy_ack:
              type: string
            recurrence_ack:
              type: boolean
          required:
            - terms_hash
            - instruction_use
            - responsibility_ack
            - merchant_policy_ack
            - recurrence_ack
          additionalProperties: false
        zk:
          type: object
          properties:
            commitment:
              type: string
              pattern: ^0x[0-9a-f]{64}$
          required:
            - commitment
          additionalProperties: false
        risk_data:
          type: object
          properties:
            device_fp:
              type: string
            ip:
              type: string
          required:
            - device_fp
            - ip
          additionalProperties: false
      required:
        - v
        - mid
        - iat
        - nbf
        - exp
        - nonce
        - mode
        - user
        - agent
        - payment
        - checkout
        - intent
        - policy
        - consent
        - zk
        - risk_data
      additionalProperties: false
      description: The compiled `keelson.mandate.1` payload, unsigned; its commitment
        is zero.
    CompileMandate:
      type: object
      properties:
        prompt:
          type: string
          minLength: 1
          description: The shopping request in natural language, at most 2000 UTF-16 code
            units.
          example: Running shoes, size 10, under $100, free returns, by Friday
        credentialId:
          type: string
          minLength: 1
          description: The passkey that will sign the mandate; defaults to the most recent
            one.
        mode:
          type: string
          enum:
            - immediate
            - autonomous
          default: autonomous
          description: Whether the user is present at checkout (`immediate`) or not
            (`autonomous`).
      required:
        - prompt
    Countersigned:
      type: object
      properties:
        purchaseId:
          type: string
        mode:
          type: string
          enum:
            - 2of2
            - degraded
          description: "`degraded` when leg B was unreachable and only leg A signed."
        decision:
          type: string
          enum:
            - allow
            - deny
        countersign:
          type: object
          additionalProperties:
            type: string
          description: The EIP-712 `Countersign` message, as decimal strings.
        digest:
          type: string
          pattern: ^0x[0-9a-f]{64}$
        signatures:
          type: object
          properties:
            tdx:
              type: string
              pattern: ^0x[0-9a-f]{130}$
            nitro:
              type:
                - string
                - "null"
              pattern: ^0x[0-9a-f]{130}$
          required:
            - tdx
            - nitro
        signers:
          type: object
          properties:
            tdx:
              type: string
            nitro:
              type:
                - string
                - "null"
          required:
            - tdx
            - nitro
        trace:
          description: The `keelson.eval/1` trace both legs signed over.
        state:
          type: string
          description: "`CAPTURED` once logged, covered and captured; `FAILED` with
            `failure` when a step refused; `COUNTERSIGNED`, `LOGGED` or
            `COVERED` while a step is pending; `DENIED` for a DENY."
        logIndex:
          type: string
          description: The leaf's index in the Alibi log.
        coverage:
          type: object
          properties:
            chainId:
              type: integer
            txHash:
              type:
                - string
                - "null"
          required:
            - chainId
            - txHash
          description: The `lockCoverage` transaction of the operator's bond.
        capture:
          type: object
          properties:
            id:
              type: string
            invoiceId:
              type: string
            status:
              type:
                - string
                - "null"
          required:
            - id
            - invoiceId
            - status
          description: The PayPal capture of the countersigned amount.
        failure:
          type: object
          properties:
            step:
              type: string
            reason:
              type: string
          required:
            - step
            - reason
          description: The step that failed and why; nothing was captured.
      required:
        - purchaseId
        - mode
        - decision
        - countersign
        - digest
        - signatures
        - signers
    CountersignRequest:
      type: object
      properties:
        authorizationId:
          type: string
          minLength: 1
          maxLength: 64
          description: The PayPal authorization that holds the mandate's funds, or this
            request's own hold when the mandate holds each purchase separately;
            leg A reads it.
        closedMandate:
          type: string
          minLength: 1
          maxLength: 131072
          description: The open mandate closed by the agent's key binding over the request
            and cart.
        cart:
          $ref: "#/components/schemas/Cart"
        unit:
          type: object
          additionalProperties: {}
          description: The PayPal purchase unit the cart is checked against.
        evidence:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
              maxLength: 256
            maxItems: 8
          default: {}
          description: "Evidence sources per field. `channel3:` sources are refused here:
            the API adds them from the observation stored in the evidence."
        evidenceRoot:
          type: string
          pattern: ^0x[0-9a-f]{64}$
          description: The root of the evidence stored with `POST /v1/evidence` for this
            mandate.
      required:
        - authorizationId
        - closedMandate
        - cart
        - unit
        - evidenceRoot
    Cart:
      type: object
      properties:
        merchant:
          type: string
          minLength: 1
          maxLength: 256
        currency:
          type: string
          minLength: 3
          maxLength: 3
        lines:
          type: array
          items:
            type: object
            properties:
              sku:
                type: string
                maxLength: 256
              size:
                type:
                  - string
                  - "null"
                maxLength: 256
              color:
                type:
                  - string
                  - "null"
                maxLength: 256
              category:
                type: string
                maxLength: 256
              qty:
                type: integer
                exclusiveMinimum: 0
              unit_minor:
                type: integer
                minimum: 0
            required:
              - sku
              - category
              - qty
              - unit_minor
          minItems: 1
          maxItems: 32
        return_days:
          type: integer
          minimum: 0
        returns_free:
          type: boolean
      required:
        - merchant
        - currency
        - lines
        - return_days
        - returns_free
    Purchase:
      type: object
      properties:
        id:
          type: string
        mandateId:
          type: string
        mode:
          type:
            - string
            - "null"
          enum:
            - 2of2
            - degraded
            - null
        amount:
          type: object
          properties:
            currency:
              type: string
            minor:
              type: string
          required:
            - currency
            - minor
        state:
          type: string
        logIndex:
          type: string
          description: The leaf's index in the Alibi log.
        coverage:
          type: object
          properties:
            chainId:
              type: integer
            txHash:
              type:
                - string
                - "null"
          required:
            - chainId
            - txHash
          description: The `lockCoverage` transaction of the operator's bond.
        capture:
          type: object
          properties:
            id:
              type: string
            invoiceId:
              type: string
            status:
              type:
                - string
                - "null"
          required:
            - id
            - invoiceId
            - status
          description: The PayPal capture of the countersigned amount.
        failure:
          type: object
          properties:
            step:
              type: string
            reason:
              type: string
          required:
            - step
            - reason
          description: The step that failed and why; nothing was captured.
      required:
        - id
        - mandateId
        - mode
        - amount
        - state
    EvidenceUpload:
      type: object
      properties:
        mandateId:
          type: string
          minLength: 26
          maxLength: 26
        manifest:
          $ref: "#/components/schemas/EvidenceManifest"
        items:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                maxLength: 64
              mediaType:
                type: string
                maxLength: 128
              salt:
                type: string
                description: 32 random bytes, base64.
              bytes:
                type: string
                description: The item bytes, base64.
            required:
              - type
              - mediaType
              - salt
              - bytes
          minItems: 1
          maxItems: 20
      required:
        - mandateId
        - manifest
        - items
    EvidenceManifest:
      type: object
      properties:
        v:
          type: string
          enum:
            - keelson.manifest/1
        root:
          type: string
          pattern: ^0x[0-9a-f]{64}$
        items:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
              media_type:
                type: string
              leaf:
                type: string
                pattern: ^0x[0-9a-f]{64}$
                description: '`SHA-256(0x00 ‖ "keelson/evidence-item/v1" ‖ salt ‖ type ‖ 0x00 ‖
                  media_type ‖ 0x00 ‖ content_hash)`.'
            required:
              - type
              - media_type
              - leaf
          minItems: 1
          maxItems: 20
      required:
        - v
        - root
        - items
      description: Type, media type and salted leaf of every item, in order; `root` is
        the RFC 6962 tree hash of the leaves and the `evidenceRoot`. Content
        hashes and salts are only given in a disclosure.
    DisclosedEvidence:
      type: object
      properties:
        disclosure:
          $ref: "#/components/schemas/EvidenceDisclosure"
        bytes:
          type: string
      required:
        - disclosure
        - bytes
    EvidenceDisclosure:
      type: object
      properties:
        index:
          type: integer
        type:
          type: string
        media_type:
          type: string
        content_hash:
          type: string
          pattern: ^0x[0-9a-f]{64}$
        salt:
          type: string
          pattern: ^0x[0-9a-f]{64}$
        path:
          type: array
          items:
            type: string
            pattern: ^0x[0-9a-f]{64}$
          description: The RFC 9162 inclusion proof, leaf first.
        size:
          type: integer
      required:
        - index
        - type
        - media_type
        - content_hash
        - salt
        - path
        - size
    Channel3Observation:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
          enum:
            - ok
            - unavailable
          description: "`unavailable` when Channel3 did not answer in time or failed; it
            is stored too."
        item:
          type: object
          properties:
            type:
              type: string
              enum:
                - channel3.observation
            mediaType:
              type: string
              enum:
                - application/json
            salt:
              type: string
              description: 32 random bytes, base64.
            bytes:
              type: string
              description: The JCS observation document, base64.
            content_hash:
              type: string
              pattern: ^0x[0-9a-f]{64}$
            leaf:
              type: string
              pattern: ^0x[0-9a-f]{64}$
          required:
            - type
            - mediaType
            - salt
            - bytes
            - content_hash
            - leaf
          description: The sealed evidence item to add to the capture's items, after
            `har`, before `buildManifest` and `POST /v1/evidence`.
        comparison:
          $ref: "#/components/schemas/Channel3Comparison"
      required:
        - id
        - status
        - item
        - comparison
    Channel3Comparison:
      type: object
      properties:
        offerDomain:
          type:
            - string
            - "null"
        variant:
          type: string
          enum:
            - match
            - mismatch
            - unknown
        price:
          type: string
          enum:
            - match
            - mismatch
            - unknown
        availability:
          type: string
          enum:
            - match
            - mismatch
            - unknown
        brand:
          type: string
          enum:
            - match
            - mismatch
            - unknown
        mismatches:
          type: array
          items:
            type: string
      required:
        - offerDomain
        - variant
        - price
        - availability
        - brand
        - mismatches
    Channel3ObservationRequest:
      type: object
      properties:
        mandateId:
          type: string
          minLength: 26
          maxLength: 26
        url:
          type: string
          maxLength: 2048
          description: The product page the agent is on.
        agentView:
          type: object
          properties:
            contentHash:
              type: string
              pattern: ^0x[0-9a-f]{64}$
              description: The `content_hash` of the capture's `api.product` item the view was
                read from.
            brand:
              type: string
              minLength: 1
              maxLength: 256
            priceMinor:
              type: string
              pattern: ^(0|[1-9][0-9]{0,17})$
              description: The price the agent saw, in minor units.
            currency:
              type: string
              enum:
                - AUD
                - BRL
                - CAD
                - CNY
                - CZK
                - DKK
                - EUR
                - HKD
                - HUF
                - ILS
                - JPY
                - MYR
                - MXN
                - TWD
                - NZD
                - NOK
                - PHP
                - PLN
                - GBP
                - SGD
                - SEK
                - CHF
                - THB
                - USD
            available:
              type: boolean
            selected:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                    minLength: 1
                    maxLength: 128
                  label:
                    type: string
                    minLength: 1
                    maxLength: 128
                required:
                  - name
                  - label
              maxItems: 16
          required:
            - contentHash
            - priceMinor
            - currency
            - available
            - selected
          description: What the agent saw on the page.
      required:
        - mandateId
        - url
        - agentView
    TeeLeg:
      type: object
      properties:
        tee:
          type: string
          enum:
            - tdx
            - nitro
        signer:
          type: string
        measurement:
          type: string
        registeredAt:
          type: string
        verifiedAt:
          type: string
          description: When the attestation last verified.
        expiresAt:
          type: string
        onchain:
          type:
            - object
            - "null"
          properties:
            chainId:
              type: number
            verdictVerifier:
              type: string
            registeredAt:
              type: string
            expiresAt:
              type: string
          required:
            - chainId
            - verdictVerifier
            - registeredAt
            - expiresAt
          description: The signer's record in the VerdictVerifier, which on-chain
            verification reads; null when it is not registered there.
        attestation:
          type: object
          additionalProperties: {}
          description: "The attestation the signer was admitted from: the platform
            evidence, its binding and the block it was made over."
      required:
        - tee
        - signer
        - measurement
        - registeredAt
        - verifiedAt
        - expiresAt
        - onchain
        - attestation
    Timestamp:
      type: object
      properties:
        tsa:
          type: string
          enum:
            - digicert
            - sigstore
            - freetsa
            - sectigo
        role:
          type: string
          enum:
            - primary
            - fallback
        token:
          type: string
          description: The DER `TimeStampToken`, base64.
        genTime:
          type: string
          description: The token's `genTime`, RFC 3339 UTC.
        serial:
          type: string
          description: The token's serial number, hex.
      required:
        - tsa
        - role
        - token
        - genTime
        - serial
    AlibiReport:
      type: object
      properties:
        reference:
          type: string
        verdict:
          type: string
          enum:
            - verified
            - verified-unanchored
            - verified-offline
            - failed
            - incomplete
        checks:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              step:
                type: integer
              status:
                type: string
                enum:
                  - pass
                  - fail
                  - undisclosed
                  - pending
                  - absent
                  - unreachable
              reason:
                type: string
              reads:
                type: array
                items:
                  type: string
                description: RFC 6901 pointers the check read.
              ms:
                type: number
              detail:
                type: object
                additionalProperties:
                  type: string
            required:
              - id
              - step
              - status
              - reads
              - ms
        mode:
          type: string
          enum:
            - 2of2
            - degraded
        fields:
          type: array
          items:
            type: object
            additionalProperties: {}
        unbound:
          type: array
          items:
            type: object
            properties:
              pointer:
                type: string
              value: {}
            required:
              - pointer
        changed:
          type: array
          items:
            type: string
        rpc:
          type: object
          properties:
            url:
              type: string
            custom:
              type: boolean
          required:
            - url
            - custom
        ms:
          type: number
      required:
        - reference
        - verdict
        - checks
        - mode
        - fields
        - unbound
        - changed
        - ms
    AlibiReceipt:
      type: object
      properties:
        alibi_id:
          type: string
        leaf:
          type: string
          description: The leaf bytes, base64.
        leaf_hash:
          type: string
          description: The RFC 6962 leaf hash, unpadded base64url.
        tlog_proof:
          type: string
          description: A c2sp.org/tlog-proof@v1 with cosignatures.
        anchor:
          type: object
          additionalProperties: {}
        timestamps:
          type: array
          items:
            type: object
            properties:
              tsa:
                type: string
              token:
                type: string
            required:
              - tsa
              - token
      required:
        - alibi_id
        - leaf
        - leaf_hash
        - tlog_proof
        - timestamps
    Passkeys:
      type: object
      properties:
        passkeys:
          type: array
          items:
            type: object
            properties:
              credentialId:
                type: string
              payment:
                type: boolean
                description: Registered with the SPC `payment` extension, so SPC can use it.
            required:
              - credentialId
              - payment
      required:
        - passkeys
    Operator:
      type: object
      properties:
        agentId:
          type: string
          pattern: ^(0|[1-9]\d{0,19})$
          description: The ERC-8004 agent id, a decimal integer.
        chainId:
          type: integer
        agentRegistry:
          type: string
        owner:
          type: string
          description: The agent's owner in the Identity registry.
      required:
        - agentId
        - chainId
        - agentRegistry
        - owner
    LinkOperator:
      type: object
      properties:
        chainId:
          anyOf:
            - type: number
              enum:
                - 421614
            - type: number
              enum:
                - 42161
            - type: number
              enum:
                - 11155111
        agentId:
          type: string
          pattern: ^(0|[1-9]\d{0,19})$
          description: The ERC-8004 agent id, a decimal integer.
        name:
          type: string
          minLength: 1
          maxLength: 200
        cnfJwk:
          type: object
          properties:
            kty:
              type: string
              enum:
                - EC
            crv:
              type: string
              enum:
                - P-256
            x:
              type: string
              pattern: ^[A-Za-z0-9_-]{43}$
            y:
              type: string
              pattern: ^[A-Za-z0-9_-]{43}$
            kid:
              type: string
              maxLength: 64
          required:
            - kty
            - crv
            - x
            - y
          description: The agent's P-256 `cnf` key, a public JWK.
        deadline:
          type: integer
          exclusiveMinimum: 0
          description: Unix seconds, at most 15 minutes ahead.
        signature:
          type: string
          maxLength: 8194
          pattern: ^0x([0-9a-fA-F]{2})+$
          description: "The EIP-712 `OperatorLink(uint256 agentId,bytes32
            cnfThumbprint,uint256 deadline)` signature under the domain `{ name:
            \"Keelson\", version: \"1\", chainId }`, by the agent's owner or
            `agentWallet` (EOA, ERC-1271 or ERC-6492). `cnfThumbprint` is the
            RFC 7638 SHA-256 thumbprint of `cnfJwk`."
      required:
        - chainId
        - agentId
        - name
        - cnfJwk
        - deadline
        - signature
    AgentRegistration:
      type: object
      properties:
        type:
          type: string
        name:
          type: string
        description:
          type: string
        image:
          type: string
        services:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              endpoint:
                type: string
              version:
                type: string
            required:
              - name
              - endpoint
        x402Support:
          type: boolean
        active:
          type: boolean
        registrations:
          type: array
          items:
            type: object
            properties:
              agentId:
                anyOf:
                  - type: number
                  - type: string
              agentRegistry:
                type: string
            required:
              - agentId
              - agentRegistry
        supportedTrust:
          type: array
          items:
            type: string
      required:
        - type
        - name
        - description
        - image
        - services
        - x402Support
        - active
        - registrations
      description: An ERC-8004 agent registration file (`registration-v1`).
    OperatorBond:
      type: object
      properties:
        bond:
          type: object
          properties:
            free:
              type: string
            locked:
              type: string
            queued:
              type: string
            slashCount:
              type: integer
          required:
            - free
            - locked
            - queued
            - slashCount
        reputation:
          type: object
          properties:
            count:
              type: integer
            value:
              type: string
              description: The average feedback value, fixed-point.
            decimals:
              type: integer
            slashes:
              type: integer
          required:
            - count
            - value
            - decimals
            - slashes
        validation:
          type: object
          properties:
            count:
              type: integer
            averageResponse:
              type: integer
          required:
            - count
            - averageResponse
      required:
        - bond
        - reputation
        - validation
      description: The operator's bond in PYUSD base units, the Keelson feedback it
        has in the ERC-8004 Reputation registry, and the TEE countersigns
        recorded for it in the Keelson validation registry.
    Feedback:
      type: object
      properties:
        agentRegistry:
          type: string
        agentId:
          anyOf:
            - type: number
            - type: string
        clientAddress:
          type: string
          description: The reporter, as a CAIP-10 account.
        createdAt:
          type: string
        value:
          type: integer
        valueDecimals:
          type: integer
        tag1:
          type: string
        tag2:
          type: string
        keelson:
          type: object
          properties:
            coverageId:
              type: string
            txHash:
              type: string
          required:
            - coverageId
            - txHash
      required:
        - agentRegistry
        - agentId
        - clientAddress
        - createdAt
        - value
        - valueDecimals
        - tag1
        - tag2
        - keelson
      description: An ERC-8004 off-chain feedback file.
    ValidationRequest:
      type: object
      properties:
        payload:
          type: string
          description: "`0x1901 ‖ domainSeparator ‖ hashStruct(Countersign)`; its
            keccak256 is the request hash."
        countersign:
          type: object
          additionalProperties:
            type: string
          description: The EIP-712 `Countersign` message, as decimal strings.
        alibi:
          type: string
          description: The purchase's Alibi, once logged.
      required:
        - payload
        - countersign
      description: The data of an ERC-8004 validation request Keelson records for a
        countersign.
    Transaction:
      type: object
      properties:
        id:
          type: string
        chainId:
          type: integer
        key:
          type: string
          description: "`<contract>.<function>:<natural id>`."
        contract:
          type: string
        functionName:
          type: string
        status:
          type: string
          enum:
            - pending
            - confirmed
            - reverted
            - rejected
            - dropped
        hash:
          type: string
        nonce:
          type: string
        blockNumber:
          type: string
        blockHash:
          type: string
        gasUsed:
          type: string
        effectiveGasPrice:
          type: string
        latencyMs:
          type: integer
        errorCode:
          type: string
        error:
          type: object
          properties:
            name:
              type: string
            args:
              type: array
              items: {}
          required:
            - name
            - args
        explorerUrl:
          type: string
      required:
        - id
        - chainId
        - key
        - contract
        - functionName
        - status
      description: A transaction the Keelson relayer sent and paid for.
    BondDeposit:
      oneOf:
        - type: object
          properties:
            chainId:
              anyOf:
                - type: number
                  enum:
                    - 421614
                - type: number
                  enum:
                    - 42161
              description: Arbitrum Sepolia (421614) or Arbitrum One (42161).
            kind:
              type: string
              enum:
                - authorization
            from:
              type: string
              pattern: ^0x[0-9a-fA-F]{40}$
            amount:
              type: string
              pattern: ^(0|[1-9]\d{0,77})$
              description: PYUSD base units.
            validAfter:
              type: string
              pattern: ^(0|[1-9]\d{0,77})$
              description: Unix seconds.
            validBefore:
              type: string
              pattern: ^(0|[1-9]\d{0,77})$
              description: Unix seconds.
            salt:
              type: string
              pattern: ^0x[0-9a-fA-F]{64}$
              description: The EIP-3009 nonce is `keccak256(abi.encode(agentId, salt))`, so
                the authorization credits only this agent.
            signature:
              type: string
              maxLength: 8194
              pattern: ^0x([0-9a-fA-F]{2})+$
              description: PYUSD's EIP-3009 `ReceiveWithAuthorization` to the vault, signed by
                `from`.
          required:
            - chainId
            - kind
            - from
            - amount
            - validAfter
            - validBefore
            - salt
            - signature
        - type: object
          properties:
            chainId:
              anyOf:
                - type: number
                  enum:
                    - 421614
                - type: number
                  enum:
                    - 42161
              description: Arbitrum Sepolia (421614) or Arbitrum One (42161).
            kind:
              type: string
              enum:
                - permit
            owner:
              type: string
              pattern: ^0x[0-9a-fA-F]{40}$
              description: The agent's owner or agent wallet.
            amount:
              type: string
              pattern: ^(0|[1-9]\d{0,77})$
              description: PYUSD base units.
            deadline:
              type: string
              pattern: ^(0|[1-9]\d{0,77})$
              description: Unix seconds.
            signature:
              type: string
              maxLength: 8194
              pattern: ^0x([0-9a-fA-F]{2})+$
              description: PYUSD's EIP-2612 permit to the vault.
          required:
            - chainId
            - kind
            - owner
            - amount
            - deadline
            - signature
    BondWithdrawal:
      type: object
      properties:
        chainId:
          anyOf:
            - type: number
              enum:
                - 421614
            - type: number
              enum:
                - 42161
          description: Arbitrum Sepolia (421614) or Arbitrum One (42161).
        amount:
          type: string
          pattern: ^(0|[1-9]\d{0,77})$
          description: PYUSD base units.
        to:
          type: string
          pattern: ^0x[0-9a-fA-F]{40}$
        nonce:
          type: string
          pattern: ^(0|[1-9]\d{0,77})$
          description: "`vault.nonces(signer)`."
        deadline:
          type: string
          pattern: ^(0|[1-9]\d{0,77})$
          description: Unix seconds.
        ownerSignature:
          type: string
          maxLength: 8194
          pattern: ^0x([0-9a-fA-F]{2})+$
          description: The vault's EIP-712 `WithdrawalRequest`, by the agent's owner or
            agent wallet.
      required:
        - chainId
        - amount
        - to
        - nonce
        - deadline
        - ownerSignature
    PayoutAddress:
      type: object
      properties:
        chainId:
          anyOf:
            - type: number
              enum:
                - 421614
            - type: number
              enum:
                - 42161
        merchant:
          type: string
          pattern: ^0x[0-9a-fA-F]{40}$
        payout:
          type: string
          pattern: ^0x[0-9a-fA-F]{40}$
          description: Where slashes and warranties for the merchant are paid.
        nonce:
          type: string
          pattern: ^(0|[1-9]\d{0,77})$
          description: "`vault.nonces(merchant)`."
        deadline:
          type: string
          pattern: ^(0|[1-9]\d{0,77})$
          description: Unix seconds.
        merchantSignature:
          type: string
          maxLength: 8194
          pattern: ^0x([0-9a-fA-F]{2})+$
          description: The vault's EIP-712 `PayoutAddress`, by the merchant (EOA or
            ERC-1271).
      required:
        - chainId
        - merchant
        - payout
        - nonce
        - deadline
        - merchantSignature
  parameters: {}
paths:
  /health:
    get:
      tags:
        - system
      summary: Liveness probe
      responses:
        "200":
          description: The service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                required:
                  - status
  /status:
    get:
      tags:
        - system
      summary: Dependency status
      responses:
        "200":
          description: Status of the service and its dependencies; always 200
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                      - degraded
                  dependencies:
                    type: object
                    properties:
                      db:
                        type: string
                        enum:
                          - up
                          - down
                      kv:
                        type: string
                        enum:
                          - up
                          - down
                      teeA:
                        type: string
                        enum:
                          - up
                          - down
                      teeB:
                        type: string
                        enum:
                          - up
                          - down
                      relayer:
                        type: object
                        properties:
                          status:
                            type: string
                            enum:
                              - up
                              - down
                              - degraded
                          chains:
                            type: array
                            items:
                              type: object
                              properties:
                                chainId:
                                  type: integer
                                status:
                                  type: string
                                  enum:
                                    - up
                                    - down
                                    - degraded
                                address:
                                  type: string
                                balanceWei:
                                  type: string
                                nextNonce:
                                  type: string
                                pending:
                                  type: integer
                                baseFeeWei:
                                  type: string
                              required:
                                - chainId
                                - status
                                - address
                                - pending
                        required:
                          - status
                          - chains
                      log:
                        type: object
                        properties:
                          status:
                            type: string
                            enum:
                              - up
                              - down
                          origins:
                            type: array
                            items:
                              type: object
                              properties:
                                origin:
                                  type: string
                                size:
                                  type: integer
                                checkpointAgeMs:
                                  type: integer
                              required:
                                - origin
                                - size
                                - checkpointAgeMs
                        required:
                          - status
                          - origins
                      paypal:
                        type: object
                        properties:
                          status:
                            type: string
                            enum:
                              - up
                              - down
                          environment:
                            type: string
                            enum:
                              - sandbox
                              - production
                        required:
                          - status
                          - environment
                      webhooks:
                        type: object
                        properties:
                          status:
                            type: string
                            enum:
                              - up
                              - down
                          lastWebhookAgeMs:
                            type: integer
                          lastPollAgeMs:
                            type: integer
                        required:
                          - status
                      anchor:
                        type: object
                        properties:
                          status:
                            type: string
                            enum:
                              - up
                              - down
                          environment:
                            type: string
                            enum:
                              - arbitrum-sepolia
                          size:
                            type: string
                          anchoredAgeMs:
                            type: integer
                        required:
                          - status
                          - environment
                    required:
                      - db
                      - kv
                  version:
                    type: string
                required:
                  - status
                  - dependencies
                  - version
  /v1/events:
    get:
      tags:
        - events
      summary: Stream events
      description: Server-sent events for one channel. Send `Last-Event-ID` to replay
        the events after that id before going live.
      parameters:
        - schema:
            type: string
            description: "`public:<name>`, or the caller's own namespace
              `<base64url(kind:subject)>` with an optional `:<suffix>`."
          required: true
          description: "`public:<name>`, or the caller's own namespace
            `<base64url(kind:subject)>` with an optional `:<suffix>`."
          name: channel
          in: query
        - schema:
            type: string
          required: false
          name: last-event-id
          in: header
      responses:
        "200":
          description: An event stream; each event carries the row id, the channel and a
            JSON payload
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          description: Invalid channel or Last-Event-ID
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Not authenticated
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: The channel belongs to another principal
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Too many concurrent streams for this principal
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/mandates:
    post:
      tags:
        - mandates
      summary: Store a passkey-signed mandate
      description: Verifies the passkey assertion over `M =
        SHA-256("keelson/mandate-challenge/v1" || 0x00 || H_sd || C_m)` and
        stores the mandate as `SIGNED`, or `ACTIVE` when it allows several
        merchants.
      parameters:
        - schema:
            type: string
            minLength: 1
            maxLength: 255
          required: true
          name: idempotency-key
          in: header
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMandate"
      responses:
        "201":
          description: The mandate was stored
          headers:
            location:
              schema:
                type: string
              required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedMandate"
        "401":
          description: Not signed in, or the signature is invalid
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: The passkey is not the signer's
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The mandate is already stored
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: The mandate is invalid
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: The TEE could not issue the mandate
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/mandates/{id}:
    get:
      tags:
        - mandates
      summary: Get a mandate
      description: Renders the card of the signed mandate. The user answered for every
        field when signing, so fields that were ambiguous at compile time show
        with the colors the engine enforces, not gray.
      parameters:
        - schema:
            type: string
          required: true
          name: id
          in: path
      responses:
        "200":
          description: The mandate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mandate"
        "401":
          description: Not signed in
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such mandate for this user
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/paypal/client:
    get:
      tags:
        - paypal
      summary: Get the PayPal client ID
      description: The client ID and environment the JavaScript SDK loads with. The
        client ID is public by design.
      responses:
        "200":
          description: The PayPal client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayPalClient"
        "503":
          description: PayPal is not configured
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/mandates/{id}/hold:
    post:
      tags:
        - mandates
      summary: Hold a mandate's budget
      description: Creates the PayPal `AUTHORIZE` order for the budget of a signed
        mandate, bound to the signed mandate hash by its `custom_id`, and moves
        the mandate to `HOLD_PENDING`. While the mandate waits for approval the
        same order is returned; an order PayPal no longer offers is replaced.
      parameters:
        - schema:
            type: string
          required: true
          name: id
          in: path
        - schema:
            type: string
            minLength: 1
            maxLength: 255
          required: true
          name: idempotency-key
          in: header
      responses:
        "200":
          description: The order the buyer approves
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HoldOrder"
        "401":
          description: Not signed in
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such mandate for this user
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The mandate is not signed, or it holds each purchase separately
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Keelson cannot capture for the mandate's merchant, or PayPal refused
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: PayPal is unavailable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/mandates/{id}/hold/authorize:
    post:
      tags:
        - mandates
      summary: Authorize an approved hold
      description: Authorizes the order stored for the mandate, checks the
        authorization against the signed mandate (amount, currency, `custom_id`,
        payee) and moves the mandate to `ACTIVE`. An authorization that does not
        match is voided.
      parameters:
        - schema:
            type: string
          required: true
          name: id
          in: path
        - schema:
            type: string
            minLength: 1
            maxLength: 255
          required: true
          name: idempotency-key
          in: header
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthorizeHold"
      responses:
        "200":
          description: The mandate is active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizedHold"
        "202":
          description: PayPal holds the authorization as pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingHold"
        "401":
          description: Not signed in
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such mandate for this user
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The mandate is not waiting for its hold, or the order is not its
            order
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: The authorization does not match the mandate, or PayPal refused
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: PayPal is unavailable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/mandates/{id}/holds:
    post:
      tags:
        - mandates
      summary: Hold one cart of a multi-merchant mandate
      description: For a mandate that allows several merchants, creates the PayPal
        `AUTHORIZE` order for exactly one cart, keyed by the request id it will
        be countersigned under. The user approves it like a mandate hold.
      parameters:
        - schema:
            type: string
          required: true
          name: id
          in: path
        - schema:
            type: string
            minLength: 1
            maxLength: 255
          required: true
          name: idempotency-key
          in: header
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePurchaseHold"
      responses:
        "201":
          description: The order the buyer approves
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseHoldOrder"
        "401":
          description: No valid access token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: The caller is not the mandate's agent
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such mandate
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The mandate holds its whole budget, is not active, or the request
            id is already used
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: The cart is outside the mandate, its open cart holds with this one
            exceed the remaining budget, Keelson cannot capture for it, or
            PayPal refused
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: PayPal is unavailable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/mandates/{id}/holds/{requestId}/authorize:
    post:
      tags:
        - mandates
      summary: Authorize an approved cart hold
      description: Authorizes the order stored for the request and checks the
        authorization against it (amount, currency, `custom_id`, payee). An
        authorization that does not match is voided.
      parameters:
        - schema:
            type: string
          required: true
          name: id
          in: path
        - schema:
            type: string
          required: true
          name: requestId
          in: path
        - schema:
            type: string
            minLength: 1
            maxLength: 255
          required: true
          name: idempotency-key
          in: header
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthorizePurchaseHold"
      responses:
        "200":
          description: The cart is held
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizedPurchaseHold"
        "202":
          description: PayPal holds the authorization as pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizedPurchaseHold"
        "401":
          description: Not signed in
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such hold for this user
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The mandate is not active, the hold is not pending, or the order is
            not its order
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: The authorization does not match the hold, or PayPal refused
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: PayPal is unavailable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/mandates/{id}/revoke:
    post:
      tags:
        - mandates
      summary: Revoke a mandate
      description: Stops new countersigns at once, voids the PayPal hold and moves the
        mandate to `REVOKED`. While a countersigned purchase may still be
        captured, the void waits for it and the revocation completes in the
        background.
      parameters:
        - schema:
            type: string
          required: true
          name: id
          in: path
        - schema:
            type: string
            minLength: 1
            maxLength: 255
          required: true
          name: idempotency-key
          in: header
      responses:
        "200":
          description: The mandate is revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevokedMandate"
        "202":
          description: The mandate is being revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevokingMandate"
        "401":
          description: Not signed in
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such mandate for this user
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The mandate has already ended
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: PayPal refused the void
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: PayPal is unavailable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/mandates/compile:
    post:
      tags:
        - mandates
      summary: Compile a mandate from a shopping request
      description: Two models compile the request independently; fields they disagree
        on or the request leaves unstated come back ambiguous, and a third model
        checks the rendered card against the request. Limited to 10 requests a
        minute per user.
      parameters:
        - schema:
            type: string
            minLength: 1
            maxLength: 255
          required: true
          name: idempotency-key
          in: header
        - schema:
            type: string
            maxLength: 128
            description: The app's opaque device id, recorded as `risk_data.device_fp`.
              Required.
          required: false
          description: The app's opaque device id, recorded as `risk_data.device_fp`.
            Required.
          name: keelson-device
          in: header
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompileMandate"
      responses:
        "200":
          description: The draft mandate and its card
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompiledMandate"
        "401":
          description: Not signed in
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: The passkey is not the user's
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The user has no passkey to sign with
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: The prompt is too long (`prompt-too-long`), the device id is
            missing (`device-required`), the compilations conflict
            (`compile-conflict`), the request leaves out a value a mandate needs
            (`compile-needs-input`) or cannot become a mandate
            (`compile-unresolved`); `fields` names what to ask the user
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Too many compilations
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "502":
          description: The models failed to compile the request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: Inputs a mandate needs are not available yet
            (`compile-unavailable`; `missing` names them), or the rate limit
            store is unreachable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/countersign:
    post:
      tags:
        - tee
      summary: Countersign a cart
      description: Sends the cart to the TEE legs in order and returns the
        countersignatures only when both agree. A DENY is countersigned too.
      parameters:
        - schema:
            type: string
            minLength: 1
            maxLength: 255
          required: true
          name: idempotency-key
          in: header
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CountersignRequest"
      responses:
        "200":
          description: The decision and its countersignatures
          headers:
            Keelson-Countersign-Mode:
              schema:
                type: string
                enum:
                  - 2of2
                  - degraded
                description: "`degraded` when only one TEE signed; the same as `mode` in the
                  body."
              required: true
              description: "`degraded` when only one TEE signed; the same as `mode` in the
                body."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Countersigned"
        "202":
          description: Countersigned, and a step of the purchase is still pending;
            `Location` is the purchase, which finishes on its own
          headers:
            Location:
              schema:
                type: string
              required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Countersigned"
        "401":
          description: A leg refused the agent's authority
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such mandate
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The mandate is not active, the evidence root is not stored for it
            or already binds another purchase, or the request was already used
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          description: A leg refused the request as too large
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: The request is invalid, the authorization is not this purchase's
            hold, the cart is not the one held for this request, the evidence
            holds another cart, or its Channel3 observation is not usable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Too many countersigns for this mandate
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "502":
          description: The legs disagree, or a signer is not registered
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: A leg needed to sign, or PayPal, is unavailable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/purchases/{id}:
    get:
      tags:
        - purchases
      summary: A purchase
      description: "The purchase's state: its log index, its coverage and its capture
        once each is recorded. Readable by the mandate's owner and by the client
        that asked for the countersign."
      parameters:
        - schema:
            type: string
            pattern: ^[0-7][0-9A-HJKMNP-TV-Z]{25}$
          required: true
          name: id
          in: path
      responses:
        "200":
          description: The purchase
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Purchase"
        "404":
          description: No such purchase, or not the caller's
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/evidence:
    post:
      tags:
        - evidence
      summary: Store sealed evidence
      description: Stores what the agent saw at decision time for an active mandate.
        The manifest is rebuilt from the items and must match, every item has
        its own salt, no public item may still hold an email address or phone
        number, and every `.original` must open with the evidence identity. A
        countersign may only bind a stored root, once.
      parameters:
        - schema:
            type: string
            minLength: 1
            maxLength: 255
          required: true
          name: idempotency-key
          in: header
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvidenceUpload"
      responses:
        "201":
          description: Stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  evidenceRoot:
                    type: string
                    pattern: ^0x[0-9a-f]{64}$
                required:
                  - evidenceRoot
        "404":
          description: No such mandate
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The mandate is not active, holds the most bundles it may, or the
            root is stored for another mandate
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          description: The bundle is larger than 16 MiB
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: The items do not build the manifest, a public item holds PII, or an
            original does not open
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Too many uploads for this mandate
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/evidence/{root}:
    get:
      tags:
        - evidence
      summary: Read an evidence manifest
      description: "The public manifest of a stored bundle: salted leaves only."
      parameters:
        - schema:
            type: string
            pattern: ^0x[0-9a-f]{64}$
          required: true
          name: root
          in: path
      responses:
        "200":
          description: The manifest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceManifest"
        "404":
          description: No such bundle
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/evidence/{root}/items/{index}:
    get:
      tags:
        - evidence
      summary: Disclose one evidence item
      description: One item with its content hash, salt and inclusion proof, for an
        arbiter. Every disclosure is recorded with its `reason`. An `.original`
        item stays age ciphertext unless `decrypt=1` is sent with the
        `evidence:decrypt` scope.
      parameters:
        - schema:
            type: string
            pattern: ^0x[0-9a-f]{64}$
          required: true
          name: root
          in: path
        - schema:
            type:
              - integer
              - "null"
            minimum: 0
            maximum: 19
          required: true
          name: index
          in: path
        - schema:
            type: string
            minLength: 1
            maxLength: 256
            description: Why the item is opened, such as the dispute it serves.
          required: true
          description: Why the item is opened, such as the dispute it serves.
          name: reason
          in: query
        - schema:
            type: string
            enum:
              - "1"
          required: false
          name: decrypt
          in: query
      responses:
        "200":
          description: The item and its disclosure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DisclosedEvidence"
        "403":
          description: Decrypting needs the `evidence:decrypt` scope
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such bundle or item
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: The item is not an `.original`, or it does not open with the
            evidence identity
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: The evidence identity is not configured
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/observations/channel3:
    post:
      tags:
        - evidence
      summary: Observe a product through Channel3
      description: "Asks Channel3 about the product page once (live fetch if its data
        is older than an hour, eight seconds at most), compares variant, price,
        availability and brand with what the agent saw, stores the observation
        and queues RFC 3161 tokens over its hash. Channel3 is third-party
        testimony: it is shown in the countersigned trace and never changes a
        decision."
      parameters:
        - schema:
            type: string
            minLength: 1
            maxLength: 255
          required: true
          name: idempotency-key
          in: header
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Channel3ObservationRequest"
      responses:
        "201":
          description: The observation and its sealed evidence item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel3Observation"
        "404":
          description: No such mandate
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The mandate is not active
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: The request is invalid
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Too many observations for this mandate, or today for this client
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: Channel3 is not configured, or the rate limit store is unreachable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/observations/channel3/{id}:
    get:
      tags:
        - evidence
      summary: Read a Channel3 observation
      description: The stored observation document and its hash; `GET
        /v1/timestamps/{content_hash}` serves its RFC 3161 tokens. Only the
        client that asked for it may read it.
      parameters:
        - schema:
            type: string
            minLength: 26
            maxLength: 26
          required: true
          name: id
          in: path
      responses:
        "200":
          description: The observation
          content:
            application/json:
              schema:
                type: object
                properties:
                  document:
                    type: object
                    additionalProperties: {}
                    description: The `keelson.channel3.observation/1` document; its JCS bytes hash
                      to `content_hash`.
                  content_hash:
                    type: string
                    pattern: ^0x[0-9a-f]{64}$
                required:
                  - document
                  - content_hash
        "404":
          description: No such observation
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/tee/attestations:
    get:
      tags:
        - tee
      summary: Attested TEE signers
      description: The signers whose countersignatures are accepted, each with the
        attestation it was admitted from, and the measurements the deployment
        publishes. A verifier checks the attestations itself.
      responses:
        "200":
          description: The admitted signers and the published measurements
          content:
            application/json:
              schema:
                type: object
                properties:
                  legs:
                    type: array
                    items:
                      $ref: "#/components/schemas/TeeLeg"
                  measurements:
                    type: object
                    properties:
                      engineBuildId:
                        type: string
                      tdx:
                        type: array
                        items:
                          type: string
                      nitro:
                        type: array
                        items:
                          type: string
                      provenance:
                        type: string
                        description: Where the Sigstore build provenance attested measurements.json is
                          published; `gh attestation verify` checks it.
                    required:
                      - engineBuildId
                      - tdx
                      - nitro
                      - provenance
                required:
                  - legs
                  - measurements
  /v1/timestamps/{hash}:
    get:
      tags:
        - timestamps
      summary: RFC 3161 timestamps of a hash
      description: The RFC 3161 tokens two independent TSAs issued over a log leaf
        hash (or another stamped hash). Each token's message imprint is the hash
        itself, so `openssl ts -verify -digest <hash>` checks it.
      parameters:
        - schema:
            type: string
            pattern: ^[0-9a-f]{64}$
            description: The SHA-256 hash, 64 lowercase hex digits.
          required: true
          description: The SHA-256 hash, 64 lowercase hex digits.
          name: hash
          in: path
      responses:
        "200":
          description: The tokens issued so far and the TSAs still pending
          content:
            application/json:
              schema:
                type: object
                properties:
                  hash:
                    type: string
                  stamps:
                    type: array
                    items:
                      $ref: "#/components/schemas/Timestamp"
                  pending:
                    type: array
                    items:
                      type: string
                      enum:
                        - digicert
                        - sigstore
                        - freetsa
                        - sectigo
                required:
                  - hash
                  - stamps
                  - pending
        "404":
          description: The hash was never queued
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/alibis/{id}.pdf:
    get:
      tags:
        - alibis
