        "503":
          description: Alerts are not configured
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/alerts/emails:
    get:
      operationId: listAlertEmails
      tags:
        - alerts
      summary: List the emails sent to you
      description: Every alert email composed for you, newest first, with what it reported.
      security:
        - session: []
      responses:
        "200":
          description: The emails
          content:
            application/json:
              schema:
                type: object
                properties:
                  emails:
                    type: array
                    items:
                      $ref: "#/components/schemas/SentEmail"
                required:
                  - emails
        "401":
          description: Not signed in
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/mandates/compile:
    post:
      operationId: compileMandate
      tags:
        - mandates
      summary: Compile a mandate from a shopping request
      description: Two models compile the request independently; fields they disagree
        on or the request leaves unstated come back ambiguous, and a third model
        checks the rendered card against the request. Limited to 10 requests a
        minute per user.
      security:
        - session: []
      parameters:
        - schema:
            type: string
            minLength: 1
            maxLength: 255
          required: true
          name: idempotency-key
          in: header
        - schema:
            type: string
            maxLength: 128
            description: The app's opaque device id, recorded as `risk_data.device_fp`.
              Required.
          required: false
          description: The app's opaque device id, recorded as `risk_data.device_fp`.
            Required.
          name: keelson-device
          in: header
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompileMandate"
      responses:
        "200":
          description: The draft mandate and its card
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompiledMandate"
        "401":
          description: Not signed in
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: The passkey is not the user's
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The user has no passkey to sign with
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: The prompt is too long (`prompt-too-long`), the device id is
            missing (`device-required`), the compilations conflict
            (`compile-conflict`), the request leaves out a value a mandate needs
            (`compile-needs-input`) or cannot become a mandate
            (`compile-unresolved`); `fields` names what to ask the user
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Too many compilations
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "502":
          description: The models failed to compile the request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: Inputs a mandate needs are not available yet
            (`compile-unavailable`; `missing` names them), or the rate limit
            store is unreachable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/countersign:
    post:
      operationId: countersign
      tags:
        - tee
      summary: Countersign a cart
      description: "Sends the cart to the TEE legs in order and returns the
        countersignatures only when both agree. A DENY is countersigned too. An
        app acting for a user (`purchases:write`) countersigns only under a
        mandate that user approved for it; under a mandate of Keelson's hosted
        operator it sends `mandateId` and Keelson closes the mandate with that
        operator's key over the request id and this cart, and nothing else. A
        cart is bought once per mandate: while a purchase of the same cart is in
        flight, or for ten minutes after it was captured, another request for it
        is answered `409 purchase-exists` with that purchase's id, whatever its
        request id, evidence or `Idempotency-Key`. Retrying after a lost answer
        is therefore safe; to buy the same cart again on purpose, name that
        purchase in `repeatOf`."
      security:
        - oauth2:
            - countersign:write
        - oauth2:
            - purchases:write
      parameters:
        - schema:
            type: string
            minLength: 1
            maxLength: 255
          required: true
          name: idempotency-key
          in: header
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CountersignRequest"
      responses:
        "200":
          description: The decision and its countersignatures
          headers:
            Keelson-Countersign-Mode:
              schema:
                type: string
                enum:
                  - 2of2
                  - degraded
                description: "`degraded` when only one TEE signed; the same as `mode` in the
                  body."
              required: true
              description: "`degraded` when only one TEE signed; the same as `mode` in the
                body."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Countersigned"
        "202":
          description: Countersigned, and a step of the purchase is still pending;
            `Location` is the purchase, which finishes on its own
          headers:
            Location:
              schema:
                type: string
              required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Countersigned"
        "401":
          description: A leg refused the agent's authority
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such mandate of an operator this client linked, or that the user
            approved for this app
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The mandate is not active, the evidence root is not stored for it
            or already binds another purchase, the request was already used, or
            the same cart is already being bought (`purchase-exists`, with its
            `purchaseId`)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          description: A leg refused the request as too large
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: The request is invalid, the purchase unit's amount does not
            reconcile with the cart (`invalid-amount`), the authorization is not
            this purchase's hold, the cart is not the one held for this request,
            the evidence holds another cart or another checkout amount or
            reference rates Keelson did not issue, its Channel3 observation is
            not usable, its WebFact is not this purchase's, or a live store is
            not the website the mandate allows
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Too many countersigns for this mandate
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "502":
          description: The legs disagree, or a signer is not registered
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: A leg needed to sign, or PayPal, is unavailable, or the hosted
            operator's key is not configured
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/live-purchases:
    get:
      operationId: listLivePurchases
      tags:
        - purchases
      summary: Live purchases
      description: Purchases the shopping agent made with real money at real stores'
        own checkouts, and the carts Keelson denied there before the payment for
        Keelson's own test users, newest first. Each has a public Alibi; a paid
        one names the PayPal transaction it paid. Keelson countersigned and
        logged them; it covers none of them.
      responses:
        "200":
          description: The live purchases
          content:
            application/json:
              schema:
                type: object
                properties:
                  purchases:
                    type: array
                    items:
                      $ref: "#/components/schemas/LivePurchase"
                required:
                  - purchases
  /v1/purchases/{id}/paypal-transaction:
    put:
      operationId: recordPayPalTransaction
      tags:
        - purchases
      summary: Record a live purchase's PayPal transaction
      description: "For a purchase countersigned with `live`, once its Alibi is
        issued: the PayPal transaction id of the buyer's payment at the store,
        as PayPal reported it on its confirmation. Recorded once; the Alibi
        carries it from then on, marked as not signed. Only the client that
        asked for the countersign records it."
      security:
        - oauth2:
            - countersign:write
      parameters:
        - schema:
            type: string
            pattern: ^[0-7][0-9A-HJKMNP-TV-Z]{25}$
          required: true
          name: id
          in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayPalTransaction"
      responses:
        "200":
          description: The purchase
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Purchase"
        "404":
          description: No such purchase of this client
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The purchase is not live, its Alibi is not issued yet, or another
            transaction id is recorded
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: The order's payee is not one the mandate allows, or the conversion
            is not the countersigned amount at PayPal's rate, does not use the
            reference rate the evidence binds, or is over the mandate's spread.
            The transaction id is recorded without them.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/purchases/{id}:
    get:
      operationId: getPurchase
      tags:
        - purchases
      summary: A purchase
      description: "The purchase's state: its log index, its coverage and its capture
        once each is recorded. Readable by the mandate's owner and by the client
        that asked for the countersign; an app acting for a user, only for that
        user."
      security:
        - session: []
        - oauth2: []
      parameters:
        - schema:
            type: string
            pattern: ^[0-7][0-9A-HJKMNP-TV-Z]{25}$
          required: true
          name: id
          in: path
      responses:
        "200":
          description: The purchase
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Purchase"
        "404":
          description: No such purchase, or not the caller's
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/purchases/{id}/card:
    get:
      operationId: getPurchaseCard
      tags:
        - purchases
      summary: The single-use card of a card purchase
      description: "For the agent's browser: a one-minute link to the card issuer's
        hosted page showing the card's number, expiry and code. Open it in the
        browser session that pays; never put its contents in a model's context
        or a log. Only the client that asked for the countersign reads it, and
        only while the card is open."
      security:
        - oauth2:
            - countersign:write
      parameters:
        - schema:
            type: string
            pattern: ^[0-7][0-9A-HJKMNP-TV-Z]{25}$
          required: true
          name: id
          in: path
      responses:
        "200":
          description: The card's hosted page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseCard"
        "404":
          description: No such card purchase of this client
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The card is not open
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/evidence:
    post:
      operationId: storeEvidence
      tags:
        - evidence
      summary: Store sealed evidence
      description: Stores what the agent saw at decision time for an active mandate of
        an operator this client linked or, for an app acting for a user, one
        that user approved for the app. The manifest is rebuilt from the items
        and must match, every item has its own salt, no public item may still
        hold an email address or phone number, and every `.original` must open
        with the evidence identity. A countersign may only bind a stored root,
        once.
      security:
        - oauth2:
            - evidence:write
      parameters:
        - schema:
            type: string
            minLength: 1
            maxLength: 255
          required: true
          name: idempotency-key
          in: header
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvidenceUpload"
      responses:
        "201":
          description: Stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  evidenceRoot:
                    type: string
                    pattern: ^0x[0-9a-f]{64}$
                required:
                  - evidenceRoot
        "404":
          description: No such mandate of an operator this client linked
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The mandate is not active, holds the most bundles it may, or the
            root is stored for another mandate
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          description: The bundle is larger than 16 MiB
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: The items do not build the manifest, a public item holds PII, or an
            original does not open
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Too many uploads for this mandate
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/evidence/{root}:
    get:
      operationId: getEvidenceManifest
      tags:
        - evidence
      summary: Read an evidence manifest
      description: "The public manifest of a stored bundle: salted leaves only."
      parameters:
        - schema:
            type: string
            pattern: ^0x[0-9a-f]{64}$
          required: true
          name: root
          in: path
      responses:
        "200":
          description: The manifest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceManifest"
        "404":
          description: No such bundle
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/evidence/{root}/items/{index}:
    get:
      operationId: discloseEvidenceItem
      tags:
        - evidence
      summary: Disclose one evidence item
      description: One item with its content hash, salt and inclusion proof, for an
        arbiter. Every disclosure is recorded with its `reason`. An `.original`
        item stays age ciphertext unless `decrypt=1` is sent with the
        `evidence:decrypt` scope.
      security:
        - oauth2:
            - evidence:disclose
      parameters:
        - schema:
            type: string
            pattern: ^0x[0-9a-f]{64}$
          required: true
          name: root
          in: path
        - schema:
            type:
              - integer
              - "null"
            minimum: 0
            maximum: 25
          required: true
          name: index
          in: path
        - schema:
            type: string
            minLength: 1
            maxLength: 256
            description: Why the item is opened, such as the dispute it serves.
          required: true
          description: Why the item is opened, such as the dispute it serves.
          name: reason
          in: query
        - schema:
            type: string
            enum:
              - "1"
          required: false
          name: decrypt
          in: query
      responses:
        "200":
          description: The item and its disclosure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DisclosedEvidence"
        "403":
          description: Decrypting needs the `evidence:decrypt` scope
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such bundle or item
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: The item is not an `.original`, or it does not open with the
            evidence identity
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: The evidence identity is not configured
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/observations/channel3:
    post:
      operationId: observeChannel3
      tags:
        - evidence
      summary: Observe a product through Channel3
      description: "Asks Channel3 about the product page once (live fetch if its data
        is older than an hour, eight seconds at most), compares variant, price,
        availability and brand with what the agent saw, stores the observation
        and queues RFC 3161 tokens over its hash. Channel3 is third-party
        testimony: it is shown in the countersigned trace and never changes a
        decision."
      security:
        - oauth2:
            - countersign:write
      parameters:
        - schema:
            type: string
            minLength: 1
            maxLength: 255
          required: true
          name: idempotency-key
          in: header
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Channel3ObservationRequest"
      responses:
        "201":
          description: The observation and its sealed evidence item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel3Observation"
        "404":
          description: No such mandate of an operator this client linked
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The mandate is not active
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: The request is invalid
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Too many observations for this mandate, or today for this client
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: Channel3 is not configured, or the rate limit store is unreachable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/observations/channel3/{id}:
    get:
      operationId: getChannel3Observation
      tags:
        - evidence
      summary: Read a Channel3 observation
      description: The stored observation document and its hash; `GET
        /v1/timestamps/{content_hash}` serves its RFC 3161 tokens. Only the
        client that asked for it may read it.
      security:
        - oauth2:
            - countersign:write
      parameters:
        - schema:
            type: string
            minLength: 26
            maxLength: 26
          required: true
          name: id
          in: path
      responses:
        "200":
          description: The observation
          content:
            application/json:
              schema:
                type: object
                properties:
                  document:
                    type: object
                    additionalProperties: {}
                    description: The `keelson.channel3.observation/1` document; its JCS bytes hash
                      to `content_hash`.
                  content_hash:
                    type: string
                    pattern: ^0x[0-9a-f]{64}$
                required:
                  - document
                  - content_hash
        "404":
          description: No such observation
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/fx/reference/{base}:
    get:
      operationId: getFxReference
      tags:
        - purchases
      summary: Reference exchange rates
      description: Mid-market rates from the merchant's currency to every other one,
        from ExchangeRate-API (Rates By Exchange Rate API,
        https://www.exchangerate-api.com), at most 48 hours old. The agent binds
        them into a purchase's evidence as an `api.fx_reference` item,
        `commitReference` of this answer, which a countersign accepts only for
        references the API issued in the last 6 hours. The pay-click gate checks
        the rate PayPal converts the charge at against them, within the
        mandate's `fx.max_spread_bps`.
      security:
        - oauth2:
            - countersign:write
      parameters:
        - schema:
            type: string
            enum:
              - AUD
              - BRL
              - CAD
              - CNY
              - CZK
              - DKK
              - EUR
              - HKD
              - HUF
              - ILS
              - JPY
              - MYR
              - MXN
              - TWD
              - NZD
              - NOK
              - PHP
              - PLN
              - GBP
              - SGD
              - SEK
              - CHF
              - THB
              - USD
          required: true
          name: base
          in: path
      responses:
        "200":
          description: The rates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FxReference"
        "503":
          description: "No current reference rates: a converted charge is then never paid"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/observations/web-fact:
    post:
      operationId: notarizeWebFact
      tags:
        - evidence
      summary: Notarize a product endpoint with TLSNotary
      description: Fetches the endpoint once over TLS with leg A as the TLSNotary
        notary (MPC-TLS, or Proxy-TLS when MPC-TLS fails), commits to the body
        or to the object around `anchor`, and returns the EIP-712 `WebFact` leg
        A signed with its attested key. Runs apart from any countersign and
        never delays one. An app acting for a user needs `evidence:write`.
      security:
        - oauth2:
            - countersign:write
        - oauth2:
            - evidence:write
      parameters:
        - schema:
            type: string
            minLength: 1
            maxLength: 255
          required: true
          name: idempotency-key
          in: header
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebFactRequest"
      responses:
        "201":
          description: The signed WebFact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebFact"
        "422":
          description: The URL is refused, or its response is not a 200 the notary accepts
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Too many WebFacts today for this client
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "502":
          description: The session failed, or its WebFact did not verify
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: No prover is configured, leg A has no admitted signer, or the rate
            limit store is unreachable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/purchases/{id}/chargeback:
    post:
      operationId: chargeBackPurchase
      tags:
        - purchases
      summary: Charge back a card purchase
      description: "Files a chargeback through the card issuer over a card purchase's
        settled transaction, with the purchase's Alibi as the cardholder's
        evidence: Visa 13.1 or Mastercard 4853 for an item not received, Visa
        13.3 or 4853 for one not as described, Visa 10.4 or Mastercard 4837 for
        a charge the user did not authorize. What the chargeback returns is
        subtracted from any bond claim over the purchase, and no bond claim is
        paid while it is open. Only the mandate's owner files it, one at a
        time."
      security:
        - session: []
      parameters:
        - schema:
            type: string
            pattern: ^[0-7][0-9A-HJKMNP-TV-Z]{25}$
          required: true
          name: id
          in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  enum:
                    - not_received
                    - not_as_described
                    - unauthorized
                note:
                  type: string
                  maxLength: 1000
                  default: ""
                amountMinor:
                  type: string
                  pattern: ^[1-9][0-9]{0,15}$
                  description: Defaults to the settled amount, and cannot exceed it.
              required:
                - reason
              additionalProperties: false
      responses:
        "201":
          description: Filed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardChargeback"
        "404":
          description: No such card purchase of this user
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The card is not settled yet, or a chargeback is already open
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: The amount is above what was settled
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: The card issuer is not configured or unavailable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/tee/attestations:
    get:
      operationId: listTeeAttestations
      tags:
        - tee
      summary: Attested TEE signers
      description: The signers whose countersignatures are accepted, each with the
        attestation it was admitted from, and the measurements the deployment
        publishes. A verifier checks the attestations itself.
      responses:
        "200":
          description: The admitted signers and the published measurements
          content:
            application/json:
              schema:
                type: object
                properties:
                  legs:
                    type: array
                    items:
                      $ref: "#/components/schemas/TeeLeg"
                  measurements:
                    type: object
                    properties:
                      engineBuildId:
                        type: string
                      tdx:
                        type: array
                        items:
                          type: string
                      nitro:
                        type: array
                        items:
                          type: string
                      provenance:
                        type: string
                        description: Where the Sigstore build provenance attested measurements.json is
                          published; `gh attestation verify` checks it.
                    required:
                      - engineBuildId
                      - tdx
                      - nitro
                      - provenance
                required:
                  - legs
                  - measurements
  /v1/timestamps/{hash}:
    get:
      operationId: getTimestamps
      tags:
        - timestamps
      summary: RFC 3161 timestamps of a hash
      description: The RFC 3161 tokens two independent TSAs issued over a log leaf
        hash (or another stamped hash). Each token's message imprint is the hash
        itself, so `openssl ts -verify -digest <hash>` checks it.
      parameters:
        - schema:
            type: string
            pattern: ^[0-9a-f]{64}$
            description: The SHA-256 hash, 64 lowercase hex digits.
          required: true
          description: The SHA-256 hash, 64 lowercase hex digits.
          name: hash
          in: path
      responses:
        "200":
          description: The tokens issued so far and the TSAs still pending
          content:
            application/json:
              schema:
                type: object
                properties:
                  hash:
                    type: string
                  stamps:
                    type: array
                    items:
                      $ref: "#/components/schemas/Timestamp"
                  pending:
                    type: array
                    items:
                      type: string
                      enum:
                        - digicert
                        - sigstore
                        - freetsa
                        - sectigo
                required:
                  - hash
                  - stamps
                  - pending
        "404":
          description: The hash was never queued
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/alibis/{id}.pdf:
    get:
      operationId: getAlibiPdf
      tags:
        - alibis
      summary: An Alibi as a PDF/A-3b
      description: A one-page PDF/A-3b summary of the Alibi with a QR to its verify
        page and the bundle embedded as `<id>.alibi`. Same readers, and the same
        public copy, as the bundle.
      parameters:
        - schema:
            type: string
            pattern: ^[0-7][0-9A-HJKMNP-TV-Z]{25}$
            description: "The Alibi id: the purchase's ULID."
          required: true
          description: "The Alibi id: the purchase's ULID."
          name: id
          in: path
      responses:
        "200":
          description: The PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "304":
          description: The PDF has not changed
        "404":
          description: No Alibi with this id that the caller may read
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/alibis/{id}.cose:
    get:
      operationId: getAlibiStatement
      tags:
        - alibis
      summary: An Alibi as an IETF SCITT transparent statement
      description: The Alibi's COSE_Sign1 signed statement (RFC 9943) with its log
        receipt (RFC 9942, label 394) and, once stamped, its RFC 3161 token (RFC
        9921, label 270). A v1 Alibi's is the bridge statement that carries its
        countersigned facts, once there is one. The statement holds no personal
        data; anyone may read it.
      parameters:
        - schema:
            type: string
            pattern: ^[0-7][0-9A-HJKMNP-TV-Z]{25}$
            description: "The Alibi id: the purchase's ULID."
          required: true
          description: "The Alibi id: the purchase's ULID."
          name: id
          in: path
      responses:
        "200":
          description: The transparent statement
          content:
            application/scitt-statement+cose:
              schema:
                type: string
                format: binary
        "404":
          description: No Alibi with this id that the caller may read
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/alibis/{id}:
    get:
      operationId: getAlibi
      tags:
        - alibis
      summary: An Alibi bundle
      description: "The purchase's Alibi: its RFC 8785 bundle, readable by the
        mandate's user or, with `alibis:read`, by the client that uploaded the
        purchase's evidence; the Alibi of a live purchase, once its PayPal
        transaction is recorded, by anyone. Anyone else gets its public copy,
        whose mandate withholds the user's login id and risk data: their salted
        digests stay in the signed payload, so the copy verifies the same. It
        grows as timestamps, the capture and the on-chain anchor arrive; earlier
        sections never change."
      parameters:
        - schema:
            type: string
            pattern: ^[0-7][0-9A-HJKMNP-TV-Z]{25}$
            description: "The Alibi id: the purchase's ULID."
          required: true
          description: "The Alibi id: the purchase's ULID."
          name: id
          in: path
        - schema:
            type: string
            enum:
              - "1"
              - "2"
            description: "`2`: the Alibi as an IETF SCITT transparent statement (RFC 9943).
              A v1 Alibi is served as the bridge statement that carries its
              countersigned facts, once there is one."
          required: false
          description: "`2`: the Alibi as an IETF SCITT transparent statement (RFC 9943).
            A v1 Alibi is served as the bridge statement that carries its
            countersigned facts, once there is one."
          name: version
          in: query
      responses:
        "200":
          description: The bundle
          content:
            application/vnd.keelson.alibi.v1+json:
              schema:
                type: string
                format: binary
            application/vnd.keelson.alibi.v2+json:
              schema:
                type: string
                format: binary
        "304":
          description: The bundle has not changed
        "404":
          description: No Alibi with this id that the caller may read
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/alibis/verify:
    post:
      operationId: verifyAlibi
      tags:
        - alibis
      summary: Verify an Alibi
      description: Runs the browser verifier's algorithm on an Alibi bundle against
        the pinned trust roots and a public Arbitrum RPC. No authentication; the
        bundle is not stored.
      requestBody:
        required: true
        content:
          application/vnd.keelson.alibi.v1+json:
            schema:
              type: string
              format: binary
          application/vnd.keelson.alibi.v2+json:
            schema:
              type: string
              format: binary
          application/scitt-statement+cose:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: "The report; with `Accept: application/eat-ucs+json`, the same
            appraisal as an EAT Attestation Result (draft-ietf-rats-ear)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlibiReport"
            application/eat-ucs+json:
              schema:
                $ref: "#/components/schemas/AlibiEar"
        "400":
          description: Not an Alibi bundle; `pointer` names the failing value
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          description: The body is over 1 MiB
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "415":
          description: The body is not an Alibi bundle's media type
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/alibis/{id}/receipt:
    get:
      operationId: getAlibiReceipt
      tags:
        - alibis
      summary: The public receipt of an Alibi
      description: "What the public log already publishes about an Alibi: its leaf,
        inclusion proof, anchor and timestamps. No authentication."
      parameters:
        - schema:
            type: string
            pattern: ^[0-7][0-9A-HJKMNP-TV-Z]{25}$
            description: "The Alibi id: the purchase's ULID."
          required: true
          description: "The Alibi id: the purchase's ULID."
          name: id
          in: path
      responses:
        "200":
          description: The receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlibiReceipt"
        "404":
          description: No Alibi with this id that the caller may read
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/anonymous-mandates/{mandateHash}:
    get:
      operationId: getAnonymousMandate
      tags:
        - mandates
      summary: Proof that a registered user signed a mandate
      description: "The C3 `anonymous_mandate` zero-knowledge proof of the mandate
        whose passkey challenge is `mandateHash`, the `mandateHash` of its
        countersigns: a passkey in Keelson's registered-user tree signed it, and
        the mandate's commitment names that passkey. It shows neither the user
        nor the key, so it needs no authentication. Verify it with bb.js against
        the C3 key or with `eth_call` on `verifier`, and check that
        `user_set_root` is published in the `RegisteredUserSet` contract, as
        `verifyAnonymousMandate` in `@keelson/alibi/verify` does."
      parameters:
        - schema:
            type: string
            pattern: ^0x[0-9a-f]{64}$
          required: true
          name: mandateHash
          in: path
      responses:
        "200":
          description: The proof
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnonymousMandate"
        "404":
          description: No proof for this mandate yet
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/anonymous-purchases/{id}:
    get:
      operationId: getAnonymousPurchase
      tags:
        - purchases
      summary: Proof that a purchase was within a mandate a registered user signed
      description: "One zero-knowledge proof that composes the purchase's C1 proof
        (the countersigned cart satisfies the mandate) with its mandate's C3
        proof (a registered user's passkey, the one the mandate names, signed
        it) by recursion. It shows neither the mandate nor the user. Its public
        inputs are the countersign's cart fields, `C_m` and `M`, which link the
        purchases of one mandate: anyone holding the purchase id can read it."
      parameters:
        - schema:
            type: string
            pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
          required: true
          name: id
          in: path
      responses:
        "200":
          description: The proof
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnonymousPurchase"
        "404":
          description: No composed proof for this purchase yet
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/user-set/roots/{root}:
    get:
      operationId: getUserSetRoot
      tags:
        - mandates
      summary: A root of the registered-user tree
      description: "Whether `root` is, or was, the root of Keelson's registered-user
        tree: the Poseidon2 Merkle tree of every registered passkey's
        `user_key_hash`. A C3 proof under any root listed here was made by a
        registered user, who is hidden among the `size` users of that root.
        Roots stay valid after a passkey is removed. Keelson's relayer publishes
        every root to the `RegisteredUserSet` contract, which is what a verifier
        trusts; this route is a convenience."
      parameters:
        - schema:
            type: string
            pattern: ^0x[0-9a-f]{64}$
          required: true
          name: root
          in: path
      responses:
        "200":
          description: The root
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSetRoot"
        "404":
          description: No such root
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/engine-proofs/{id}:
    get:
      operationId: getEngineProof
      tags:
        - purchases
      summary: SP1 proof of a purchase's engine evaluation
      description: For a disputed purchase, an SP1 Groth16 proof that the engine's own
        canonicalizer and Cedar evaluation, run again in the SP1 zkVM over the
        purchase's stored inputs, give the `evalHash` both TEE legs signed, and
        the transaction that verified it on chain through Succinct's SP1
        verifier gateway. It holds only hashes and the proof, so it needs no
        authentication.
      parameters:
        - schema:
            type: string
            pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
          required: true
          name: id
          in: path
      responses:
        "200":
          description: The proof
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EngineProof"
        "404":
          description: No dispute over this purchase, or no inputs kept to prove it
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/disputes/{id}:
    get:
      operationId: getDispute
      tags:
        - Disputes
      summary: A dispute's attribution
      description: "Where a PayPal dispute over a Keelson purchase stands: the party
        at fault, the `Verdict` both TEE legs signed, the time from the
        dispute's arrival to its verdict, and the operator's amber commitment
        with any conviction of it. No authentication; it holds no personal data,
        so what the operator attested is left out."
      parameters:
        - schema:
            type: string
            pattern: ^PP-[A-Z]-[0-9A-Za-z-]{1,40}$
          required: true
          name: id
          in: path
      responses:
        "200":
          description: The dispute
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DisputeStatus"
        "404":
          description: No dispute with this id over a Keelson purchase
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/passkeys:
    get:
      operationId: listPasskeys
      tags:
        - passkeys
      summary: List the signed-in user's passkeys
      description: The credentials a mandate can be signed with, oldest first.
      security:
        - session: []
      responses:
        "200":
          description: The passkeys
          content:
            application/json:
