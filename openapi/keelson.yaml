  parameters: {}
paths:
  /health:
    get:
      tags:
        - system
      summary: Liveness probe
      responses:
        "200":
          description: The service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                required:
                  - status
  /status:
    get:
      tags:
        - system
      summary: Dependency status
      responses:
        "200":
          description: Status of the service and its dependencies; always 200
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                      - degraded
                  dependencies:
                    type: object
                    properties:
                      db:
                        type: string
                        enum:
                          - up
                          - down
                      kv:
                        type: string
                        enum:
                          - up
                          - down
                      teeA:
                        type: string
                        enum:
                          - up
                          - down
                      teeB:
                        type: string
                        enum:
                          - up
                          - down
                      relayer:
                        type: object
                        properties:
                          status:
                            type: string
                            enum:
                              - up
                              - down
                              - degraded
                          chains:
                            type: array
                            items:
                              type: object
                              properties:
                                chainId:
                                  type: integer
                                status:
                                  type: string
                                  enum:
                                    - up
                                    - down
                                    - degraded
                                address:
                                  type: string
                                balanceWei:
                                  type: string
                                nextNonce:
                                  type: string
                                pending:
                                  type: integer
                                baseFeeWei:
                                  type: string
                              required:
                                - chainId
                                - status
                                - address
                                - pending
                        required:
                          - status
                          - chains
                      log:
                        type: object
                        properties:
                          status:
                            type: string
                            enum:
                              - up
                              - down
                          origins:
                            type: array
                            items:
                              type: object
                              properties:
                                origin:
                                  type: string
                                size:
                                  type: integer
                                checkpointAgeMs:
                                  type: integer
                              required:
                                - origin
                                - size
                                - checkpointAgeMs
                        required:
                          - status
                          - origins
                      paypal:
                        type: object
                        properties:
                          status:
                            type: string
                            enum:
                              - up
                              - down
                          environment:
                            type: string
                            enum:
                              - sandbox
                              - production
                        required:
                          - status
                          - environment
                      webhooks:
                        type: object
                        properties:
                          status:
                            type: string
                            enum:
                              - up
                              - down
                          lastWebhookAgeMs:
                            type: integer
                          lastPollAgeMs:
                            type: integer
                        required:
                          - status
                      anchor:
                        type: object
                        properties:
                          status:
                            type: string
                            enum:
                              - up
                              - down
                          environment:
                            type: string
                            enum:
                              - arbitrum-sepolia
                          size:
                            type: string
                          anchoredAgeMs:
                            type: integer
                        required:
                          - status
                          - environment
                    required:
                      - db
                      - kv
                  rpc:
                    type: object
                    properties:
                      calls:
                        type: array
                        items:
                          type: object
                          properties:
                            provider:
                              type: string
                            method:
                              type: string
                            calls:
                              type: integer
                          required:
                            - provider
                            - method
                            - calls
                    required:
                      - calls
                  version:
                    type: string
                required:
                  - status
                  - dependencies
                  - rpc
                  - version
  /v1/events:
    get:
      tags:
        - events
      summary: Stream events
      description: Server-sent events for one channel. Send `Last-Event-ID` to replay
        the events after that id before going live.
      parameters:
        - schema:
            type: string
            description: "`public:<name>`, or the caller's own namespace
              `<base64url(kind:subject)>` with an optional `:<suffix>`."
          required: true
          description: "`public:<name>`, or the caller's own namespace
            `<base64url(kind:subject)>` with an optional `:<suffix>`."
          name: channel
          in: query
        - schema:
            type: string
          required: false
          name: last-event-id
          in: header
      responses:
        "200":
          description: An event stream; each event carries the row id, the channel and a
            JSON payload
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          description: Invalid channel or Last-Event-ID
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Not authenticated
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: The channel belongs to another principal
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Too many concurrent streams for this principal
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/mandates:
