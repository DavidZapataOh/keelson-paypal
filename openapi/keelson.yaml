                `failed` one, or of one Keelson's treasury paid instead."
            paid_by:
              type:
                - string
                - "null"
              enum:
                - chain
                - treasury
                - violation-pool
                - null
              description: "`chain`: the operator's bond or Keelson's reserve paid.
                `violation-pool`: the operator's `ViolationBondPool` deposit
                paid the merchant on a court's conviction, with no verdict.
                `treasury`: the chain refused a verdict that still holds (its
                window or deadline had passed), so Keelson's treasury pays the
                payee itself, PYUSD on chain or a PayPal Payout; the settlement
                is paid once `outcome` is `paid`."
            refund_id:
              type:
                - string
                - "null"
              description: The buyer's PayPal refund; its `custom_id` is the verdict's `ksv1.`
                reference.
            tx_hash:
              type:
                - string
                - "null"
            explorer_url:
              type:
                - string
                - "null"
            ready_at:
              type:
                - string
                - "null"
              format: date-time
            payout_batch_id:
              type:
                - string
                - "null"
            payout_status:
              type:
                - string
                - "null"
            settled_at:
              type:
                - string
                - "null"
              format: date-time
          required:
            - rail
            - outcome
            - failure
            - paid_by
            - refund_id
            - tx_hash
            - explorer_url
            - ready_at
            - payout_batch_id
            - payout_status
            - settled_at
        responses:
          type: array
          items:
            type: object
            properties:
              action:
                type: string
                enum:
                  - provide_evidence
                  - send_message
                  - accept_claim
              stage:
                type: string
                description: PayPal's lifecycle stage when it was sent.
              evidence_types:
                type: array
                items:
                  type: string
              drafted_by:
                type:
                  - string
                  - "null"
                enum:
                  - model
                  - template
                  - null
                description: "`model` when the statement was drafted with citations; `template`
                  when the rule's fixed statement was sent. Null for an accepted
                  claim."
              citations:
                type: integer
                description: "How many passages of the Alibi and the verdict the statement
                  cites. The statement itself is not public: it quotes the
                  purchase's Alibi."
              sent_at:
                type: string
                format: date-time
            required:
              - action
              - stage
              - evidence_types
              - drafted_by
              - citations
              - sent_at
          description: What Keelson sent PayPal for the party at fault. The action and the
            evidence types follow from the rule; a model only drafts the text.
        amber:
          $ref: "#/components/schemas/AmberCase"
      required:
        - dispute_id
        - purchase_id
        - state
        - reason
        - received_at
        - attributed_at
        - elapsed_ms
        - liable
        - parties
        - verdict
        - settlement
        - responses
        - amber
    AmberCase:
      type:
        - object
        - "null"
      properties:
        commitment:
          type: string
          pattern: ^0x[0-9a-f]+$
          description: "The `amberCommitment` the operator signed into the coverage:
            Poseidon2 over the product page, the fields below and a salt."
        attested:
          type:
            - object
            - "null"
          properties:
            url:
              type: string
              format: uri
              description: The store's JSON page for the SKU.
            sku:
              type: string
            size:
              type: string
            color:
              type: string
            unit_minor:
              type: string
              pattern: ^\d+$
            returns_free:
              type: boolean
          required:
            - url
            - sku
            - size
            - color
            - unit_minor
            - returns_free
          description: "What the operator attested. Null on the public dispute read: what
            was bought stays with the consoles."
        conviction:
          type:
            - object
            - "null"
          properties:
            field:
              type: string
              enum:
                - size
                - color
                - unit_price
                - returns_free
            attested_value:
              type:
                - string
                - "null"
              description: What the operator attested of the field, which the store's answer
                contradicts. Null on the public dispute read.
            proven_at:
              type: string
              format: date-time
            web_fact_digest:
              type: string
              pattern: ^0x[0-9a-f]+$
              description: The EIP-712 digest of the `WebFact` leg A signed over the store's
                answer.
            captured_at:
              type:
                - string
                - "null"
              format: date-time
            tx_hash:
              type: string
              pattern: ^0x[0-9a-f]+$
            explorer_url:
              type: string
              format: uri
            proof:
              type:
                - object
                - "null"
              properties:
                bytes:
                  type: integer
                hash:
                  type: string
                  pattern: ^0x[0-9a-f]+$
                  description: keccak256 of the proof.
                public_inputs:
                  type: array
                  items:
                    type: string
                    pattern: ^0x[0-9a-f]+$
                  description: "`range_hi, range_lo, amber_commitment, product, field_id`, as the
                    court gave the verifier."
              required:
                - bytes
                - hash
                - public_inputs
          required:
            - field
            - attested_value
            - proven_at
            - web_fact_digest
            - captured_at
            - tx_hash
            - explorer_url
            - proof
          description: "`AmberContradictionCourt`'s conviction on Arbitrum Sepolia: a C2b
            proof that the store's own answer, notarized by leg A, holds another
            value of `field`. Null while there is none."
      required:
        - commitment
        - attested
        - conviction
      description: What the operator attested about the item it bought, and whether it
        was proven false. Null when the purchase carries no attestation (a cart
        of several lines, or bought before attestations).
