title = "Keelson gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "Published test vectors: hashes, public keys and signed credentials generated for the golden-vector suite"
paths = [
  '''packages/mandate/test/vectors/.*\.json''',
  '''packages/mandate/test/commitment\.test\.ts''',
]

[[allowlists]]
description = "Throwaway keys of the countersign golden vectors, and the public key provider id in the CVM's compose file"
paths = [
  '''packages/core/test/vectors/countersign\.json''',
  '''engine/tee/phala/app-compose\.json''',
]

[[allowlists]]
description = "Coverage vectors captured from the live TEE legs: public passkey assertions, key hashes and countersignatures"
paths = [
  '''contracts/test/vectors/coverage-.*\.json''',
]

[[allowlists]]
description = "The C1 circuit's public artifacts: its compiled program, verification key and CRS points, and the demo proof and witness (the demo mandate's public fields with the fixed salt 0x01..0x10, no key)"
paths = [
  '''engine/tee/zk/.*''',
  '''packages/alibi/src/verify/c1-vk\.ts''',
  '''contracts/test/vectors/c1-proof\.json''',
  '''circuits/c1/(Prover(_[a-z]+)?\.toml|src/vectors\.nr)''',
]

[[allowlists]]
description = "The C2a circuit's public artifacts: its verification key, the demo mandate's prover inputs (fixed salt 0x01..0x10, no key) and a proof of each violation class"
paths = [
  '''circuits/c2a/(mandate_violation\.vk|Prover_[a-z]+\.toml|src/vectors\.nr)''',
  '''contracts/test/vectors/c2a-[a-z-]+\.json''',
]

[[allowlists]]
description = "Public contract addresses in the per-chain deployment registries and the bindings generated from them"
paths = [
  '''contracts/deployments/.*\.json''',
  '''packages/chain/src/addresses\.ts''',
]

[[allowlists]]
description = "Alibis and their public receipts of sandbox purchases captured from the deployed API: public attestations, timestamp tokens, passkey assertions, log proofs and sandbox PayPal ids"
paths = [
  '''packages/alibi/test/fixtures/.*\.alibi''',
  '''packages/alibi/test/fixtures/.*\.receipt''',
]

[[allowlists]]
description = "A public Alibi receipt and the composed proof of a sandbox purchase, as the public API serves them: hashes, signatures and proof bytes, no key"
paths = [
  '''packages/alibi/test/fixtures/01M73AGWP5EJSW35XE6Q090MCH\.(receipt|anonymous\.json)''',
]

[[allowlists]]
description = "The engine SP1 program's public verifying key, pinned where proofs of it are checked"
condition = "AND"
paths = [
  '''packages/alibi/src/verify/engine-vk\.ts''',
  '''services/api/src/zk/engine\.ts''',
]
regexes = [
  '''0x002239e16cb091e30fe341ef30ed323dc2064c7afcb39e4aa63e6fa1b9961a55''',
]

[[allowlists]]
description = "A public SP1 Groth16 proof of the committed countersign vector: proof bytes, public values and the program's verifying key, no key"
paths = [
  '''contracts/test/vectors/engine-proof\.json''',
]
